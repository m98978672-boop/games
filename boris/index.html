<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0b0d">
  <meta name="description" content="Борис Видео — каталог серий, Shorts и авторских роликов. Смотреть онлайн, продолжать просмотр и сохранять видео.">
  <title>Борис Видео — видеобиблиотека</title>
  <script src="../shared/engine.js"></script>
  <link rel="stylesheet" href="site.css">
  <script src="../shared/engine-bootstrap.js" defer></script>
  <script src="videos.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <button class="icon-button menu-toggle" id="sidebarToggle" type="button" aria-label="Открыть меню" aria-expanded="false" title="Меню">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <a class="brand" href="./index.html" data-home aria-label="Борис Видео — главная">
        <span class="brand-mark"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6.8v10.4L18 12z"/></svg></span>
        <span class="brand-name">БОРИС<span>ВИДЕО</span></span>
        <span class="brand-region">RU</span>
      </a>
    </div>

    <form class="searchbar" id="searchForm" role="search">
      <label class="sr-only" for="searchInput">Поиск видео</label>
      <div class="search-field">
        <svg class="search-field-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.4"/><path d="m16 16 4 4"/></svg>
        <input id="searchInput" type="search" placeholder="Поиск видео" autocomplete="off">
        <button id="clearSearch" class="search-clear" type="button" aria-label="Очистить поиск" hidden>×</button>
      </div>
      <button class="search-submit" type="submit" aria-label="Искать">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.4"/><path d="m16 16 4 4"/></svg>
      </button>
    </form>

    <div class="topbar-actions">
      <button class="icon-button mobile-search-toggle" id="mobileSearchToggle" type="button" aria-label="Показать поиск">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.4"/><path d="m16 16 4 4"/></svg>
      </button>
      <button class="icon-button history-shortcut" type="button" data-view="history" aria-label="История просмотров" title="История">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11a8.5 8.5 0 1 1 2.1 5.7M3.5 5.2v5.9h5.8M12 7v5l3.3 2"/></svg>
      </button>
      <button class="profile-button" type="button" data-view="home" aria-label="Профиль: локальная библиотека">Б</button>
    </div>
  </header>

  <aside class="sidebar" id="sidebar" aria-label="Главное меню">
    <nav class="side-nav" aria-label="Разделы">
      <button class="nav-item is-active" type="button" data-view="home" title="Главная">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3.5 10.5 8.5-7 8.5 7v9a1.5 1.5 0 0 1-1.5 1.5h-14a1.5 1.5 0 0 1-1.5-1.5z"/><path d="M9 21v-7h6v7"/></svg><span>Главная</span>
      </button>
      <button class="nav-item" type="button" data-view="series" title="Серии Бориса">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4" width="17" height="16" rx="2"/><path d="m10 8 6 4-6 4z"/></svg><span>Серии Бориса</span>
      </button>
      <button class="nav-item" type="button" data-view="shorts" title="Shorts">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.7 3.2 7.4 7.4a3 3 0 0 0 .2 5.2l4.7 2.6-2.9 1.7a2.1 2.1 0 0 0 2.1 3.6l5.1-2.9a4.1 4.1 0 0 0-.1-7.2L12 7.8l4.8-2.7a1.1 1.1 0 0 0-2.1-1.9z"/><path d="m9.6 8.7 4.5 2.5"/></svg><span>Shorts</span>
      </button>
      <button class="nav-item" type="button" data-view="chess" title="Квеня и шахматы">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 21h12M8 21l1-4h6l1 4M9 17l-1-4 2-2-2-3 4-4 2 4-1 3 3 2-1 4"/></svg><span>Квеня и шахматы</span>
      </button>
      <button class="nav-item" type="button" data-view="meme" title="Похождения Балтики 0">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="3.5" width="10" height="17" rx="3"/><path d="M8.5 7h7M8.5 16.5h7M12 9.5v4"/></svg><span>Балтика 0 · пролог</span>
      </button>
    </nav>

    <div class="sidebar-rule"></div>
    <nav class="side-nav side-library" aria-label="Ваша библиотека">
      <div class="side-heading">Ваша библиотека <span aria-hidden="true">›</span></div>
      <button class="nav-item" type="button" data-view="history" title="История">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11a8.5 8.5 0 1 1 2.1 5.7M3.5 5.2v5.9h5.8M12 7v5l3.3 2"/></svg><span>История</span>
      </button>
      <button class="nav-item" type="button" data-view="later" title="Смотреть позже">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4.5h12v16l-6-4-6 4z"/></svg><span>Смотреть позже</span>
      </button>
      <button class="nav-item" type="button" data-view="liked" title="Понравившиеся">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.5 10.5 11 4a1.9 1.9 0 0 1 3.5 1.2l-.6 3.8h4.3a2 2 0 0 1 1.9 2.6l-2 7a2 2 0 0 1-1.9 1.4H8.5M4 10h3.5v10H4z"/></svg><span>Понравившиеся</span>
      </button>
    </nav>

    <div class="sidebar-rule"></div>
    <div class="subscriptions">
      <div class="side-heading">Каналы</div>
      <button class="subscription-item" type="button" data-view="series"><span class="mini-avatar avatar-boris">Б</span><span>Борис</span><i></i></button>
      <button class="subscription-item" type="button" data-view="chess"><span class="mini-avatar avatar-chess">К</span><span>Квеня · Зуза</span><i></i></button>
      <button class="subscription-item" type="button" data-view="meme"><span class="mini-avatar avatar-baltika">0</span><span>Балтика 0</span><i class="is-new"></i></button>
    </div>

    <div class="sidebar-footer">
      <p>Плеер и история работают локально в этом браузере.</p>
      <span class="engine-hud-slot" data-engine-badge aria-label="Версия движка"></span>
      <span class="engine-version">RatCore <span data-engine-version="short"></span></span>
      <span class="copyright">© Борис Видео</span>
    </div>
  </aside>
  <button class="sidebar-shade" id="sidebarShade" type="button" aria-label="Закрыть меню" tabindex="-1"></button>

  <main class="main-content" id="mainContent">
    <div class="mobile-search-panel" id="mobileSearchPanel">
      <form class="searchbar mobile-searchbar" id="mobileSearchForm" role="search">
        <label class="sr-only" for="mobileSearchInput">Поиск видео</label>
        <div class="search-field">
          <svg class="search-field-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.4"/><path d="m16 16 4 4"/></svg>
          <input id="mobileSearchInput" type="search" placeholder="Поиск видео" autocomplete="off">
        </div>
        <button class="search-submit" type="submit" aria-label="Искать"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.4"/><path d="m16 16 4 4"/></svg></button>
      </form>
    </div>
    <div class="chip-bar" id="chipBar" aria-label="Категории видео"></div>
    <div class="page-content" id="pageContent" aria-live="polite">
      <div class="loading-state"><span class="loading-spinner"></span><span>Загружаем видеотеку…</span></div>
    </div>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
