<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ратград — белый холст</title>
<style>
  :root{ --ink:#0b0b0b; --line:#d8d8d8; --mute:#6b6b6b; --ok:#0a7d2c; --bad:#b00020; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; background:#fff; color:var(--ink);
    font:13px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  header{ display:flex; align-items:baseline; gap:16px; padding:10px 14px; border-bottom:1px solid var(--line); }
  header h1{ font-size:14px; margin:0; font-weight:600; letter-spacing:.02em; }
  header .hint{ color:var(--mute); font-size:12px; }
  main{ display:grid; grid-template-columns:1fr 400px; height:calc(100vh - 42px); }
  @media (max-width:900px){ main{ grid-template-columns:1fr; grid-template-rows:1fr auto; height:auto; } }
  #stage{ position:relative; border-right:1px solid var(--line); overflow:hidden; }
  canvas{ display:block; width:100%; height:100%; background:#fff; cursor:crosshair; touch-action:none; }
  #status{ position:absolute; left:10px; bottom:8px; font-size:11px; color:var(--mute); background:#fff; padding:2px 6px; border:1px solid var(--line); }
  aside{ display:flex; flex-direction:column; min-height:0; }
  .tabs{ display:flex; flex-wrap:wrap; border-bottom:1px solid var(--line); }
  .tabs button{ flex:0 0 auto; font:inherit; background:#fff; color:var(--ink); border:0; border-right:1px solid var(--line);
    padding:7px 10px; cursor:pointer; }
  .tabs button[aria-selected="true"]{ background:#0b0b0b; color:#fff; }
  .panes{ flex:1; overflow:auto; padding:12px 14px; }
  .pane{ display:none; } .pane.on{ display:block; }
  h2{ font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--mute); margin:14px 0 6px; font-weight:600; }
  h2:first-child{ margin-top:0; }
  table{ width:100%; border-collapse:collapse; font-size:12px; }
  td,th{ text-align:left; padding:3px 4px; border-bottom:1px solid #eee; vertical-align:top; }
  th{ color:var(--mute); font-weight:500; }
  .rec{ display:block; padding:8px; border:1px solid var(--line); background:#fafafa; word-break:break-all; margin:4px 0 8px; }
  .kv{ display:grid; grid-template-columns:132px 1fr; gap:2px 8px; font-size:12px; }
  .kv span:nth-child(odd){ color:var(--mute); }
  .ok{ color:var(--ok); } .bad{ color:var(--bad); }
  label.row{ display:flex; align-items:center; gap:8px; margin:5px 0; }
  label.row input[type=range]{ flex:1; }
  input[type=number], input[type=text]{ width:80px; font:inherit; border:1px solid var(--line); padding:2px 4px; }
  input[type=text]{ width:100%; }
  .chips{ display:flex; flex-wrap:wrap; gap:10px; margin:6px 0 10px; }
  .chips label{ display:flex; gap:5px; align-items:center; }
  button.act{ font:inherit; border:1px solid var(--ink); background:#fff; padding:4px 9px; cursor:pointer; }
  button.act:active{ background:#0b0b0b; color:#fff; }
  #log{ white-space:pre-wrap; font-size:11.5px; color:#333; }
  .muted{ color:var(--mute); }
</style>
</head>
<body>
<header>
  <h1>РАТГРАД · белый холст</h1>
  <span class="hint">формулы F-71…F-89 по промту §35–§36 · без моделей и красок</span>
</header>
<main>
  <div id="stage">
    <canvas id="c"></canvas>
    <div id="status">—</div>
  </div>
  <aside>
    <div class="tabs" role="tablist">
      <button role="tab" aria-selected="true" data-tab="col">Столб</button>
      <button role="tab" aria-selected="false" data-tab="face">Грань</button>
      <button role="tab" aria-selected="false" data-tab="q">QООВЗ</button>
      <button role="tab" aria-selected="false" data-tab="f">Формулы</button>
      <button role="tab" aria-selected="false" data-tab="log">Журнал</button>
    </div>
    <div class="panes">
      <section class="pane on" id="pane-col"></section>
      <section class="pane" id="pane-face"></section>
      <section class="pane" id="pane-q"></section>
      <section class="pane" id="pane-f"></section>
      <section class="pane" id="pane-log"><div id="log"></div></section>
    </div>
  </aside>
</main>
<script src="site/core.js"></script>
<script src="site/app.js"></script>
</body>
</html>
