<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Атлас Ратграда — крутилка алгоритмов (1008 случаев)</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --panel2: #1c2430;
    --line: #2a3441;
    --ink: #e6edf3;
    --dim: #93a1b1;
    --accent: #d8b26a;
    --good: #6cc08b;
    --bad: #e07a7a;
    --blue: #7aa7e0;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: radial-gradient(1200px 600px at 70% -10%, #1b2534 0%, var(--bg) 60%);
    color: var(--ink);
    font: 15px/1.5 "Segoe UI", "Inter", system-ui, sans-serif;
  }
  header {
    padding: 18px 22px 12px;
    border-bottom: 1px solid var(--line);
    display: flex;
    gap: 18px;
    align-items: baseline;
    flex-wrap: wrap;
  }
  header h1 { margin: 0; font-size: 19px; letter-spacing: .3px; }
  header h1 span { color: var(--accent); }
  header .sub { color: var(--dim); font-size: 13px; }
  .wrap {
    display: grid;
    grid-template-columns: 340px 1fr;
    gap: 18px;
    padding: 18px 22px 40px;
    align-items: start;
  }
  @media (max-width: 900px) {
    .wrap { grid-template-columns: 1fr; }
    .side { max-height: none !important; }
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px 16px;
  }
  .card h2 {
    margin: 0 0 10px;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: .12em;
    color: var(--dim);
    font-weight: 600;
  }
  .side { max-height: calc(100vh - 150px); display: flex; flex-direction: column; gap: 12px; }
  input[type="search"], input[type="number"] {
    width: 100%;
    background: var(--panel2);
    border: 1px solid var(--line);
    color: var(--ink);
    border-radius: 8px;
    padding: 9px 11px;
    font: inherit;
  }
  #case-list { overflow: auto; display: flex; flex-direction: column; gap: 6px; padding-right: 4px; }
  .case {
    text-align: left;
    background: var(--panel2);
    border: 1px solid transparent;
    color: var(--ink);
    border-radius: 9px;
    padding: 8px 10px;
    cursor: pointer;
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 2px 8px;
    font: inherit;
  }
  .case:hover { border-color: #3a4756; }
  .case.active { border-color: var(--accent); background: #241f16; }
  .case .cid { color: var(--accent); font-variant-numeric: tabular-nums; font-size: 12px; }
  .case .cname { font-size: 13px; }
  .case .cwin { grid-column: 2; color: var(--dim); font-size: 12px; }
  .hint { color: var(--dim); font-size: 12px; margin: 6px 0 0; }
  .main { display: flex; flex-direction: column; gap: 14px; }
  .run-head { display: flex; gap: 14px; align-items: baseline; flex-wrap: wrap; }
  .run-head h2 { margin: 0; font-size: 18px; text-transform: none; letter-spacing: 0; color: var(--ink); }
  .pill { background: var(--panel2); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; font-size: 12px; color: var(--dim); }
  ol#path { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  ol#path li { padding: 7px 10px; border-radius: 8px; border: 1px solid transparent; }
  ol#path .start { background: #1d2a22; border-color: #2c4437; color: #b9e3c6; }
  ol#path .end { background: #2a2118; border-color: #4a3a22; color: #f0d6a8; font-weight: 600; }
  ol#path .step { background: var(--panel2); }
  ol#path .step b { color: var(--dim); font-weight: 500; margin-right: 6px; font-size: 12px; }
  ol#path .branch { margin-left: 18px; font-size: 14px; display: flex; gap: 10px; flex-wrap: wrap; align-items: baseline; }
  ol#path .branch.yes { border-left: 2px solid var(--good); }
  ol#path .branch.no { border-left: 2px solid #4a5568; }
  ol#path .branch .q { color: var(--blue); }
  ol#path .branch .a { color: var(--ink); }
  ol#path .branch .tag { margin-left: auto; font-size: 11px; color: var(--dim); border: 1px solid var(--line); border-radius: 999px; padding: 0 7px; }
  .fx-row { display: flex; gap: 10px; flex-wrap: wrap; }
  .fx { background: var(--panel2); border: 1px solid var(--line); border-radius: 9px; padding: 8px 12px; min-width: 104px; }
  .fx span { display: block; color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; }
  .fx b { font-size: 17px; font-variant-numeric: tabular-nums; }
  .fx.good b { color: var(--good); }
  .fx.bad b { color: var(--bad); }
  .controls { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; }
  .controls label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--dim); width: 130px; }
  button.act {
    background: var(--accent);
    color: #1b1408;
    border: 0;
    border-radius: 9px;
    padding: 10px 16px;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  button.act.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  button.act:hover { filter: brightness(1.08); }
  .facts { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--dim); }
  .facts label { display: flex; gap: 6px; align-items: center; }
  .det { font-size: 12px; }
  .det.ok { color: var(--good); }
  .det.bad { color: var(--bad); }
  .because { color: #cbd6e2; background: var(--panel2); border-radius: 8px; padding: 9px 11px; border-left: 2px solid var(--blue); font-size: 14px; }
  ul.top { margin: 6px 0; padding-left: 18px; color: var(--dim); font-size: 13px; }
  ul.top span { color: var(--accent); font-variant-numeric: tabular-nums; }
  details summary { cursor: pointer; color: var(--dim); font-size: 13px; }
  pre#raw { white-space: pre-wrap; font-size: 12.5px; color: var(--dim); margin: 8px 0 0; }
  .grid2 { display: grid; grid-template-columns: 1fr 320px; gap: 14px; }
  @media (max-width: 1100px) { .grid2 { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1>Атлас Ратграда · <span>крутилка алгоритмов</span></h1>
  <span class="sub"><b id="case-count">1008</b> случаев поведения · каждому дню — свой алгоритм (§32.5)</span>
</header>

<div class="wrap">
  <div class="side">
    <div class="card">
      <h2>Случай <span id="found-count" style="color:var(--accent)"></span></h2>
      <input id="search" type="search" placeholder="Поиск: R-0420, рыбак, больница…" autocomplete="off">
    </div>
    <div class="card" id="case-list" style="flex:1"></div>
  </div>

  <div class="main">
    <div class="card">
      <div class="run-head">
        <h2 id="run-title">R-0001</h2>
        <span class="pill" id="run-window"></span>
        <span class="det" id="determinism"></span>
      </div>
      <div class="controls" style="margin:12px 0">
        <label>Сид мира <input id="seed" type="number" value="1" min="1"></label>
        <label>День <input id="day" type="number" value="1" min="1"></label>
        <button class="act" id="next-day">Следующий день →</button>
        <button class="act ghost" id="reseed">Другой мир</button>
      </div>
      <div class="facts">
        <span>Факты мира:</span>
        <label><input type="checkbox" data-fact="weather"> плохая погода</label>
        <label><input type="checkbox" data-fact="road"> пробки</label>
        <label><input type="checkbox" data-fact="money"> нет денег</label>
        <label><input type="checkbox" data-fact="health"> нездоровье</label>
      </div>
    </div>

    <div class="grid2">
      <div class="card">
        <h2>Путь дня</h2>
        <ol id="path"></ol>
        <p class="because" id="because"></p>
        <p class="hint" id="variety"></p>
        <details>
          <summary>Текст пути (то, что видит журнал)</summary>
          <pre id="raw"></pre>
        </details>
      </div>
      <div class="card">
        <h2>Последствия</h2>
        <div class="fx-row" id="effects"></div>
        <h2 style="margin-top:16px">День целиком</h2>
        <div id="day-stats"></div>
      </div>
    </div>
  </div>
</div>
