    <text x="98" y="740" font-size="20" fill="#6b6b6b">(0;0)H3(0,0;0,0) · ID 64 бита · QООВЗ</text>
    <text x="662" y="600" font-size="16" fill="#6b6b6b">Q = центр + радиус + прямоугольник камеры</text>
    <text x="336" y="386" font-size="16" fill="#6b6b6b">p=3 · H=9 м</text>
    <text x="606" y="322" font-size="16" fill="#6b6b6b">p=6 · H=18 м</text>
