  <!-- QООВЗ -->
  <circle cx="820" cy="405" r="250" fill="none" stroke="#0b0b0b" stroke-width="2" stroke-dasharray="10 8"/>
  <rect x="640" y="245" width="360" height="320" fill="none" stroke="#8a8a8a" stroke-width="1.6"/>

