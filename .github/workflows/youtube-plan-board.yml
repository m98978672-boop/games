name: Review plan board (read-only, no uploads)

# Keeps one issue up to date with everything scheduled for the next days, so the
# owner can see the plan from a phone without opening a run or its logs. This
# workflow only reads the queue: it never renders, reserves or uploads.

on:
  schedule:
    # Refresh shortly after every publication slot moves into the past, and once
    # more at the start of the Moscow day.
    - cron: "15 3,7,11,15,19,21,22,23 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  issues: write

jobs:
  board:
    if: github.repository == 'm98978672-boop/games'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Build the plan from the private queue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BOARD_DAYS: "2"
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/board"
          # A read failure still produces a report that says so; it must never
          # look like "everything is fine" or "everything is free".
          python youtube-bot/reconcile_schedule.py --days "${BOARD_DAYS}" \
            > "$RUNNER_TEMP/board/plan.md" || true
          if [ ! -s "$RUNNER_TEMP/board/plan.md" ]; then
            printf '## Что выйдет в ближайшие дни\n\nОчередь прочитать не удалось. Ничего не запущено.\n' \
              > "$RUNNER_TEMP/board/plan.md"
          fi
          {
            cat "$RUNNER_TEMP/board/plan.md"
            echo
            echo "---"
            echo "Обновлено: $(TZ=Europe/Moscow date '+%d.%m %H:%M') МСК. "
            echo "Это только чтение: доска ничего не рендерит и не загружает."
          } > "$RUNNER_TEMP/board/issue.md"
          cat "$RUNNER_TEMP/board/issue.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Update the pinned plan issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: "План видео"
        run: |
          set -euo pipefail
          # Find the board by title; a missing one is recreated below.
          number=$(gh issue list --state open --limit 100 --json number,title \
            --jq '.[] | select(.title == "План видео") | .number' | head -n 1)
          if [ -z "${number}" ]; then
            gh issue create --title "План видео" \
              --body-file "$RUNNER_TEMP/board/issue.md" > /dev/null
            echo "Доска создана заново." >> "$GITHUB_STEP_SUMMARY"
          else
            gh issue edit "${number}" --body-file "$RUNNER_TEMP/board/issue.md"
            echo "Доска #${number} обновлена." >> "$GITHUB_STEP_SUMMARY"
          fi
