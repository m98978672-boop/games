name: YouTube experimental smoke checks

on:
  pull_request:
    paths:
      - 'youtube-bot/gameplay/**'
      - 'youtube-bot/gameplay_2048.py'
      - 'youtube-bot/gameplay_bridge.py'
      - 'youtube-bot/gameplay_qwen.py'
      - 'youtube-bot/prepare_kvenya_adapter.py'
      - 'youtube-bot/gameplay_finalize.py'
      - 'youtube-bot/gameplay_captions.py'
      - 'youtube-bot/gameplay_edit.py'
      - 'youtube-bot/gameplay_release_plan.py'
      - 'youtube-bot/game_reviews.py'
      - 'youtube-bot/renderer.py'
      - 'youtube-bot/script_contract.py'
      - 'youtube-bot/tests/smoke_*.py'
      - '.github/workflows/youtube-experimental-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gameplay-capture:
    # Never expose upload credentials to downloaded game code. This is a private
    # short technical recording test, not a publication or rights approval.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install video verifier
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu-core
          python -m pip install 'Pillow>=10.4,<13.0'
      - name: Verify long-review CFR from real FFmpeg chapters
        run: python youtube-bot/tests/smoke_render_fps.py
      - name: Split synthetic recorded video and verify subtitles
        run: python youtube-bot/tests/smoke_gameplay_edit.py
      - name: Test deterministic 2048 self-play emulator
        run: node youtube-bot/gameplay/test-simulator2048.cjs
      - name: Render complete ten-chapter long pipeline at reduced test resolution
        run: python youtube-bot/tests/smoke_long_pipeline.py
      - name: Build isolated recording container
        run: docker build -t games-playthrough-2048-experiment:1 youtube-bot/gameplay
      - name: Test vision-action bridge against a sandboxed browser game
        run: python youtube-bot/tests/smoke_browser_bridge.py
      - name: Capture actual gameplay and verify recording
        shell: bash
        run: |
          set +e
          python youtube-bot/tests/smoke_gameplay_2048.py > "$RUNNER_TEMP/gameplay-smoke.log" 2>&1
          result=$?
          cat "$RUNNER_TEMP/gameplay-smoke.log"
          if [ "$result" -ne 0 ]; then
            python youtube-bot/tests/smoke_annotation.py "$RUNNER_TEMP/gameplay-smoke.log"
          fi
          exit "$result"

  review-video:
    # Synthetic source material; no channel credentials or publishing.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install video and local voice dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install 'Pillow>=10.4,<13.0' 'piper-tts==1.3.0' 'imageio-ffmpeg>=0.5,<1.0'
      - name: Download Russian voice for the private smoke test
        run: |
          curl --fail --location --retry 5 --retry-all-errors --connect-timeout 30 --max-time 600 -o "$RUNNER_TEMP/voice.onnx" https://huggingface.co/rhasspy/piper-voices/resolve/main/ru/ru_RU/irina/medium/ru_RU-irina-medium.onnx
          curl --fail --location --retry 5 --retry-all-errors --connect-timeout 30 --max-time 600 -o "$RUNNER_TEMP/voice.onnx.json" https://huggingface.co/rhasspy/piper-voices/resolve/main/ru/ru_RU/irina/medium/ru_RU-irina-medium.onnx.json
      - name: Render and verify a private synthetic Short
        env:
          PIPER_MODEL_PATH: ${{ runner.temp }}/voice.onnx
        shell: bash
        run: |
          set +e
          python youtube-bot/tests/smoke_review_video.py > "$RUNNER_TEMP/review-smoke.log" 2>&1
          result=$?
          cat "$RUNNER_TEMP/review-smoke.log"
          if [ "$result" -ne 0 ]; then
            python youtube-bot/tests/smoke_annotation.py "$RUNNER_TEMP/review-smoke.log"
          fi
          exit "$result"

  qwen-long-script:
    # Synthetic source data, no YouTube upload and no secrets.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: youtube-bot/requirements-autopilot.txt
      - name: Install local Qwen
        run: pip install -r youtube-bot/requirements-autopilot.txt
      - name: Download Russian voice for duration validation
        run: |
          curl --fail --location --retry 5 --retry-all-errors --connect-timeout 30 --max-time 600 -o "$RUNNER_TEMP/voice.onnx" https://huggingface.co/rhasspy/piper-voices/resolve/main/ru/ru_RU/irina/medium/ru_RU-irina-medium.onnx
          curl --fail --location --retry 5 --retry-all-errors --connect-timeout 30 --max-time 600 -o "$RUNNER_TEMP/voice.onnx.json" https://huggingface.co/rhasspy/piper-voices/resolve/main/ru/ru_RU/irina/medium/ru_RU-irina-medium.onnx.json
      - name: Generate and validate a real long script without publishing
        env:
          PIPER_MODEL_PATH: ${{ runner.temp }}/voice.onnx
        shell: bash
        run: |
          set +e
          python youtube-bot/tests/smoke_long_qwen.py > "$RUNNER_TEMP/qwen-smoke.log" 2>&1
          result=$?
          cat "$RUNNER_TEMP/qwen-smoke.log"
          if [ "$result" -ne 0 ]; then
            python youtube-bot/tests/smoke_annotation.py "$RUNNER_TEMP/qwen-smoke.log"
          fi
          exit "$result"

  qwen-gameplay:
    # No OAuth, upload or untrusted game downloads; the model controls a test game.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install Qwen and image dependencies
        run: pip install -r youtube-bot/requirements-autopilot.txt "torchvision>=0.20,<1.0" "transformers==5.5.4" "peft==0.19.1" "accelerate==1.13.0"
      - name: Build isolated browser bridge
        run: docker build -t games-playthrough-2048-experiment:1 youtube-bot/gameplay
      - name: Let real Qwen control the visual test game
        env:
          OMP_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
        shell: bash
        run: |
          set +e
          python youtube-bot/tests/smoke_qwen_gameplay.py > "$RUNNER_TEMP/qwen-gameplay.log" 2>&1
          result=$?
          cat "$RUNNER_TEMP/qwen-gameplay.log"
          if [ "$result" -ne 0 ]; then
            python youtube-bot/tests/smoke_annotation.py "$RUNNER_TEMP/qwen-gameplay.log"
          fi
          exit "$result"
      - name: Fetch and verify pinned Kvenya home adapter
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/kvenya-release"
          gh release download frontline-qwen-home --pattern adapter.tar.gz --dir "$RUNNER_TEMP/kvenya-release"
          python youtube-bot/prepare_kvenya_adapter.py "$RUNNER_TEMP/kvenya-release/adapter.tar.gz" "$RUNNER_TEMP/kvenya-adapter"
      - name: Test Kvenya home adapter in the same games
        env:
          OMP_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
          QWEN_GAME_ADAPTER_PATH: ${{ runner.temp }}/kvenya-adapter
        shell: bash
        run: |
          set +e
          python youtube-bot/tests/smoke_qwen_gameplay.py > "$RUNNER_TEMP/kvenya-gameplay.log" 2>&1
          result=$?
          cat "$RUNNER_TEMP/kvenya-gameplay.log"
          if [ "$result" -ne 0 ]; then
            python youtube-bot/tests/smoke_annotation.py "$RUNNER_TEMP/kvenya-gameplay.log"
          fi
          exit "$result"

      - name: Test Kvenya on a pinned external GitHub game without publishing
        env:
          OMP_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
          QWEN_GAME_ADAPTER_PATH: ${{ runner.temp }}/kvenya-adapter
        shell: bash
        run: |
          set +e
          python youtube-bot/tests/smoke_qwen_github_game.py > "$RUNNER_TEMP/kvenya-github-game.log" 2>&1
          result=$?
          cat "$RUNNER_TEMP/kvenya-github-game.log"
          if [ "$result" -ne 0 ]; then
            python youtube-bot/tests/smoke_annotation.py "$RUNNER_TEMP/kvenya-github-game.log"
          fi
          exit "$result"
