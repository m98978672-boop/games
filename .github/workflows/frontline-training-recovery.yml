# Dormant until the recovery flag is committed. Never runs concurrently with
# the original training run. Resume from the latest verified release slot.
name: Recover interrupted Frontline training
on:
  push:
    branches: [arena/03bf5b1a-games]
    paths: [frontline-command/tools/training/start-recovery.flag]
permissions:
  contents: read
  actions: read
concurrency:
  group: frontline-training-recovery-44671482687
  cancel-in-progress: false
jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Verify the original run has stopped unsuccessfully
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/actions/runs/44671482687" > "$RUNNER_TEMP/original.json"
          python - <<'PY'
          import json,os
          r=json.load(open(os.path.join(os.environ['RUNNER_TEMP'],'original.json')))
          if r['status']!='completed' or r['conclusion'] not in ('failure','cancelled','timed_out'):
              raise RuntimeError('Original run must be completed unsuccessfully before recovery')
          print('Original run stopped:',r['conclusion'])
          PY
  phase-1:
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 358
    permissions:
      contents: write
    env:
      OMP_NUM_THREADS: '2'
      HF_HUB_DISABLE_XET: '1'
      TOKENIZERS_PARALLELISM: 'false'
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TRAINING_RUN_ID: '44671482687'
      PHASE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU dependencies
        run: |
          python -m pip install 'torch==2.8.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'transformers==5.5.4' 'peft==0.19.1' 'accelerate==1.13.0' 'safetensors==0.7.0'
      - name: Train 5 active hours with durable checkpoints
        run: |
          set -o pipefail
          if bash frontline-command/tools/training/run-long-phase.sh 2>&1 | tee "$RUNNER_TEMP/phase.log"; then exit 0; fi
          python -c 'import os; s=open(os.path.join(os.environ["RUNNER_TEMP"],"phase.log"),errors="replace").read()[-5000:]; print("::error::"+s.replace("%","%25").replace("\r","%0D").replace("\n","%0A"))'
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: long-phase-1-recovery
          path: |
            ${{ runner.temp }}/phase.log
            ${{ runner.temp }}/long-work/snapshot/
          if-no-files-found: warn
          retention-days: 30
  phase-2:
    needs: phase-1
    runs-on: ubuntu-latest
    timeout-minutes: 358
    permissions:
      contents: write
    env:
      OMP_NUM_THREADS: '2'
      HF_HUB_DISABLE_XET: '1'
      TOKENIZERS_PARALLELISM: 'false'
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TRAINING_RUN_ID: '44671482687'
      PHASE: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU dependencies
        run: |
          python -m pip install 'torch==2.8.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'transformers==5.5.4' 'peft==0.19.1' 'accelerate==1.13.0' 'safetensors==0.7.0'
      - name: Train 5 active hours with durable checkpoints
        run: |
          set -o pipefail
          if bash frontline-command/tools/training/run-long-phase.sh 2>&1 | tee "$RUNNER_TEMP/phase.log"; then exit 0; fi
          python -c 'import os; s=open(os.path.join(os.environ["RUNNER_TEMP"],"phase.log"),errors="replace").read()[-5000:]; print("::error::"+s.replace("%","%25").replace("\r","%0D").replace("\n","%0A"))'
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: long-phase-2-recovery
          path: |
            ${{ runner.temp }}/phase.log
            ${{ runner.temp }}/long-work/snapshot/
          if-no-files-found: warn
          retention-days: 30
  phase-3:
    needs: phase-2
    runs-on: ubuntu-latest
    timeout-minutes: 358
    permissions:
      contents: write
    env:
      OMP_NUM_THREADS: '2'
      HF_HUB_DISABLE_XET: '1'
      TOKENIZERS_PARALLELISM: 'false'
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TRAINING_RUN_ID: '44671482687'
      PHASE: '3'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU dependencies
        run: |
          python -m pip install 'torch==2.8.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'transformers==5.5.4' 'peft==0.19.1' 'accelerate==1.13.0' 'safetensors==0.7.0'
      - name: Train 5 active hours with durable checkpoints
        run: |
          set -o pipefail
          if bash frontline-command/tools/training/run-long-phase.sh 2>&1 | tee "$RUNNER_TEMP/phase.log"; then exit 0; fi
          python -c 'import os; s=open(os.path.join(os.environ["RUNNER_TEMP"],"phase.log"),errors="replace").read()[-5000:]; print("::error::"+s.replace("%","%25").replace("\r","%0D").replace("\n","%0A"))'
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: long-phase-3-recovery
          path: |
            ${{ runner.temp }}/phase.log
            ${{ runner.temp }}/long-work/snapshot/
          if-no-files-found: warn
          retention-days: 30
  evaluate:
    needs: phase-3
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      OMP_NUM_THREADS: '2'
      HF_HUB_DISABLE_XET: '1'
      TOKENIZERS_PARALLELISM: 'false'
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TRAINING_RUN_ID: '44671482687'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU inference dependencies
        run: |
          python -m pip install 'torch==2.8.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'transformers==5.5.4' 'peft==0.19.1' 'accelerate==1.13.0' 'safetensors==0.7.0'
      - name: Test unseen scenes and commander snapshots
        run: |
          set -o pipefail
          if bash frontline-command/tools/training/evaluate-long.sh 2>&1 | tee "$RUNNER_TEMP/eval.log"; then exit 0; fi
          python -c 'import os; s=open(os.path.join(os.environ["RUNNER_TEMP"],"eval.log"),errors="replace").read()[-5000:]; print("::error::"+s.replace("%","%25").replace("\r","%0D").replace("\n","%0A"))'
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: long-training-evaluation
          path: |
            ${{ runner.temp }}/eval.log
            ${{ runner.temp }}/eval-output/
          if-no-files-found: warn
          retention-days: 30
