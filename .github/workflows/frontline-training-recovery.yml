# Dormant until the recovery flag is committed. Never runs concurrently with
# the original training run. Resume from the latest verified release slot.
name: Recover interrupted Frontline training
on:
  push:
    branches: [arena/03bf5b1a-games]
    paths: [frontline-command/tools/training/start-recovery.flag]
permissions:
  contents: read
  actions: read
concurrency:
  group: frontline-training-recovery-44671482687
  cancel-in-progress: false
jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Verify the original run has stopped unsuccessfully
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/actions/runs/44671482687" > "$RUNNER_TEMP/original.json"
          python - <<'PY'
          import json,os
          r=json.load(open(os.path.join(os.environ['RUNNER_TEMP'],'original.json')))
          if r['status']!='completed' or r['conclusion'] not in ('failure','cancelled','timed_out'):
              raise RuntimeError('Original run must be completed unsuccessfully before recovery')
          print('Original run stopped:',r['conclusion'])
          PY
  smoke:
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OMP_NUM_THREADS: '2'
      HF_HUB_DISABLE_XET: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test data isolation
        run: |
          node frontline-command/tests/long-training-data.mjs
          node frontline-command/tests/commander-training-data.mjs
          python frontline-command/tests/long-schedule.py
          node frontline-command/tools/training/collect-long-training.mjs "$RUNNER_TEMP/data" --quick
      - name: Retrieve and verify existing research adapter
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download frontline-obstacle-v2-44626512571 --pattern frontline-obstacle-v2.tar.gz --dir "$RUNNER_TEMP"
          echo "ba79aaf92c5c4bf11dbb22b3a0b324a834b2aa2f4fa0f376d6d498a02087f4d6  $RUNNER_TEMP/frontline-obstacle-v2.tar.gz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/source"
          tar -xzf "$RUNNER_TEMP/frontline-obstacle-v2.tar.gz" -C "$RUNNER_TEMP/source" adapter
      - name: Install CPU dependencies
        run: |
          python -m pip install 'torch==2.8.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'transformers==5.5.4' 'peft==0.19.1' 'accelerate==1.13.0' 'safetensors==0.7.0'
      - name: Run short staged training and resume
        run: |
          set -euo pipefail
          run() {
            if "$@" 2>&1 | tee "$RUNNER_TEMP/smoke-last.log"; then return 0; fi
            python -c 'import os; s=open(os.path.join(os.environ["RUNNER_TEMP"],"smoke-last.log"),errors="replace").read()[-5000:]; print("::error::"+s.replace("%","%25").replace("\r","%0D").replace("\n","%0A"))'
            return 1
          }
          run python -u frontline-command/tools/training/train-long.py --data "$RUNNER_TEMP/data" --work "$RUNNER_TEMP/one" --initial-adapter "$RUNNER_TEMP/source/adapter" --phase 1 --active-seconds 3600 --max-steps 3 --eval-commands 1 --eval-token-budget 8
          run python -u frontline-command/tools/training/train-long.py --data "$RUNNER_TEMP/data" --work "$RUNNER_TEMP/restart" --resume "$RUNNER_TEMP/one/snapshot" --phase 1 --active-seconds 3600 --max-steps 2 --eval-commands 1 --eval-token-budget 8
          run python -u frontline-command/tools/training/train-long.py --data "$RUNNER_TEMP/data" --work "$RUNNER_TEMP/two" --resume "$RUNNER_TEMP/restart/snapshot" --phase 2 --active-seconds 3600 --max-steps 2 --eval-commands 1 --eval-token-budget 8
          run python -u frontline-command/tools/training/train-long.py --data "$RUNNER_TEMP/data" --work "$RUNNER_TEMP/three" --resume "$RUNNER_TEMP/two/snapshot" --phase 3 --active-seconds 3600 --max-steps 2 --eval-commands 1 --eval-token-budget 8
          run python -u frontline-command/tools/training/train-long.py --data "$RUNNER_TEMP/data" --work "$RUNNER_TEMP/sliced" --resume "$RUNNER_TEMP/one/snapshot" --phase 1 --active-seconds 3600 --attempt-active-seconds 0.001 --max-steps 3 --eval-commands 1 --eval-token-budget 8
          python - 2>&1 <<'PY' | tee "$RUNNER_TEMP/smoke-assert.log"
          import json,os
          t=os.environ['RUNNER_TEMP']; paths=['one','restart','two','three']
          rows=[json.load(open(f'{t}/{x}/snapshot/progress.json')) for x in paths]
          assert [x['phase'] for x in rows]==[1,1,2,3]
          assert [x['steps'] for x in rows]==[3,5,7,9]
          assert all(rows[i]['active_seconds']>rows[i-1]['active_seconds'] for i in range(1,4))
          assert len({x['dataset_sha256'] for x in rows})==1
          assert sum(rows[-1]['task_counts'].values())==9
          sliced=json.load(open(f'{t}/sliced/snapshot/progress.json'))
          assert sliced['phase']==1 and sliced['steps']==4 and sliced['active_seconds']>rows[0]['active_seconds']
          assert sliced['active_seconds']<sliced['phase_start_active']+sliced['phase_budget_seconds']
          assert os.path.isfile(f'{t}/sliced/phase-1-slot-0.tar.gz') and os.path.isfile(f'{t}/sliced/phase-1-slot-1.tar.gz')
          assert not os.path.exists(f'{t}/sliced/phase-1-complete.tar.gz')
          print('::notice::SMOKE_PROGRESS '+json.dumps(rows[-1],separators=(',',':')))
          PY
      - name: Report smoke diagnostics
        if: always()
        run: |
          python - <<'PY'
          import json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          for path in ['smoke-last.log','smoke-assert.log','one/snapshot/progress.json','restart/snapshot/progress.json','two/snapshot/progress.json','three/snapshot/progress.json']:
              file=root/path
              text=file.read_text(errors='replace')[-7000:] if file.exists() else 'MISSING'
              print('::notice title=Smoke '+path+'::'+text.replace('%','%25').replace('\r','%0D').replace('\n','%0A'),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: long-training-smoke
          path: |
            ${{ runner.temp }}/data/
            ${{ runner.temp }}/one/snapshot/progress.json
            ${{ runner.temp }}/restart/snapshot/progress.json
            ${{ runner.temp }}/two/snapshot/progress.json
            ${{ runner.temp }}/three/snapshot/progress.json
          if-no-files-found: warn
          retention-days: 7
  phase-1-first:
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 358
    permissions:
      contents: write
    env:
      OMP_NUM_THREADS: '2'
      HF_HUB_DISABLE_XET: '1'
      TOKENIZERS_PARALLELISM: 'false'
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TRAINING_RUN_ID: '44671482687'
      PHASE: '1'
      ATTEMPT_ACTIVE_SECONDS: '9000'
      EXPECT_PHASE_COMPLETE: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU dependencies
        run: |
          python -m pip install 'torch==2.8.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'transformers==5.5.4' 'peft==0.19.1' 'accelerate==1.13.0' 'safetensors==0.7.0'
      - name: Train up to 2.5 active hours with durable checkpoints
        run: |
          set -o pipefail
          if bash frontline-command/tools/training/run-long-phase.sh 2>&1 | tee "$RUNNER_TEMP/phase.log"; then exit 0; fi
          python -c 'import os; s=open(os.path.join(os.environ["RUNNER_TEMP"],"phase.log"),errors="replace").read()[-5000:]; print("::error::"+s.replace("%","%25").replace("\r","%0D").replace("\n","%0A"))'
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: long-phase-1-first-recovery
          path: |
            ${{ runner.temp }}/phase.log
            ${{ runner.temp }}/long-work/snapshot/
          if-no-files-found: warn
          retention-days: 30
