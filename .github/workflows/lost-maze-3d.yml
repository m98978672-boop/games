name: Lost in the Maze 3D - first recorded attempt
on:
  push:
    branches: [arena/7d9fee46-games]
    paths: [.github/workflows/lost-maze-3d.yml, youtube-bot/experiments/play_lost_maze.cjs]
permissions:
  contents: read
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v7
      - name: Record genuine browser play and verify progress
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/maze"
          docker build -t maze-browser youtube-bot/gameplay 2>&1 | tee "$RUNNER_TEMP/maze/browser-build.log"
          docker run --rm --ipc=host --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/game,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/maze,dst=/capture" \
            --entrypoint bash maze-browser -c '
              set -euo pipefail
              cd /game
              node /game/youtube-bot/experiments/serve_maze.cjs &
              for i in {1..30}; do
                if node -e "fetch(\"http://127.0.0.1:8765/collection/lost-in-the-maze-3d/\").then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"; then break; fi
                sleep 1
              done
              export NODE_PATH=/runner/node_modules
              node /game/youtube-bot/experiments/play_lost_maze.cjs /capture
            ' 2>&1 | tee "$RUNNER_TEMP/maze/attempt.log"
      - name: Expose recorder failure without relying on downloadable logs
        if: failure()
        run: |
          python - <<'PYTHON'
          import json, os, pathlib, re
          folder = pathlib.Path(os.environ['RUNNER_TEMP']) / 'maze'
          trace = folder / 'trace.json'
          if trace.exists():
              report = json.loads(trace.read_text())
              print(f'::notice title=Maze milestone::Reached level {report.get("furthest")}')
          for file in ('attempt.log', 'browser-build.log'):
              path = folder / file
              if path.exists():
                  matches = [x.strip() for x in path.read_text(errors='replace').splitlines()
                             if re.search(r'error|failed|not found|no movement|timeout', x, re.I)]
                  for text in matches[-5:]:
                      print('::warning title=Maze recorder::' + text[:350].replace('%', '%25'))
          PYTHON
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Render timed Russian commentary from the actual run
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install 'piper-tts==1.3.0'
          export PIPER_MODEL_PATH="$RUNNER_TEMP/maze-irina.onnx"
          model=https://huggingface.co/rhasspy/piper-voices/resolve/main/ru/ru_RU/irina/medium/ru_RU-irina-medium.onnx
          curl -fsSL --retry 4 --max-time 180 "$model" -o "$PIPER_MODEL_PATH"
          curl -fsSL --retry 4 --max-time 180 "$model.json" -o "$PIPER_MODEL_PATH.json"
          python youtube-bot/adventure_draft.py "$RUNNER_TEMP/maze"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lost-maze-3d-${{ github.run_id }}
          path: ${{ runner.temp }}/maze/
