name: Private finite adventure experiment (no upload)
on:
  workflow_call:
  push:
    branches: [arena/7d9fee46-games]
    paths: [.github/workflows/adventure-experiment.yml]
permissions:
  contents: read
jobs:
  adventure:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      HF_HUB_DISABLE_XET: '1'
      FINITE_GAME_SECONDS: "1800"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install verifier and local model
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng
          pip install -r youtube-bot/requirements-autopilot.txt 'torchvision>=0.20,<1.0' 'transformers==5.5.4' 'peft==0.19.1' 'accelerate==1.13.0'
      - name: Verify adventure memory
        run: python -m unittest discover -s youtube-bot/tests -p test_adventure_learning.py
      - name: Build offline bridge
        run: docker build -t games-playthrough-2048-experiment:1 youtube-bot/gameplay
      - name: Fetch pinned home adapter
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/kvenya-release"
          gh release download frontline-qwen-home --pattern adapter.tar.gz --dir "$RUNNER_TEMP/kvenya-release"
          python youtube-bot/prepare_kvenya_adapter.py "$RUNNER_TEMP/kvenya-release/adapter.tar.gz" "$RUNNER_TEMP/kvenya-adapter"
      - name: Restore verified adventure memory
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/adventure-skill-memory
          key: adventure-skills-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: adventure-skills-v1-
      - name: Record real model choices without padding
        env:
          QWEN_GAME_ADAPTER_PATH: ${{ runner.temp }}/kvenya-adapter
          ADVENTURE_RECORD_DIR: ${{ runner.temp }}/adventure-recording
          ADVENTURE_SKILL_DB: ${{ runner.temp }}/adventure-skill-memory/skills.sqlite3
        shell: bash
        run: |
          mkdir -p "$ADVENTURE_RECORD_DIR"
          set +e
          nice -n 10 python -u youtube-bot/tests/smoke_adventure_qwen.py 2>&1 | tee "$RUNNER_TEMP/adventure.log"
          result=${PIPESTATUS[0]}
          if [ "$result" -ne 0 ]; then python youtube-bot/tests/smoke_annotation.py "$RUNNER_TEMP/adventure.log"; fi
          exit "$result"
      - name: Save private recording and observed trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adventure-private-${{ github.run_id }}
          path: ${{ runner.temp }}/adventure-recording/
          if-no-files-found: error
          retention-days: 3
  finite-puzzle:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      HF_HUB_DISABLE_XET: '1'
      FINITE_GAME_SECONDS: "1800"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install video verifier and local model
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng
          pip install -r youtube-bot/requirements-autopilot.txt 'torchvision>=0.20,<1.0' 'transformers==5.5.4' 'peft==0.19.1' 'accelerate==1.13.0'
      - name: Verify bounded progress feedback
        run: python -m unittest discover -s youtube-bot/tests -p 'test_puzzle*.py'
      - name: Build isolated browser
        run: docker build -t games-playthrough-2048-experiment:1 youtube-bot/gameplay
      - name: Fetch pinned home adapter
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/kvenya-release"
          gh release download frontline-qwen-home --pattern adapter.tar.gz --dir "$RUNNER_TEMP/kvenya-release"
          python youtube-bot/prepare_kvenya_adapter.py "$RUNNER_TEMP/kvenya-release/adapter.tar.gz" "$RUNNER_TEMP/kvenya-adapter"
      - name: Restore verified puzzle memory
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/puzzle-skill-memory
          key: puzzle-skills-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: puzzle-skills-v1-
      - name: Record finite puzzle without padding
        env:
          QWEN_GAME_ADAPTER_PATH: ${{ runner.temp }}/kvenya-adapter
          PUZZLE_CAMPAIGN_ROUNDS: ${{ github.event_name == 'push' && '4' || '1' }}
          PUZZLE_RECORD_DIR: ${{ runner.temp }}/puzzle-recording
          PUZZLE_SKILL_DB: ${{ runner.temp }}/puzzle-skill-memory/skills.sqlite3
        shell: bash
        run: |
          mkdir -p "$PUZZLE_RECORD_DIR"
          set +e
          nice -n 10 python -u youtube-bot/tests/smoke_puzzle_qwen.py 2>&1 | tee "$RUNNER_TEMP/puzzle.log"
          result=${PIPESTATUS[0]}
          if [ "$result" -ne 0 ]; then python youtube-bot/tests/smoke_annotation.py "$RUNNER_TEMP/puzzle.log"; fi
          exit "$result"
      - name: Build narrated puzzle draft and measure edited gameplay
        if: github.event_name == 'push'
        run: python youtube-bot/adventure_draft.py "$RUNNER_TEMP/puzzle-recording"
      - name: Save private recording and observed trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: puzzle-private-${{ github.run_id }}
          path: ${{ runner.temp }}/puzzle-recording/
          if-no-files-found: error
          retention-days: 3
