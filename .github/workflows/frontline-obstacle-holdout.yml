name: Frozen waypoint model fresh holdout
on:
  push:
    branches: [arena/2045b9f2-games]
    paths: [.github/workflows/frontline-obstacle-holdout.yml, frontline-command/tools/training/obstacle-holdout.mjs, frontline-command/tools/training/obstacle-holdout-infer.py, frontline-command/tools/training/obstacle-fallback-sim.mjs, frontline-command/tools/training/replay-obstacle-holdout.mjs]
permissions:
  contents: read
jobs:
  evaluate:
    if: github.repository == 'm98978672-boop/games'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OMP_NUM_THREADS: '2'
      HF_HUB_DISABLE_XET: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check disjoint holdout and fallback physics
        run: node frontline-command/tests/obstacle-holdout.mjs
      - name: Produce fresh holdout observations
        run: node frontline-command/tools/training/obstacle-holdout.mjs "$RUNNER_TEMP/holdout-input.json"
      - name: Download and verify frozen trained adapter
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download frontline-obstacle-v2-44626512571 --pattern frontline-obstacle-v2.tar.gz --dir "$RUNNER_TEMP"
          echo "ba79aaf92c5c4bf11dbb22b3a0b324a834b2aa2f4fa0f376d6d498a02087f4d6  $RUNNER_TEMP/frontline-obstacle-v2.tar.gz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/adapter"
          tar -xzf "$RUNNER_TEMP/frontline-obstacle-v2.tar.gz" -C "$RUNNER_TEMP/adapter" adapter
      - name: Install CPU inference dependencies
        run: |
          python -m pip install 'torch==2.8.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'transformers==5.5.4' 'peft==0.19.1' 'accelerate==1.13.0' 'safetensors==0.7.0'
      - name: Infer frozen model choices
        run: python -u frontline-command/tools/training/obstacle-holdout-infer.py --data "$RUNNER_TEMP/holdout-input.json" --adapter "$RUNNER_TEMP/adapter/adapter" --output "$RUNNER_TEMP/holdout-inference.json"
      - name: Replay Game.step with and without bounded fallback
        run: node frontline-command/tools/training/replay-obstacle-holdout.mjs "$RUNNER_TEMP/holdout-inference.json" "$RUNNER_TEMP/holdout-replay.json"
      - name: Publish compact job annotations
        if: always()
        run: |
          python - <<'PY'
          import os,json
          p=os.path.join(os.environ['RUNNER_TEMP'],'holdout-replay.json')
          if os.path.exists(p):
            d=json.load(open(p));print('::notice::HOLDOUT_SUMMARY '+json.dumps(d['summary'],separators=(',',':')))
            rows=[{'id':r['id'],'faction':r['faction'],'choices':r['choices'],'baseline':r['baseline']['success'],'baselineSeconds':r['baseline']['seconds'],'model':r['adapter']['success'],'fallbackSuccess':r['adapterFallback']['success'],'fallbackUsed':r['adapterFallback']['fallback'],'fallbackSeconds':r['adapterFallback']['seconds']} for r in d['rows']]
            for i in range(0,len(rows),6):print('::notice::HOLDOUT_ROWS '+json.dumps(rows[i:i+6],separators=(',',':')))
          PY
      - name: Pack completed research
        run: tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/frontline-obstacle-holdout.tar.gz" holdout-input.json holdout-inference.json holdout-replay.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: obstacle-holdout
          path: |
            ${{ runner.temp }}/holdout-input.json
            ${{ runner.temp }}/holdout-inference.json
            ${{ runner.temp }}/holdout-replay.json
            ${{ runner.temp }}/frontline-obstacle-holdout.tar.gz
          if-no-files-found: warn
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: obstacle-holdout-complete
          path: ${{ runner.temp }}/frontline-obstacle-holdout.tar.gz
          if-no-files-found: error
          retention-days: 30
  publish:
    needs: evaluate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: obstacle-holdout-complete
          path: ${{ runner.temp }}
      - name: Preserve evaluation
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "frontline-obstacle-holdout-$GITHUB_RUN_ID" --target "$GITHUB_SHA" --title 'Frontline frozen waypoint model fresh holdout' --notes 'Research-only offline inference and real Game.step replay on 48 fresh synthetic scenes, with and without 12-game-second fallback. Not a browser runtime or normal game. See holdout-replay.json for outcomes. Frozen adapter is from frontline-obstacle-v2-44626512571.' "$RUNNER_TEMP/frontline-obstacle-holdout.tar.gz"
