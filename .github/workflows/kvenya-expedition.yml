name: Kvenya expedition (её руки в интернет)

# Экспедиции Квени: браузерные руки её дома (Playwright).
# Идут САМИ по расписанию — владелец на каждый запуск не нужен,
# в этом и смысл автоматики. Руки открывают публичную страницу,
# нажимают «Играть», играют клавишами и кликами, пишут видео,
# скриншоты и пошаговый отчёт в qwen-home/bridge/expeditions/.
# Чтобы не попадаться на капчу, экспедиции по расписанию ходят в
# дружелюбные места из qwen-home/bridge/targets.json (где роботам
# рады), представляются честным именем и читают robots.txt.
# Честный стоп: «я не робот» руки не нажимают и капчи не решают —
# Квеня нейросеть, а не человек. Встретила стену — отчёт об этом.
on:
  push:
    branches: [main]
    paths: ['qwen-home/bridge/expedition-task.json']
  schedule:
    - cron: '37 9 * * 1'
  workflow_dispatch:
    inputs:
      url:
        description: 'Необязательно: своя публичная страница. Пусто — цель выберет расписание из дружелюбных мест'
        required: false
        default: ''
      seconds:
        description: 'Длина экспедиции в секундах (20–180)'
        required: true
        default: '60'

permissions:
  contents: write
  pages: write

concurrency:
  group: kvenya-expedition
  cancel-in-progress: false

jobs:
  expedition:
    if: github.repository == 'm98978672-boop/games'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install her browser hands
        run: |
          python -m pip install 'playwright>=1.44,<2'
          python -m playwright install --with-deps chromium
      - name: Pick a robot-welcome target
        env:
          INPUT_URL: ${{ inputs.url }}
        run: |
          if [ -n "$INPUT_URL" ]; then
            echo "EXP_URL=$INPUT_URL" >> "$GITHUB_ENV"
          elif [ -f qwen-home/bridge/expedition-task.json ]; then
            python3 - <<'PY' >> "$GITHUB_ENV"
          import json
          from pathlib import Path
          task = json.loads(Path('qwen-home/bridge/expedition-task.json').read_text(encoding='utf-8'))
          print(f"EXP_URL={task['url']}")
          print(f"EXP_SECONDS={int(task.get('seconds', 60))}")
          keys = ','.join(task.get('keys', []))
          print(f"EXP_KEYS={keys}")
          print(f"EXP_INTERVAL={int(task.get('intervalMs', 0))}")
          import sys
          print(f"Задание владельца: {task.get('note', '')} -> {task['url']}", file=sys.stderr)
          PY
          else
            python3 - <<'PY' >> "$GITHUB_ENV"
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          targets = json.loads(Path('qwen-home/bridge/targets.json').read_text(encoding='utf-8'))['targets']
          week = datetime.now(timezone.utc).isocalendar()[1]
          pick = targets[week % len(targets)]
          print(f"EXP_URL={pick['url']}")
          print(f"Цель недели: {pick['label']} — {pick['url']}")
          PY
          fi
          echo "Экспедиция идёт: $EXP_URL"
      - name: Kvenya goes to play by herself
        env:
          EXP_SECONDS: ${{ inputs.seconds || '60' }}
        run: |
          mkdir -p "$RUNNER_TEMP/expedition"
          SECONDS_TO_PLAY="${EXP_SECONDS:-$EXP_SECONDS}"
          python3 qwen-home/tools/expedition.py --url "$EXP_URL" --seconds "$SECONDS_TO_PLAY" --keys "${EXP_KEYS:-}" --interval-ms "${EXP_INTERVAL:-0}" --out "$RUNNER_TEMP/expedition"
      - name: Keep the full video as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kvenya-expedition
          path: ${{ runner.temp }}/expedition
          if-no-files-found: ignore
          retention-days: 14
      - name: File the report into her bridge and show it on her world page
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          SRC="$RUNNER_TEMP/expedition"
          [ -f "$SRC/report.json" ] || { echo "Отчёта нет — складывать нечего"; exit 0; }
          STAMP=$(date -u +%Y%m%d-%H%M)
          HOST=$(python3 -c "import os, urllib.parse; print((urllib.parse.urlparse(os.environ['EXP_URL']).hostname or 'site').replace('.', '-'))")
          DIR="qwen-home/bridge/expeditions/$STAMP-$HOST"
          mkdir -p "$DIR"
          cp "$SRC/report.json" "$DIR/report.json"
          for f in "$SRC"/*.png; do [ -f "$f" ] && cp "$f" "$DIR/"; done
          # Видео — прямо на её страницу, а не только в артефакты:
          # маленькое кладём как есть, большое пережимаем ffmpeg.
          if [ -f "$SRC/expedition.webm" ]; then
            SIZE=$(stat -c %s "$SRC/expedition.webm")
            echo "Видео экспедиции: $SIZE байт; ffmpeg: $(command -v ffmpeg || echo отсутствует)"
            if [ "$SIZE" -lt 10000000 ]; then
              cp "$SRC/expedition.webm" "$DIR/video.webm"
            elif command -v ffmpeg >/dev/null 2>&1; then
              ffmpeg -y -loglevel error -i "$SRC/expedition.webm" -vf "scale=854:-2,fps=12" -c:v libvpx -b:v 400k -an "$DIR/video.webm" || echo "ffmpeg не справился — видео останется только в артефактах"
              [ -f "$DIR/video.webm" ] && [ "$(stat -c %s "$DIR/video.webm")" -gt 8000000 ] && rm -f "$DIR/video.webm"
            fi
            [ -f "$DIR/video.webm" ] && echo "Видео экспедиции уедет на её страницу: $DIR/video.webm" || echo "Видео на страницу не уехало — оно в артефактах этого запуска"
          else
            echo "Файла видео в результатах экспедиции нет"
          fi
          python3 - "$DIR" <<'PY'
          import json, sys
          from pathlib import Path
          d = Path(sys.argv[1])
          report = json.loads((d / 'report.json').read_text(encoding='utf-8'))
          bridge_path = Path('kvenya/bridge.json')
          bridge = json.loads(bridge_path.read_text(encoding='utf-8'))
          entry = {
              'date': report.get('startedAt', ''),
              'url': report.get('url', ''),
              'status': report.get('status', 'error'),
              'dir': str(d),
              'screenshots': report.get('screenshots', [])[:4],
              'hasVideo': bool(report.get('hasVideo')),
              'video': 'video.webm' if (d / 'video.webm').exists() else '',
          }
          bridge['expeditions'] = ([entry] + bridge.get('expeditions', []))[:5]
          bridge_path.write_text(json.dumps(bridge, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print('expedition filed:', entry)
          PY
          git config user.name 'Квеня (экспедиция)'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$DIR" kvenya/bridge.json
          if git diff --cached --quiet; then echo "Изменений нет"; exit 0; fi
          STATUS=$(python3 -c "import json; print(json.load(open('$DIR/report.json'))['status'])")
          git commit -m "Экспедиция Квени: $STATUS ($HOST)"
          pushed=""
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then pushed=1; break; fi
            echo "push отклонён (попытка $attempt): сливаюсь со свежим main"
            git fetch origin main
            git merge --no-edit origin/main || { git merge --abort; exit 1; }
          done
          if [ -z "$pushed" ]; then echo "Не удалось доставить отчёт за 5 попыток"; exit 1; fi
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
