name: Kvenya expedition (её руки в интернет)

# Экспедиции Квени: браузерные руки её дома (Playwright).
# Идут САМИ по расписанию — владелец на каждый запуск не нужен,
# в этом и смысл автоматики. Руки открывают публичную страницу,
# нажимают «Играть», играют клавишами и кликами, пишут видео,
# скриншоты и пошаговый отчёт в qwen-home/bridge/expeditions/.
# Чтобы не попадаться на капчу, экспедиции по расписанию ходят в
# дружелюбные места из qwen-home/bridge/targets.json (где роботам
# рады), представляются честным именем и читают robots.txt.
# Честный стоп: «я не робот» руки не нажимают и капчи не решают —
# Квеня нейросеть, а не человек. Встретила стену — отчёт об этом.
on:
  push:
    branches: [main]
    paths: ['qwen-home/bridge/expedition-task.json']
  schedule:
    - cron: '37 9 * * 1'
  workflow_dispatch:
    inputs:
      url:
        description: 'Необязательно: своя публичная страница. Пусто — цель выберет расписание из дружелюбных мест'
        required: false
        default: ''
      seconds:
        description: 'Длина экспедиции в секундах (20–600; сюжетной истории нужно больше)'
        required: true
        default: '60'

permissions:
  contents: write
  pages: write

concurrency:
  group: kvenya-expedition
  cancel-in-progress: false

jobs:
  expedition:
    if: github.repository == 'm98978672-boop/games'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install her browser hands
        run: |
          python -m pip install 'playwright>=1.44,<2'
          python -m playwright install --with-deps chromium
      - name: Pick a robot-welcome target
        env:
          INPUT_URL: ${{ inputs.url }}
        run: |
          if [ -n "$INPUT_URL" ]; then
            echo "EXP_URL=$INPUT_URL" >> "$GITHUB_ENV"
          elif [ -f qwen-home/bridge/expedition-task.json ]; then
            python3 - <<'PY' >> "$GITHUB_ENV"
          import json
          from pathlib import Path
          task = json.loads(Path('qwen-home/bridge/expedition-task.json').read_text(encoding='utf-8'))
          print(f"EXP_URL={task['url']}")
          print(f"EXP_SECONDS={int(task.get('seconds', 60))}")
          keys = ','.join(task.get('keys', []))
          print(f"EXP_KEYS={keys}")
          print(f"EXP_INTERVAL={int(task.get('intervalMs', 0))}")
          import sys
          print(f"Задание владельца: {task.get('note', '')} -> {task['url']}", file=sys.stderr)
          PY
          else
            python3 - <<'PY' >> "$GITHUB_ENV"
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          targets = json.loads(Path('qwen-home/bridge/targets.json').read_text(encoding='utf-8'))['targets']
          week = datetime.now(timezone.utc).isocalendar()[1]
          pick = targets[week % len(targets)]
          print(f"EXP_URL={pick['url']}")
          print(f"Цель недели: {pick['label']} — {pick['url']}")
          PY
          fi
          echo "Экспедиция идёт: $EXP_URL"
      - name: Kvenya goes to play by herself
        env:
          EXP_SECONDS: ${{ inputs.seconds || '60' }}
        run: |
          mkdir -p "$RUNNER_TEMP/expedition"
          SECONDS_TO_PLAY="${EXP_SECONDS:-$EXP_SECONDS}"
          # Прошлая карта истории: берём самый свежий storymap.json в репозитории,
          # чтобы эта экспедиция не начинала знание с нуля. Если история по тому
          # же адресу ещё не сохранялась — флага просто нет.
          MEMO=$(python3 - <<'PY'
          import json, os
          from pathlib import Path
          url = os.environ.get('EXP_URL', '')
          best = None
          for rep in sorted(Path('qwen-home/bridge/expeditions').glob('*/report.json')):
              try:
                  r = json.loads(rep.read_text(encoding='utf-8'))
              except Exception:
                  continue
              if r.get('url') != url:
                  continue
              cand = rep.parent / 'storymap.json'
              if cand.exists():
                  best = cand
          print(best or '')
          PY
          )
          [ -n "$MEMO" ] && echo "Вспомню карту прошлого прогона: $MEMO — $(stat -c %s "$MEMO") байт" || echo "Прошлой карты для этого адреса нет — начну с чистого листа"
          python3 qwen-home/tools/expedition.py --url "$EXP_URL" --seconds "$SECONDS_TO_PLAY" --keys "${EXP_KEYS:-}" --interval-ms "${EXP_INTERVAL:-0}" --out "$RUNNER_TEMP/expedition" ${MEMO:+--memo "$MEMO"}
      - name: Keep the full video as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kvenya-expedition
          path: ${{ runner.temp }}/expedition
          if-no-files-found: ignore
          retention-days: 14
      - name: File the report into her bridge and show it on her world page
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # Причина падения должна быть видна: раньше шаг молча падал, и по
          # логам нельзя было понять, что именно сломалось.
          trap 'echo "СТРОКА $LINENO: команда «$BASH_COMMAND» упала с кодом $?" >&2' ERR
          SRC="$RUNNER_TEMP/expedition"
          # Уборку делаем ДО выхода «отчёта нет»: иначе старые каталоги копятся
          # даже без новых экспедиций и валят сборку Pages по объёму (так и было:
          # 52 МБ старых видео вернулись через merge, и Pages упал).
          python3 - <<'PY'
          import json, shutil
          from pathlib import Path
          bridge_path = Path('kvenya/bridge.json')
          if bridge_path.exists():
              keep = {e.get('dir') for e in json.loads(bridge_path.read_text(encoding='utf-8')).get('expeditions', []) if e.get('dir')}
              root = Path('qwen-home/bridge/expeditions')
              if root.exists():
                  for old_dir in sorted(root.iterdir()):
                      if old_dir.is_dir() and str(old_dir) not in keep:
                          shutil.rmtree(old_dir, ignore_errors=True)
                          print('убрала старый каталог:', old_dir.name)
          PY
          [ -f "$SRC/report.json" ] || { echo "Отчёта нет — складывать нечего"; exit 0; }
          STAMP=$(date -u +%Y%m%d-%H%M)
          HOST=$(python3 -c "import os, urllib.parse; print((urllib.parse.urlparse(os.environ['EXP_URL']).hostname or 'site').replace('.', '-'))")
          DIR="qwen-home/bridge/expeditions/$STAMP-$HOST"
          mkdir -p "$DIR"
          cp "$SRC/report.json" "$DIR/report.json"
          # Карта истории едет вместе с отчётом: следующий прогон вспомнит места
          # и не будет искать их заново.
          [ -f "$SRC/storymap.json" ] && cp "$SRC/storymap.json" "$DIR/storymap.json" || true
          for f in "$SRC"/*.png; do [ -f "$f" ] && cp "$f" "$DIR/"; done
          # Видео — прямо на её страницу, а не только в артефакты:
          # маленькое кладём как есть, большое пережимаем ffmpeg.
          if [ -f "$SRC/expedition.webm" ]; then
            SIZE=$(stat -c %s "$SRC/expedition.webm")
            echo "Видео экспедиции: $SIZE байт; ffmpeg: $(command -v ffmpeg || echo отсутствует)"
            if [ "$SIZE" -lt 8000000 ]; then
              cp "$SRC/expedition.webm" "$DIR/video.webm"
            elif command -v ffmpeg >/dev/null 2>&1; then
              # Длинный прогон (10 минут) даёт большое видео: пережимаем сильнее —
              # 12 кадров в секунду и 640 px хватает, чтобы видеть, что она делает.
              ffmpeg -y -loglevel error -i "$SRC/expedition.webm" -vf "scale=640:-2,fps=12" -c:v libvpx -b:v 300k -an "$DIR/video.webm" || echo "ffmpeg не справился — видео останется только в артефактах"
              if [ -f "$DIR/video.webm" ] && [ "$(stat -c %s "$DIR/video.webm")" -ge 8000000 ]; then
                echo "Пережатое видео всё ещё $(stat -c %s "$DIR/video.webm") байт — на страницу не кладу"
                rm -f "$DIR/video.webm"
              fi
            fi
            [ -f "$DIR/video.webm" ] && echo "Видео экспедиции уедет на её страницу: $DIR/video.webm" || echo "Видео на страницу не уехало — оно в артефактах этого запуска"
          else
            echo "Файла видео в результатах экспедиции нет"
          fi
          python3 - "$DIR" <<'PY'
          import json, sys, shutil
          from pathlib import Path
          d = Path(sys.argv[1])
          report = json.loads((d / 'report.json').read_text(encoding='utf-8'))
          bridge_path = Path('kvenya/bridge.json')
          bridge = json.loads(bridge_path.read_text(encoding='utf-8'))
          entry = {
              'date': report.get('startedAt', ''),
              'url': report.get('url', ''),
              'status': report.get('status', 'error'),
              'dir': str(d),
              'screenshots': report.get('screenshots', [])[:4],
              'kind': report.get('kind') or 'game',
              'storyLine': report.get('storyLine') or '',
              'storyMap': report.get('storyMap') or {},
              'hasVideo': bool(report.get('hasVideo')),
              'video': 'video.webm' if (d / 'video.webm').exists() else '',
          }
          # Старые каталоги экспедиций чистим: страница показывает только
          # последние пять, а каждый каталог тянет сборку вниз — при
          # скопившихся 28 сборка Pages падала по времени (сейчас .nojekyll,
          # но пыль всё равно не нужна: 149 МБ мусора в репозитории).
          # ВАЖНО: сначала записываем список (уже с новой экспедицией), и только
          # потом убираем лишние каталоги. Если считать «оставить» до записи,
          # уборка сносит каталог, который сама же и записала.
          bridge['expeditions'] = ([entry] + bridge.get('expeditions', []))[:5]
          bridge_path.write_text(json.dumps(bridge, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          keep = {e.get('dir') for e in bridge['expeditions'] if e.get('dir')}
          root = Path('qwen-home/bridge/expeditions')
          if root.exists():
              for old_dir in sorted(root.iterdir()):
                  if old_dir.is_dir() and str(old_dir) not in keep:
                      shutil.rmtree(old_dir, ignore_errors=True)
          print('expedition filed:', entry)
          PY
          python3 qwen-home/tools/vlog.py auto || echo "выпуск блога не собрался — экспедиция всё равно оформляется"
          python3 qwen-home/tools/motivation.py || echo "мотивация не посчиталась — экспедиция всё равно оформляется"
          python3 qwen-home/tools/wants.py pick || echo "желание не выбралось — экспедиция всё равно оформляется"
          python3 - <<'PY'
          import json
          from pathlib import Path
          mot_path = Path('qwen-home/bridge/motivation.json')
          if mot_path.exists():
              bridge_path = Path('kvenya/bridge.json')
              bridge = json.loads(bridge_path.read_text(encoding='utf-8'))
              bridge['motivation'] = json.loads(mot_path.read_text(encoding='utf-8'))
              bridge_path.write_text(json.dumps(bridge, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
              print('мотивация на странице обновлена')
          PY
          git config user.name 'Квеня (экспедиция)'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # -A по корню экспедиций: git add с одним путём не записывает УДАЛЕНИЯ,
          # поэтому вычищенные каталоги возвращались в следующем коммите.
          git add -A qwen-home/bridge/expeditions
          git add "$DIR" kvenya/bridge.json qwen-home/bridge/motivation.json qwen-home/bridge/journal.md qwen-home/state.json qwen-home/studio qwen-home/library qwen-home/wants qwen-home/bridge/wants.json
          if git diff --cached --quiet; then echo "Изменений нет"; exit 0; fi
          STATUS=$(python3 -c "import json; print(json.load(open('$DIR/report.json'))['status'])")
          git commit -m "Экспедиция Квени: $STATUS ($HOST)"
          pushed=""
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then pushed=1; break; fi
            echo "push отклонён (попытка $attempt): сливаюсь со свежим main"
            git fetch origin main
            # Конфликт в отчётах/данных не должен терять саму экспедицию:
            # в споре берём свою свежую версию — она только что снята.
            if ! git merge --no-edit origin/main; then
              echo "конфликт при слиянии — беру свою версию отчёта и данных"
              git checkout --ours qwen-home/bridge/expeditions kvenya/bridge.json qwen-home/state.json 2>/dev/null || true
              git add -A qwen-home/bridge/expeditions kvenya/bridge.json qwen-home/state.json 2>/dev/null || true
              git commit -m "Экспедиция Квени: конфликт слияния — своя версия" || git merge --abort
            fi
          done
          if [ -z "$pushed" ]; then
            echo "Не удалось доставить отчёт за 5 попыток; коммит остаётся в ветке запуска" >&2
            git log --oneline -2 >&2
            exit 1
          fi
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
