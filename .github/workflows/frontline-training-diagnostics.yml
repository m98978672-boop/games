name: Diagnose Frontline training run
on:
  push:
    branches: [arena/1f0ec4dc-games]
    paths: [.github/workflows/frontline-training-diagnostics.yml]
permissions:
  contents: read
  actions: read
jobs:
  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - name: Report final training and release log
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh run view 44352130567 --job 134970322746 --log > "$RUNNER_TEMP/previous.log"
          python3 -c 'import os; p=os.path.join(os.environ["RUNNER_TEMP"],"previous.log"); lines=open(p,errors="replace").readlines(); selected=[x for x in lines if any(y in x for y in ("step ","Held-out", "Error", "error", "failure", "Process completed", "status=", "elapsed=", "Publish", "Save experimental", "LoRA trainable", "loss_before"))]; s="".join(selected[-50:]); print("::notice::"+("lines="+str(len(lines))+"\n"+s).replace("%","%25").replace("\r","%0D").replace("\n","%0A"))'
