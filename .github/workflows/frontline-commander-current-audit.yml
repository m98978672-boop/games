name: Check current commander against fresh simulations
on:
  push:
    branches: [arena/11f06075-games]
    paths: [.github/workflows/frontline-commander-current-audit.yml]
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OMP_NUM_THREADS: '2'
      HF_HUB_DISABLE_XET: '1'
      TOKENIZERS_PARALLELISM: 'false'
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Freeze latest published checkpoint and training data
        run: |
          set -euo pipefail
          tag=frontline-learning-15h-44671482687
          mkdir -p "$RUNNER_TEMP/checkpoints" "$RUNNER_TEMP/olddata"
          gh release download "$tag" --pattern long-dataset.tar.gz --dir "$RUNNER_TEMP"
          tar -xzf "$RUNNER_TEMP/long-dataset.tar.gz" -C "$RUNNER_TEMP/olddata"
          gh release download frontline-obstacle-v2-44626512571 --pattern frontline-obstacle-v2.tar.gz --dir "$RUNNER_TEMP"
          echo "ba79aaf92c5c4bf11dbb22b3a0b324a834b2aa2f4fa0f376d6d498a02087f4d6  $RUNNER_TEMP/frontline-obstacle-v2.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/starting"
          tar -xzf "$RUNNER_TEMP/frontline-obstacle-v2.tar.gz" -C "$RUNNER_TEMP/starting" adapter
          for phase in 1 2 3; do
            for file in "phase-$phase-slot-0.tar.gz" "phase-$phase-slot-1.tar.gz" "phase-$phase-complete.tar.gz"; do
              if gh release view "$tag" --json assets --jq '.assets[].name' | grep -Fxq "$file"; then
                if gh release download "$tag" --pattern "$file" --dir "$RUNNER_TEMP/checkpoints"; then
                  mkdir "$RUNNER_TEMP/checkpoints/$file.dir"
                  tar -xzf "$RUNNER_TEMP/checkpoints/$file" -C "$RUNNER_TEMP/checkpoints/$file.dir"
                fi
              fi
            done
          done
          python - <<'PY'
          import glob,json,os,shutil
          root=os.environ['RUNNER_TEMP'];paths=glob.glob(root+'/checkpoints/*.dir/checkpoint/progress.json')
          if not paths:raise RuntimeError('No checkpoint available')
          paths.sort(key=lambda p:(json.load(open(p))['active_seconds'],json.load(open(p))['steps']))
          shutil.copytree(os.path.dirname(paths[-1]),root+'/snapshot')
          print('::notice::COMMAND_AUDIT_SNAPSHOT '+json.dumps(json.load(open(paths[-1])),separators=(',',':')))
          PY
      - name: Collect new simulation seeds and remove any previous observations
        run: |
          node --input-type=module <<'JS'
          import {writeDataset} from './frontline-command/tools/training/collect-commander.mjs';
          await writeDataset(process.env.RUNNER_TEMP+'/fresh',{trainSeeds:[3101,3102],evalSeeds:[3201,3202,3203,3204],seconds:180,interval:15});
          JS
          python - <<'PY'
          import json,os,hashlib
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP']);old=root/'olddata/commander';fresh=root/'fresh'
          manifest=json.loads((fresh/'manifest.json').read_text());used=set()
          def key(row):return json.dumps(row['input'],sort_keys=True,separators=(',',':'))
          for split in ('train','eval','test'):
              for line in (old/f'{split}.jsonl').read_text().splitlines():used.add(key(json.loads(line)))
          for split in ('train','eval'):
              path=fresh/f'{split}.jsonl';rows=[json.loads(line) for line in path.read_text().splitlines()]
              rows=[r for r in rows if key(r) not in used]
              for r in rows:used.add(key(r))
              data=''.join(json.dumps(r,ensure_ascii=False,separators=(',',':'))+'\n' for r in rows).encode()
              path.write_bytes(data);manifest['files'][split]['count']=len(rows);manifest['files'][split]['sha256']=hashlib.sha256(data).hexdigest()
              actions={}
              for r in rows:
                  action=json.loads(r['response'])['action'];actions[action]=actions.get(action,0)+1
              manifest['files'][split]['actions']=actions
          if manifest['files']['train']['count']<1 or manifest['files']['eval']['count']<8:raise ValueError('insufficient disjoint snapshots')
          original=json.loads((old/'manifest.json').read_text());reserved=json.loads((old/'test-manifest.json').read_text())
          assert not (set(manifest['trainSeeds']+manifest['evalSeeds']) & set(original['trainSeeds']+original['evalSeeds']+reserved['seeds']))
          (fresh/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n')
          print('::notice::FRESH_COMMAND_DATA '+json.dumps(manifest['files'],separators=(',',':')))
          PY
      - name: Install CPU dependencies
        run: |
          python -m pip install 'torch==2.8.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'transformers==5.5.4' 'peft==0.19.1' 'accelerate==1.13.0' 'safetensors==0.7.0'
      - name: Compare free generated commands and game validator
        run: |
          set -eo pipefail
          if python -u frontline-command/tools/training/eval-qwen.py --data "$RUNNER_TEMP/fresh" --adapter "$RUNNER_TEMP/snapshot/best" --output "$RUNNER_TEMP/command-audit.json" --count 8 2>&1 | tee "$RUNNER_TEMP/infer.log"; then
            node frontline-command/tools/training/score-generated.mjs "$RUNNER_TEMP/command-audit.json"
            if ! python -u frontline-command/tools/training/eval-qwen.py --data "$RUNNER_TEMP/fresh" --adapter "$RUNNER_TEMP/starting/adapter" --output "$RUNNER_TEMP/starting-audit.json" --count 8 2>&1 | tee "$RUNNER_TEMP/starting.log"; then
              python -c 'import os; s=open(os.path.join(os.environ["RUNNER_TEMP"],"starting.log"),errors="replace").read()[-6000:]; print("::error::"+s.replace("%","%25").replace("\r","%0D").replace("\n","%0A"))'
              exit 1
            fi
            node frontline-command/tools/training/score-generated.mjs "$RUNNER_TEMP/starting-audit.json"
            python - <<'PY'
          import json,os
          root=os.environ['RUNNER_TEMP'];r=json.load(open(root+'/command-audit.json'));old=json.load(open(root+'/starting-audit.json'));p=json.load(open(root+'/snapshot/progress.json'))
          assert len(r['results'])==len(old['results'])==8
          assert all(a['input']==b['input'] and a['teacher']==b['teacher'] for a,b in zip(r['results'],old['results']))
          changed=sum(a['adapter']!=b['adapter'] for a,b in zip(r['results'],old['results']))
          print('::notice::FRESH_COMMAND_AUDIT '+json.dumps({'snapshot':{'steps':p['steps'],'active_seconds':p['active_seconds']},'scope':'8 fresh held-out-seed snapshots; weak heuristic labels and game parser, not real battles or WebLLM','base':r['scores']['base'],'selected':r['scores']['adapter'],'starting':old['scores']['adapter'],'changedOutputs':changed},separators=(',',':')))
          PY
            exit 0
          fi
          python -c 'import os; s=open(os.path.join(os.environ["RUNNER_TEMP"],"infer.log"),errors="replace").read()[-6000:]; print("::error::"+s.replace("%","%25").replace("\r","%0D").replace("\n","%0A"))'
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fresh-commander-audit
          path: |
            ${{ runner.temp }}/command-audit.json
            ${{ runner.temp }}/starting-audit.json
            ${{ runner.temp }}/infer.log
            ${{ runner.temp }}/starting.log
            ${{ runner.temp }}/snapshot/progress.json
            ${{ runner.temp }}/fresh/
          if-no-files-found: warn
          retention-days: 30
