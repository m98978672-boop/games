name: Frontline Qwen adapter inference check
on:
  push:
    branches: [arena/1f0ec4dc-games]
    paths: [.github/workflows/frontline-qwen-eval.yml, frontline-command/tools/training/eval-qwen.py, frontline-command/tools/training/score-generated.mjs]
permissions:
  contents: write
jobs:
  evaluate:
    if: github.repository == 'm98978672-boop/games'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OMP_NUM_THREADS: '2'
      HF_HUB_DISABLE_XET: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download research adapter and dataset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download frontline-qwen35-lora-research-44366582436 --pattern 'frontline-qwen35-lora-research.tar.gz' --dir "$RUNNER_TEMP"
          mkdir "$RUNNER_TEMP/evaluation"
          tar -xzf "$RUNNER_TEMP/frontline-qwen35-lora-research.tar.gz" -C "$RUNNER_TEMP/evaluation"
      - name: Install CPU inference dependencies
        run: |
          python -m pip install 'torch==2.8.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'transformers==5.5.4' 'peft==0.19.1' 'accelerate==1.13.0' 'safetensors==0.7.0'
      - name: Compare real generated actions before and after the adapter
        run: |
          set +e
          set -o pipefail
          python -u frontline-command/tools/training/eval-qwen.py --data "$RUNNER_TEMP/evaluation/dataset" --adapter "$RUNNER_TEMP/evaluation/adapter" --output "$RUNNER_TEMP/generated.json" 2>&1 | tee "$RUNNER_TEMP/eval.log"
          status=$?
          if [ "$status" -ne 0 ]; then
            python -c 'import os; p=os.path.join(os.environ["RUNNER_TEMP"],"eval.log"); s="".join(open(p,errors="replace").readlines()[-50:]); print("::error::"+s.replace("%","%25").replace("\r","%0D").replace("\n","%0A"))'
          fi
          exit "$status"
      - name: Validate generated actions and publish research report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          node frontline-command/tools/training/score-generated.mjs "$RUNNER_TEMP/generated.json"
          python -c 'import json,os; r=json.load(open(os.path.join(os.environ["RUNNER_TEMP"],"generated.json"))); print("::notice::Three-example CPU greedy evaluation, no WebLLM grammar: "+json.dumps(r["scores"]))'
          gh release create "frontline-qwen35-eval-$GITHUB_RUN_ID" --target "$GITHUB_SHA" --title 'Frontline Qwen exploratory inference check' --notes 'Three held-out snapshots, greedy CPU Transformers inference without the WebLLM JSON grammar. The adapter and teacher are experimental and this is not a battle or proof of strategic skill.' "$RUNNER_TEMP/generated.json"
