name: Live game translation check
on:
  push:
    branches: [arena/7d9fee46-games]
    paths: [.github/workflows/game-translation-check.yml, youtube-bot/tests/live_translation_examples.py]
permissions:
  contents: read
jobs:
  examples:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HF_HUB_DISABLE_XET: '1'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: |
          pip install 'torch>=2.6,<3' 'transformers==5.5.4'
          python -m unittest discover -s youtube-bot/tests -p test_game_text_translation.py
          python youtube-bot/tests/live_translation_examples.py "$RUNNER_TEMP/translation.json"
      - uses: actions/upload-artifact@v4
        with:
          name: translation-review
          path: ${{ runner.temp }}/translation.json
          if-no-files-found: error
