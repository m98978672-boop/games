name: Lost in the Maze 3D audio repair
on:
  push:
    branches: [arena/7d9fee46-games]
    paths: [.github/workflows/lost-maze-revoice.yml]
permissions:
  contents: read
  actions: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45884136453
          name: lost-maze-3d-45884136453
          path: ${{ runner.temp }}/maze
      - name: Rerecord narration and reject silent encoded audio
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install 'piper-tts==1.3.0'
          export PIPER_MODEL_PATH="$RUNNER_TEMP/irina.onnx"
          url=https://huggingface.co/rhasspy/piper-voices/resolve/main/ru/ru_RU/irina/medium/ru_RU-irina-medium.onnx
          curl -fsSL --retry 4 --max-time 180 "$url" -o "$PIPER_MODEL_PATH"
          curl -fsSL --retry 4 --max-time 180 "$url.json" -o "$PIPER_MODEL_PATH.json"
          python youtube-bot/adventure_draft.py "$RUNNER_TEMP/maze"
          python - "$RUNNER_TEMP/maze/zuza-pilot.mp4" <<'PY'
          import array, math, subprocess, sys
          audio = array.array('h', subprocess.check_output(['ffmpeg','-v','error','-i',sys.argv[1],'-map','0:a:0','-ac','1','-ar','8000','-f','s16le','-']))
          thirds = [audio[i*len(audio)//3:(i+1)*len(audio)//3] for i in range(3)]
          active = [sum(math.sqrt(sum(x*x for x in chunk)/len(chunk)) >= 260 for chunk in (part[i:i+800] for i in range(0,len(part),800))) for part in thirds]
          if min(active) < 5 or sum(active) < 40:
              raise SystemExit(f'Encoded voice too sparse: {active}')
          print(f'::notice title=Encoded audio verified::Audible 100ms windows in each third: {active}')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: lost-maze-revoice-${{ github.run_id }}
          path: ${{ runner.temp }}/maze/
          if-no-files-found: error
