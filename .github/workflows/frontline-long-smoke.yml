name: Verify long training and resume
on:
  push:
    branches: [arena/03bf5b1a-games]
    paths: [.github/workflows/frontline-long-smoke.yml, frontline-command/tools/training/train-long.py, frontline-command/tools/training/collect-long-training.mjs, frontline-command/tests/long-training-data.mjs]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OMP_NUM_THREADS: '2'
      HF_HUB_DISABLE_XET: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test data isolation
        run: |
          node frontline-command/tests/long-training-data.mjs
          node frontline-command/tests/commander-training-data.mjs
          node frontline-command/tools/training/collect-long-training.mjs "$RUNNER_TEMP/data" --quick
      - name: Retrieve and verify existing research adapter
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download frontline-obstacle-v2-44626512571 --pattern frontline-obstacle-v2.tar.gz --dir "$RUNNER_TEMP"
          echo "ba79aaf92c5c4bf11dbb22b3a0b324a834b2aa2f4fa0f376d6d498a02087f4d6  $RUNNER_TEMP/frontline-obstacle-v2.tar.gz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/source"
          tar -xzf "$RUNNER_TEMP/frontline-obstacle-v2.tar.gz" -C "$RUNNER_TEMP/source" adapter
      - name: Install CPU dependencies
        run: |
          python -m pip install 'torch==2.8.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'transformers==5.5.4' 'peft==0.19.1' 'accelerate==1.13.0' 'safetensors==0.7.0'
      - name: Run short staged training and resume
        run: |
          set -eu
          python -u frontline-command/tools/training/train-long.py --data "$RUNNER_TEMP/data" --work "$RUNNER_TEMP/one" --initial-adapter "$RUNNER_TEMP/source/adapter" --phase 1 --active-seconds 3600 --max-steps 3 --eval-commands 1 --eval-token-budget 8
          python -u frontline-command/tools/training/train-long.py --data "$RUNNER_TEMP/data" --work "$RUNNER_TEMP/restart" --resume "$RUNNER_TEMP/one/snapshot" --phase 1 --active-seconds 3600 --max-steps 2 --eval-commands 1 --eval-token-budget 8
          python -u frontline-command/tools/training/train-long.py --data "$RUNNER_TEMP/data" --work "$RUNNER_TEMP/two" --resume "$RUNNER_TEMP/restart/snapshot" --phase 2 --active-seconds 3600 --max-steps 2 --eval-commands 1 --eval-token-budget 8
          python -u frontline-command/tools/training/train-long.py --data "$RUNNER_TEMP/data" --work "$RUNNER_TEMP/three" --resume "$RUNNER_TEMP/two/snapshot" --phase 3 --active-seconds 3600 --max-steps 2 --eval-commands 1 --eval-token-budget 8
          python - <<'PY'
          import json,os
          t=os.environ['RUNNER_TEMP']; paths=['one','restart','two','three']
          rows=[json.load(open(f'{t}/{x}/snapshot/progress.json')) for x in paths]
          assert [x['phase'] for x in rows]==[1,1,2,3]
          assert [x['steps'] for x in rows]==[3,5,7,9]
          assert all(rows[i]['active_seconds']>rows[i-1]['active_seconds'] for i in range(1,4))
          assert len({x['dataset_sha256'] for x in rows})==1
          assert sum(rows[-1]['task_counts'].values())==9
          print('::notice::SMOKE_PROGRESS '+json.dumps(rows[-1],separators=(',',':'))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: long-training-smoke
          path: |
            ${{ runner.temp }}/data/
            ${{ runner.temp }}/one/snapshot/progress.json
            ${{ runner.temp }}/restart/snapshot/progress.json
            ${{ runner.temp }}/two/snapshot/progress.json
            ${{ runner.temp }}/three/snapshot/progress.json
          if-no-files-found: warn
          retention-days: 7
