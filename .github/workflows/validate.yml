name: Validate site and game submissions

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate community catalog, storefront portal, news hub and 10-pass antivirus shield
        run: |
          node site/tests/community-catalog.mjs
          node site/tests/portal.mjs
          node site/tests/news-and-antivirus.mjs
          node site/tests/news-covers.mjs
          node site/scripts/scan-submission-antivirus.mjs
      - name: Set up Python for YouTube review policy tests
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test the Steam-sourced Russian YouTube review pipeline (sources, cadence, speech, FPS)
        run: |
          python -m pip install 'Pillow>=10.4,<13.0' 'numpy>=1.26,<3.0' 'imageio-ffmpeg>=0.5,<1.0' 'PyYAML>=6,<7'
          python -m unittest \
            youtube-bot/tests/test_game_reviews.py \
            youtube-bot/tests/test_steam_catalog.py \
            youtube-bot/tests/test_renderer_quality.py \
            youtube-bot/tests/test_render_speedups.py \
            youtube-bot/tests/test_run_game_review.py \
            youtube-bot/tests/test_publish_to_supabase.py \
            youtube-bot/tests/test_review_workflow_format.py \
            youtube-bot/tests/test_review_batch.py \
            youtube-bot/tests/test_review_slot_state.py \
            youtube-bot/tests/test_slot_reservation.py \
            youtube-bot/tests/test_audit_review_schedule.py \
            youtube-bot/tests/test_speech_policy.py \
            youtube-bot/tests/test_autopilot.py \
            youtube-bot/tests/test_youtube_api.py \
            youtube-bot/tests/test_playthrough_feedback.py \
            youtube-bot/tests/test_comment_assistant.py \
            youtube-bot/tests/test_comments_cloud_worker.py \
            youtube-bot/tests/test_gameplay_discovery.py \
            youtube-bot/tests/test_gameplay_2048.py \
            youtube-bot/tests/test_puzzle_supervisor.py \
            youtube-bot/tests/test_gameplay_finalize.py \
            youtube-bot/tests/test_gameplay_qwen.py \
            youtube-bot/tests/test_gameplay_captions.py \
            youtube-bot/tests/test_adventure_subtitles.py \
            youtube-bot/tests/test_gameplay_edit.py \
            youtube-bot/tests/test_gameplay_voiceover.py \
            youtube-bot/tests/test_gameplay_release_plan.py \
            youtube-bot/tests/test_gameplay_release_evidence.py \
            youtube-bot/tests/test_gameplay_review_evidence.py \
            youtube-bot/tests/test_gameplay_policy.py \
            youtube-bot/tests/test_lighthouse_publish.py \
            youtube-bot/tests/test_adventure_duration.py \
            youtube-bot/tests/test_review_preview.py \
            youtube-bot/tests/test_verify_review_artifact.py \
            youtube-bot/tests/test_adventure_personality.py \
            youtube-bot/tests/test_minecraft_bridge.py \
            youtube-bot/tests/test_prepare_kvenya_adapter.py \
            youtube-bot/tests/test_prepare_voxel_recreation.py \
            youtube-bot/tests/test_puzzle_learning.py \
            youtube-bot/tests/test_puzzle_planner.py \
            youtube-bot/tests/test_voxel_supervisor.py \
            youtube-bot/tests/test_voxel_timing.py \
            youtube-bot/tests/test_voxel_voiceover.py \
            youtube-bot/tests/test_feedback_youtube.py \
            youtube-bot/tests/test_playthrough_continue.py \
            youtube-bot/tests/test_gameplay_reflex.py \
            youtube-bot/tests/test_gameplay_help_lookup.py \
            youtube-bot/tests/test_gameplay_action_pacer.py \
            youtube-bot/tests/test_gameplay_realtime.py \
            youtube-bot/tests/test_gameplay_world_model.py \
            youtube-bot/tests/test_stream_plan_director.py \
            youtube-bot/tests/test_stream_run.py \
            youtube-bot/tests/test_playbook_montage.py \
            qwen-home/tests/test_self_facts.py
          python youtube-bot/gameplay/benchmark_reflex.py --compare 40
          python -m unittest youtube-bot/gameplay/test_reflex_cli.py
          node supabase/functions/youtube-bot/tests/oidc-policy.test.mjs
          node youtube-bot/tests/test-mobile-comments.cjs
          node youtube-bot/tests/test-credential-copy.cjs
          node youtube-bot/tests/test-comments-oauth.mjs
          node youtube-bot/gameplay/test-solver2048.cjs
          node --check youtube-bot/gameplay/play2048.cjs
      - name: Check that the RatCore browser bundle is up to date (engine is wired into every section)
        run: |
          node ratcore/tools/build-browser-bundle.mjs --check
          node game-base/tests/engine.mjs
      - name: Keep the P2P share catalog in sync with the games, then test torrent and its server
        run: |
          # Любая правка файлов игры обязана обновить каталог раздач: иначе у
          # игрока не сойдутся хеши кусков. Пересобираем здесь и фиксируем
          # расхождение, если коммит его не содержал.
          node tools/torrent/build-catalog.mjs
          if ! git diff --quiet -- site/torrent-catalog.json; then
            # Каталог отстал от игр. Это не повод ронять проверку: сборка уже
            # пересобрала его здесь, тесты ниже пойдут по свежему каталогу, а
            # workflow «Sync torrent catalog» закоммитит результат в main.
            echo "::warning file=site/torrent-catalog.json::Каталог раздач отставал от игр и пересобран в этой проверке. В main его закоммитит workflow «Sync torrent catalog»."
            git diff --stat -- site/torrent-catalog.json
          fi
          node tools/torrent/test.mjs
          node tools/p2p-server/test.mjs
      - name: Test MESH STUDIO — редактор моделей на движке (ядро, стык, собранный бандл)
        run: |
          # Редактор живёт на том же движке, поэтому его стык проверяется здесь
          # же. Браузера в CI нет — бандл запускается на минимальной странице.
          node mesh-studio/tests/core.mjs
          node mesh-studio/tests/engine.mjs
          node mesh-studio/tests/browser.mjs
      - name: Test bridges between RatCore and other engines (route-engine, «Переплёт»)
        run: |
          (cd route-engine && npm test)
          node route-engine/tests/ratcore-bridge.mjs
          node pereplet-prototype/tests/ratcore-bridge.mjs
      - name: Test RatCore v1.0.0 Stage 1-5 + Demo Game (All 10 Standard Modules + All 14 Opt-In Packs + RatStudio + ToolGuard)
        run: |
          node ratcore/tests/tool-contract.mjs
          node ratcore/tests/stage1.mjs
          node ratcore/tests/stage2.mjs
          node ratcore/tests/stage3.mjs
          node ratcore/tests/stage4.mjs
          node ratcore/tests/stage5.mjs
          node ratcore/tests/demo-game.mjs
      - name: Self-test the bug-hunting bot
        run: node tools/bughunt/tests/selftest.mjs
      - name: Check the bug-code table covers 000–999
        run: node tools/bughunt/tests/codes.mjs
      - name: Install locked chess dependency for Qwen home tests
        run: npm ci --prefix kvenya/letsplay --no-audit --no-fund
      - name: Hunt for bugs across the repository (critical only)
        run: |
          set +e
          node tools/bughunt/bughunt.mjs --play --level критично --fail-on критично > "$RUNNER_TEMP/bughunt.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/bughunt.log"
          if [ "$status" -ne 0 ]; then
            python3 -c 'import os; p=os.path.join(os.environ["RUNNER_TEMP"],"bughunt.log"); s="".join(open(p,errors="replace").readlines()[-50:]); print("::error::"+s.replace("%","%25").replace("\r","%0D").replace("\n","%0A"))'
          fi
          exit "$status"
      - name: Test 1 IN 8 BILLION structure
        run: node 1in8b/tests/smoke.mjs
      - name: Test 1 IN 8 BILLION life model
        run: node 1in8b/tests/logic.mjs
      - name: Test 1 IN 8 BILLION bot (бот играет по правилам и не нарушает их)
        run: node 1in8b/tests/bot.mjs
      - name: Test game template structure
        run: node game-base/tests/smoke.mjs
      - name: Test game template logic
        run: node game-base/tests/logic.mjs
      - name: Install Frontline Command test dependencies
        run: npm ci --prefix frontline-command --no-audit --no-fund
      - name: Test Frontline Command (логика, симуляция, производительность)
        run: |
          set +e
          npm run test:fast --prefix frontline-command > "$RUNNER_TEMP/frontline-test.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/frontline-test.log"
          if [ "$status" -ne 0 ]; then
            python3 -c 'import os; p=os.path.join(os.environ["RUNNER_TEMP"],"frontline-test.log"); s="".join(open(p,errors="replace").readlines()[-50:]); print("::error::"+s.replace("%","%25").replace("\r","%0D").replace("\n","%0A"))'
          fi
          exit "$status"
      - name: Test frontline city brains (мэры country-atlas поверх штаба)
        run: node frontline-command/tests/mayors.mjs
      - name: Test Frontline Steel & Drones (кампания, бой, синхронизация play.html)
        run: node frontline-steel-and-drones/tests/logic.mjs
      - name: Test Qwen home (дом нейросети — учебный план, сборщики, дневник)
        run: |
          node qwen-home/tests/learn.mjs
          python3 qwen-home/tests/test_encode.py
      - name: Test Frontline battlefield visuals (Chromium)
        run: npm run test:battlefield:browser --prefix frontline-command
      - name: Test shooter-2 structure and offline rules
        run: node shooter-2/tests/smoke.mjs
      - name: Test shooter-2 animation library (1760 clips), world, AI, ragdoll
        run: node shooter-2/tests/logic.mjs
      - name: Test shooter-2 headless game loop
        run: node shooter-2/tests/headless.mjs
      - name: Test shooter-2 Godot port structure and GDScript contracts
        run: node shooter-2-godot/tests/port.mjs
      - name: Test Dead District browser runtime and Godot 4 structure
        run: |
          node dead-district/tests/smoke.mjs
          node dead-district/tests/interaction.mjs
          node dead-district/tests/interaction-targets.mjs
          node dead-district/tests/storage.mjs
          node dead-district/tests/model-views.mjs
          node dead-district/tests/evacuation.mjs
          node dead-district/tests/isometric-textures.mjs
          node dead-district/tools/static_gd_check.mjs
      - name: Test PLAYBRIDGE backend
        run: npm test --prefix cloud-play
      - name: Test RatMes engine, server, P2P, stress and TransferGuard audit
        run: |
          npm test --prefix ratmes
          npm run audit --prefix ratmes
      - name: Guard that every hidden panel really hides (a ✕ must close something)
        run: |
          node tools/tests/hidden-attribute.mjs
          node ratmes/tests/close-buttons.mjs
      - name: Guard that every game loop survives a broken animation timestamp
        run: node tools/tests/frame-dt.mjs
      - name: Test truck-haul logic (contracts, gearbox, wear, payouts, init order)
        run: node truck-haul/tests/logic.mjs
      - name: Test shooter touch controls (стик, свайп, огонь, перезарядка)
        run: node shooter/tests/touch.mjs
      - name: Test cascade-hydro (симуляция рек и ГЭС, вехи, экран финала)
        run: |
          cd cascade-hydro
          npm ci
          node tests/sim-test.mjs
          node tests/finale.mjs
      - name: Test last-shore rocks and animals (переступание, звери не застревают)
        run: |
          cd last-shore
          # Зависимости ставим здесь же. Раньше npm ci был только в шаге
          # escape, который идёт ниже, — и этот шаг падал с
          # ERR_MODULE_NOT_FOUND: jsdom, потому что в тестах v018/mobs
          # используется jsdom, а его не было. Выглядело как «звери
          # застревают», хотя тест не запускался вовсе.
          npm ci
          npm run test:build
          node tests/v018.mjs
      - name: Test euro-haul smoke (карьера, рейс, сохранение) — без флака
        run: |
          cd euro-haul
          # Зависимости (jsdom) нужны самому тесту: без npm ci шаг падал
          # на импорте, а выглядел как провал игры.
          npm ci --no-audit --no-fund
          node tests/smoke.mjs
          node tests/autopilot.mjs
      - name: Test last-shore escape (плот, спасение, экран финала)
        run: |
          cd last-shore
          npm ci
          npm run build
          npm run test:build
          node tests/escape.mjs
      - name: Test truck-showroom model details (трубы, LED-оптика, габариты)
        run: |
          cd truck-showroom
          npm ci --no-audit --no-fund
          node tests/details.mjs
      - name: Test road-tycoon (симуляция, финал, сохранение, свободная игра)
        run: |
          node road-tycoon/tests/sim.test.js
          node road-tycoon/tests/victory.test.js
      - name: Test night-taxi (логика, ресурсы, функции, интерфейс, финал)
        run: |
          cd night-taxi
          npm ci --no-audit --no-fund
          npm test
      - name: Test warehouse-crew (смоук, механики, мозг, запуск в jsdom)
        run: |
          cd warehouse-crew
          node tests/smoke.mjs
          node tests/mechanics.test.mjs
          node tests/brain.test.mjs
          node tests/layout.test.mjs
          node tests/features.test.mjs
          node tests/physics.test.mjs
          node tests/lighting.test.mjs
          node tests/dialogue.test.mjs
          node tests/safety.test.mjs
          node tests/contracts.test.mjs
          node tests/checkpoint.test.mjs
          node tests/save-status.test.mjs
          # boot-jsdom честно пропускается без зависимостей — ставим их
          # сюда же, чтобы запуск игры в CI проверялся по-настоящему.
          npm install --no-save --no-package-lock jsdom three
          node tests/boot-jsdom.mjs
      - name: Guard finale coverage (у каждой игры есть конец, и он закреплён тестом)
        run: node tools/tests/finale-coverage.mjs
      - name: Test game endings — у каждой игры должен быть финал
        run: |
          # Раньше у этих игр не было концовки ни в каком виде: рейсы и
          # истории шли по кругу, а выживалка умела только убивать.
          node truck-haul/tests/career.mjs
          node night-taxi/tests/finale.mjs
          node euro-haul/tests/career-end.mjs
      - name: Test country-atlas (карта, реки, дороги, ИИ, старт) — 33 набора
        run: |
          # Раньше этот раздел не проверялся в CI вовсе, и `npm test` падал с
          # чистой установки: тесты требовали @napi-rs/canvas, которого не было
          # в зависимостях. Теперь зависимость объявлена и прогон обязателен.
          cd country-atlas
          npm ci --no-audit --no-fund
          # Лог шага недоступен снаружи, поэтому при падении хвост вывода
          # уезжает в аннотацию — как уже сделано для багханта выше.
          set +e
          npm test > "$RUNNER_TEMP/country-atlas.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/country-atlas.log"
          if [ "$status" -ne 0 ]; then
            python3 -c 'import os; p=os.path.join(os.environ["RUNNER_TEMP"],"country-atlas.log"); s="".join(open(p,errors="replace").readlines()[-60:]); print("::error::"+s.replace("%","%25").replace("\r","%0D").replace("\n","%0A"))'
          fi
          exit $status
      - name: Test Folder OS (apps, terminal, disk export)
        run: node folder-os/tests/smoke.mjs
      - name: Test the bug-hunting bot keeps distinguishing real NaN from library limits
        run: node tools/bughunt/tests/nonfinite-rule.mjs
      - name: Test knowledge collector and bug benchmark (data quality, no duplicates, real defects)
        run: |
          node tools/training/test-build-knowledge.mjs
          node tools/training/test-training.mjs

  malware-scan:
    name: Scan changed files with ClamAV
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install ClamAV and refresh signatures
        run: |
          sudo apt-get update
          sudo apt-get install --yes clamav clamav-freshclam
          sudo systemctl stop clamav-freshclam || true
          sudo freshclam
      - name: Scan files changed by this pull request or push
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ "$BASE_SHA" =~ ^0+$ ]]; then
            mapfile -d '' changed_files < <(git ls-tree -r --name-only -z "$HEAD_SHA")
          else
            mapfile -d '' changed_files < <(git diff --name-only --diff-filter=ACMR -z "$BASE_SHA...$HEAD_SHA")
          fi
          if ((${#changed_files[@]} == 0)); then
            echo "No added or modified files to scan."
            exit 0
          fi
          printf 'Scanning %s changed files with ClamAV.\n' "${#changed_files[@]}"
          sudo clamscan --infected --no-summary "${changed_files[@]}"
