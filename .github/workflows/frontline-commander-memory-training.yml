name: Train memory-aware commander
on:
  push:
    branches: [arena/03bf5b1a-games]
    paths: [.github/workflows/frontline-commander-memory-training.yml]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      OMP_NUM_THREADS: '2'
      HF_HUB_DISABLE_XET: '1'
      TOKENIZERS_PARALLELISM: 'false'
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check memory isolation and build quick sample
        run: |
          node frontline-command/tests/commander-memory.mjs
          node frontline-command/tests/commander-memory-persistence.mjs
          node frontline-command/tests/commander-memory-data.mjs
          python frontline-command/tests/commander-memory-pairs.py
          node frontline-command/tools/training/collect-commander-memory.mjs "$RUNNER_TEMP/data" --quick
      - name: Download trained commander adapter
        run: |
          gh release download frontline-commander-structured-44703132936 --pattern frontline-commander-structured.tar.gz --dir "$RUNNER_TEMP"
          mkdir "$RUNNER_TEMP/source"
          tar -xzf "$RUNNER_TEMP/frontline-commander-structured.tar.gz" -C "$RUNNER_TEMP/source"
          python - <<'PY'
          import hashlib,json,os
          r=os.path.join(os.environ['RUNNER_TEMP'],'source');s=json.load(open(r+'/summary.json'))
          assert hashlib.sha256(open(r+'/output/best/adapter_model.safetensors','rb').read()).hexdigest()==s['adapterSha256']
          PY
      - name: Install CPU dependencies
        run: |
          python -m pip install 'torch==2.8.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'transformers==5.5.4' 'peft==0.19.1' 'accelerate==1.13.0' 'safetensors==0.7.0'
      - name: Check paired examples and train a short step
        run: |
          set -o pipefail
          if python -u frontline-command/tools/training/train-commander-structured.py --data "$RUNNER_TEMP/data" --adapter "$RUNNER_TEMP/source/output/best" --out "$RUNNER_TEMP/output" --steps 1 --count 4 --paired-memory 2>&1 | tee "$RUNNER_TEMP/train.log"; then
            node frontline-command/tools/training/score-structured.mjs "$RUNNER_TEMP/output/report.json"
            exit 0
          fi
          python -c 'import os; s=open(os.path.join(os.environ["RUNNER_TEMP"],"train.log"),errors="replace").read()[-7000:]; print("::error::"+s.replace("%","%25").replace("\r","%0D").replace("\n","%0A"))'
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: memory-training-smoke
          path: |
            ${{ runner.temp }}/output/
            ${{ runner.temp }}/train.log
          if-no-files-found: warn
          retention-days: 7
  train:
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      OMP_NUM_THREADS: '2'
      HF_HUB_DISABLE_XET: '1'
      TOKENIZERS_PARALLELISM: 'false'
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Collect real side-isolated command histories
        run: |
          node frontline-command/tools/training/collect-commander-memory.mjs "$RUNNER_TEMP/data"
          python -c 'import json,os; d=json.load(open(os.path.join(os.environ["RUNNER_TEMP"],"data","manifest.json"))); print("::notice::MEMORY_DATA "+json.dumps(d["stats"],separators=(",",":")))'
      - name: Retrieve and verify existing adapter
        run: |
          gh release download frontline-commander-structured-44703132936 --pattern frontline-commander-structured.tar.gz --dir "$RUNNER_TEMP"
          mkdir "$RUNNER_TEMP/source"
          tar -xzf "$RUNNER_TEMP/frontline-commander-structured.tar.gz" -C "$RUNNER_TEMP/source"
          python - <<'PY'
          import hashlib,json,os
          r=os.path.join(os.environ['RUNNER_TEMP'],'source');s=json.load(open(r+'/summary.json'))
          assert hashlib.sha256(open(r+'/output/best/adapter_model.safetensors','rb').read()).hexdigest()==s['adapterSha256']
          PY
      - name: Install CPU dependencies
        run: |
          python -m pip install 'torch==2.8.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'transformers==5.5.4' 'peft==0.19.1' 'accelerate==1.13.0' 'safetensors==0.7.0'
      - name: Train and compare paired before and after examples
        run: |
          set -o pipefail
          if python -u frontline-command/tools/training/train-commander-structured.py --data "$RUNNER_TEMP/data" --adapter "$RUNNER_TEMP/source/output/best" --out "$RUNNER_TEMP/output" --steps 8 --count 8 --paired-memory 2>&1 | tee "$RUNNER_TEMP/train.log"; then
            node frontline-command/tools/training/score-structured.mjs "$RUNNER_TEMP/output/report.json"
            exit 0
          fi
          python -c 'import os; s=open(os.path.join(os.environ["RUNNER_TEMP"],"train.log"),errors="replace").read()[-7000:]; print("::error::"+s.replace("%","%25").replace("\r","%0D").replace("\n","%0A"))'
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: memory-commander-results
          path: |
            ${{ runner.temp }}/data/
            ${{ runner.temp }}/output/
            ${{ runner.temp }}/train.log
          if-no-files-found: warn
          retention-days: 30
