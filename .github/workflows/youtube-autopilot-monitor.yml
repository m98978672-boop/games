name: YouTube autopilot failure monitor

# Runs only after the authorized review workflow completes. It does not
# re-run the publisher: an upload may already have reached YouTube.
on:
  workflow_run:
    workflows: ["YouTube reviews autopilot (Shorts and long)"]
    types: [completed]

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  report-failure:
    if: >-
      github.repository == 'm98978672-boop/games' &&
      github.event.workflow_run.head_branch == 'main' &&
      contains(fromJSON('["failure","timed_out","startup_failure","action_required"]'), github.event.workflow_run.conclusion)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report failure without retrying a potentially uploaded video
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail
          title="YouTube autopilot failed: run ${RUN_ID} attempt ${ATTEMPT}"
          # Remote run logs are not always readable (the blob storage may deny
          # access), so the exact failed step and GitHub's short annotations are
          # copied here. They are fixed step names and short messages, never
          # secrets or full logs. Reading them is best-effort only.
          # The job that actually failed, not jobs[0]: the autopilot workflow
          # also has a read-only reconciliation job that usually succeeds.
          job_id=$(gh api "repos/${GH_REPO}/actions/runs/${RUN_ID}/jobs" \
            --jq '[.jobs[] | select(.conclusion == "failure")][0].id // empty' 2>/dev/null || true)
          [ -n "${job_id}" ] || job_id=$(gh api "repos/${GH_REPO}/actions/runs/${RUN_ID}/jobs" \
            --jq '.jobs[0].id // empty' 2>/dev/null || true)
          failed_step=""
          annotations=""
          if [ -n "${job_id}" ]; then
            failed_step=$(gh api "repos/${GH_REPO}/actions/jobs/${job_id}" \
              --jq '[.steps[] | select(.conclusion == "failure") | .name] | join(", ")' 2>/dev/null || true)
            # Annotations live on the check run, not on the Actions job: the
            # jobs endpoint returns 404 here and used to put a raw "Not Found"
            # JSON blob into the issue. Both share the same numeric id, so try
            # the check run first and keep the old path only as a fallback.
            # The 404 body is valid JSON but not an array, so `gh --jq` prints
            # it to stdout as-is; require an array before accepting the result.
            read_annotations() {
              gh api "repos/${GH_REPO}/$1/${job_id}/annotations" 2>/dev/null \
                | jq -r 'if type == "array" then [.[] | select(.annotation_level == "failure")
                    | "- " + ((.title // "") | if . == "" then "" else . + ": " end) + .message]
                    | join("\n") else empty end' 2>/dev/null || true
            }
            annotations=$(read_annotations check-runs)
            if [ -z "${annotations}" ]; then
              annotations=$(read_annotations actions/jobs)
            fi
          fi
          {
            echo "Автопилот завершился со статусом ${CONCLUSION}: ${RUN_URL}"
            echo
            if [ -n "${failed_step}" ]; then
              echo "Шаг, который остановил запуск: ${failed_step}"
            else
              echo 'Шаг не удалось прочитать удалённо; он виден в журнале запуска.'
            fi
            echo
            echo 'Публикация автоматически не повторена: проверьте YouTube Studio и состояние задания, прежде чем запускать её снова.'
            echo 'Полные журналы здесь не копируются; ниже только короткие пометки GitHub, без секретов.'
            if [ -n "${annotations}" ]; then
              echo
              echo 'Пометки:'
              echo "${annotations}"
            fi
          } > "$RUNNER_TEMP/failure-report.md"
          cat "$RUNNER_TEMP/failure-report.md" >> "$GITHUB_STEP_SUMMARY"
          gh issue create --title "$title" --body-file "$RUNNER_TEMP/failure-report.md"
          echo "Отчёт об ошибке создан; повторной загрузки нет." >> "$GITHUB_STEP_SUMMARY"
