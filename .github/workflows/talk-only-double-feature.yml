name: Portal 2 and Cities Skylines reviews
on:
  push:
    branches: [arena/7d9fee46-games]
    paths: [.github/workflows/talk-only-double-feature.yml]
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install 'piper-tts==1.3.0'
          export PIPER_MODEL_PATH="$RUNNER_TEMP/irina.onnx"
          url=https://huggingface.co/rhasspy/piper-voices/resolve/main/ru/ru_RU/irina/medium/ru_RU-irina-medium.onnx
          curl -fsSL --retry 4 --max-time 180 "$url" -o "$PIPER_MODEL_PATH"
          curl -fsSL --retry 4 --max-time 180 "$url.json" -o "$PIPER_MODEL_PATH.json"
          python youtube-bot/editorial/render_double_feature.py "$RUNNER_TEMP/editorial"
      - uses: actions/upload-artifact@v4
        with:
          name: talk-only-reviews-${{ github.run_id }}
          path: ${{ runner.temp }}/editorial/*.mp4
          if-no-files-found: error
