name: Frontline Qwen talk (разговор с Квеней)
on:
  push:
    # Квеня отвечает и на ветках arena/**, и прямо в main, когда владелец
    # дописывает сообщение в файл диалога (например, кнопкой со страницы
    # kvenya через веб-редактор GitHub). Её собственный коммит с ответом
    # запускает один пустой прогон: скрипт видит, что последнее слово за
    # ней, и сразу выходит, а шаг коммита без изменений — no-op. Поэтому
    # [skip ci] в её коммите НЕТ: иначе GitHub Pages не пересобрал бы сайт
    # и ответ не появился бы на странице.
    branches: ['arena/**', 'main']
    paths: ['qwen-home/talk/dialogue.md']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: qwen-talk-${{ github.ref }}
  cancel-in-progress: false
jobs:
  talk:
    if: github.repository == 'm98978672-boop/games'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      HF_HUB_DISABLE_XET: '1'
      TOKENIZERS_PARALLELISM: 'false'
      GH_TOKEN: ${{ github.token }}
    steps:
      # Скорость приёма: разговору нужен только её дом (qwen-home),
      # а не весь репозиторий — разреженный checkout за секунды.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: qwen-home
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # Скорость: раньше каждый ответ начинался с установки torch и
      # скачивания базовой модели (~2 ГБ) с нуля — это и были минуты
      # ожидания. Теперь колёса pip и модель живут в кэше Actions.
      - name: Cache pip downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: kvenya-pip-${{ runner.os }}-torch280-talk-v1
          restore-keys: kvenya-pip-${{ runner.os }}-
      - name: Cache her base model (Hugging Face)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kvenya-hf-Qwen3.5-0.8B-2fc06364715b967f1860aea9cf38778875588b17
      # Скорость приёма: раньше КАЖДЫЙ ответ начинался с установки
      # torch — минуты даже с кэшем колёс. Теперь готовое окружение
      # целиком живёт в кэше Actions; установка — только при холодном
      # кэше или если окружение не поднялось (проверка импортом).
      - name: Cache her installed environment (venv)
        uses: actions/cache@v4
        with:
          path: ~/.cache/kvenya-venv
          key: kvenya-venv-${{ runner.os }}-py311-torch280-v1
      - name: Install CPU inference dependencies (only on cold cache)
        run: |
          VENV="$HOME/.cache/kvenya-venv"
          # Скорость: полная проверка окружения импортом torch стоит
          # секунды на каждый ответ. Если версия Python та же, что при
          # сборке окружения, верим штампу и не импортируем зря; штамп
          # не сошёлся — честная полная проверка импортом, а дальше
          # пересборка, а не падение.
          if [ -x "$VENV/bin/python" ] && [ "$(cat "$VENV/kvenya-py.txt" 2>/dev/null)" = "$(python -V 2>&1)" ]; then
            echo "Окружение из кэша, версия Python та же — отвечаем сразу"
          elif [ -x "$VENV/bin/python" ] && "$VENV/bin/python" -c "import torch, transformers, peft" 2>/dev/null; then
            echo "Окружение поднялось из кэша (проверено импортом)"
            python -V 2>&1 > "$VENV/kvenya-py.txt"
          else
            echo "Холодный кэш: собираю окружение один раз"
            rm -rf "$VENV"
            python -m venv "$VENV"
            "$VENV/bin/pip" install 'torch==2.8.0' --index-url https://download.pytorch.org/whl/cpu
            "$VENV/bin/pip" install 'transformers==5.5.4' 'peft==0.19.1' 'accelerate==1.13.0' 'safetensors==0.7.0'
            python -V 2>&1 > "$VENV/kvenya-py.txt"
          fi
          echo "PY=$VENV/bin/python" >> "$GITHUB_ENV"
      - name: Download her home adapter
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/home-adapter"
          gh release download frontline-qwen-home --pattern 'adapter.tar.gz' --dir "$RUNNER_TEMP/home-adapter"
          if [ -f "$RUNNER_TEMP/home-adapter/adapter.tar.gz" ]; then
            tar -xzf "$RUNNER_TEMP/home-adapter/adapter.tar.gz" -C "$RUNNER_TEMP/home-adapter"
            echo "ADAPTER=$RUNNER_TEMP/home-adapter/adapter" >> "$GITHUB_ENV"
          fi
          exit 0
      - name: Kvenya answers
        run: |
          if [ -n "${ADAPTER:-}" ]; then
            "${PY:-python}" -u qwen-home/tools/talk-generate.py --adapter "$ADAPTER"
          else
            "${PY:-python}" -u qwen-home/tools/talk-generate.py
          fi
      - name: Commit her words back to the branch
        id: commit
        run: |
          git config user.name 'Квеня (Qwen home bot)'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qwen-home/talk/dialogue.md qwen-home/talk/last-reply.txt
          if [ -f qwen-home/memory/search-log.md ]; then git add qwen-home/memory/search-log.md; fi
          git diff --cached --quiet && exit 0
          git commit -m 'Квеня ответила в диалоге'
          # Отвечая прямо в main, легко проиграть гонку: пока модель
          # думает (минуты!), в main может упасть следующий вопрос
          # владельца. Раньше здесь был rebase: он ловил конфликт на
          # хвосте dialogue.md и ронял шаг — сгенерированный ответ
          # терялся в упавшем раннере (так пропал ответ 2026-11-22).
          # Теперь: слияние с union для append-only файлов (см.
          # .gitattributes) и честный флаг pushed только после успеха.
          pushed=""
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:$GITHUB_REF_NAME"; then pushed=true; break; fi
            echo "push отклонён (попытка $attempt): сливаюсь со свежей веткой"
            git fetch origin "$GITHUB_REF_NAME"
            git merge --no-edit "origin/$GITHUB_REF_NAME" || { git merge --abort; exit 1; }
          done
          if [ -z "$pushed" ]; then
            echo "Не удалось запушить ответ за 5 попыток"
            exit 1
          fi
          echo "pushed=true" >> "$GITHUB_OUTPUT"
      # Её push идёт от GITHUB_TOKEN и сам сборку сайта не будит —
      # просим GitHub Pages пересобраться явно, чтобы ответ был виден.
      - name: Ask GitHub Pages to rebuild the site with her answer
        if: steps.commit.outputs.pushed == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
