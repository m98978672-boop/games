name: Frontline Qwen talk (разговор с Квеней)
on:
  push:
    # Квеня отвечает и на ветках arena/**, и прямо в main, когда владелец
    # дописывает сообщение в файл диалога (например, кнопкой со страницы
    # kvenya через веб-редактор GitHub). Её собственный коммит с ответом
    # запускает один пустой прогон: скрипт видит, что последнее слово за
    # ней, и сразу выходит, а шаг коммита без изменений — no-op. Поэтому
    # [skip ci] в её коммите НЕТ: иначе GitHub Pages не пересобрал бы сайт
    # и ответ не появился бы на странице.
    branches: ['arena/**', 'main']
    paths: ['qwen-home/talk/dialogue.md']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: qwen-talk-${{ github.ref }}
  cancel-in-progress: false
jobs:
  talk:
    if: github.repository == 'm98978672-boop/games'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      HF_HUB_DISABLE_XET: '1'
      TOKENIZERS_PARALLELISM: 'false'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # Скорость: раньше каждый ответ начинался с установки torch и
      # скачивания базовой модели (~2 ГБ) с нуля — это и были минуты
      # ожидания. Теперь колёса pip и модель живут в кэше Actions.
      - name: Cache pip downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: kvenya-pip-${{ runner.os }}-torch280-talk-v1
          restore-keys: kvenya-pip-${{ runner.os }}-
      - name: Cache her base model (Hugging Face)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kvenya-hf-Qwen3.5-0.8B-2fc06364715b967f1860aea9cf38778875588b17
      - name: Install CPU inference dependencies
        run: |
          python -m pip install 'torch==2.8.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'transformers==5.5.4' 'peft==0.19.1' 'accelerate==1.13.0' 'safetensors==0.7.0'
      - name: Download her home adapter
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/home-adapter"
          gh release download frontline-qwen-home --pattern 'adapter.tar.gz' --dir "$RUNNER_TEMP/home-adapter"
          if [ -f "$RUNNER_TEMP/home-adapter/adapter.tar.gz" ]; then
            tar -xzf "$RUNNER_TEMP/home-adapter/adapter.tar.gz" -C "$RUNNER_TEMP/home-adapter"
            echo "ADAPTER=$RUNNER_TEMP/home-adapter/adapter" >> "$GITHUB_ENV"
          fi
          exit 0
      - name: Kvenya answers
        run: |
          if [ -n "${ADAPTER:-}" ]; then
            python -u qwen-home/tools/talk-generate.py --adapter "$ADAPTER"
          else
            python -u qwen-home/tools/talk-generate.py
          fi
      - name: Commit her words back to the branch
        run: |
          git config user.name 'Квеня (Qwen home bot)'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qwen-home/talk/dialogue.md qwen-home/talk/last-reply.txt
          if [ -f qwen-home/memory/search-log.md ]; then git add qwen-home/memory/search-log.md; fi
          git diff --cached --quiet && exit 0
          git commit -m 'Квеня ответила в диалоге'
          # Отвечая прямо в main, можно проиграть гонку другому свежему
          # коммиту — перебазируемся и повторяем, а не теряем её ответ.
          for attempt in 1 2 3; do
            if git push origin "HEAD:$GITHUB_REF_NAME"; then break; fi
            echo "push отклонён (попытка $attempt): перебазируюсь на свежий main"
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME" || { git rebase --abort; exit 1; }
          done
