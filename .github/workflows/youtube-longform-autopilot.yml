name: YouTube long-form game review autopilot

on:
  schedule:
    # 01:00 Moscow check, ahead of the daily 06:00 Moscow publication slot.
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      publish_at:
        description: "Optional one-off Moscow time: YYYY-MM-DD HH:MM (allow time for rendering)"
        type: string
        required: false
      made_for_kids:
        description: "Owner-approved audience classification"
        type: choice
        options: ["false", "true"]
        default: "false"
        required: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: youtube-longform-autopilot
  cancel-in-progress: false

jobs:
  cadence:
    runs-on: ubuntu-latest
    outputs:
      due: ${{ steps.check.outputs.due }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - id: check
        name: Check daily long-video cadence
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "due=true" >> "$GITHUB_OUTPUT"
          else
            echo "due=$(python youtube-bot/schedule_policy.py --check-long-due)" >> "$GITHUB_OUTPUT"
          fi

  create-and-schedule:
    needs: cadence
    if: needs.cadence.outputs.due == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      YOUTUBE_MADE_FOR_KIDS: ${{ inputs.made_for_kids || 'false' }}
      MANUAL_PUBLISH_AT: ${{ inputs.publish_at || '' }}
      VIDEO_FORMAT: long
      DATA_DIR: youtube-bot/data
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: youtube-bot/requirements-autopilot.txt
      - name: Validate optional manual publication time
        if: env.MANUAL_PUBLISH_AT != ''
        run: python youtube-bot/schedule_policy.py --manual-publish-at "$MANUAL_PUBLISH_AT"
      - name: Require the explicit owner-approved audience value
        run: |
          if [ "$YOUTUBE_MADE_FOR_KIDS" != "true" ] && [ "$YOUTUBE_MADE_FOR_KIDS" != "false" ]; then
            echo "::error::Choose the owner-approved audience value true or false."
            exit 1
          fi
      - name: Set the Russian Piper model path
        run: echo "PIPER_MODEL_PATH=$RUNNER_TEMP/ru_RU-irina-medium.onnx" >> "$GITHUB_ENV"
      - name: Restore the local Qwen model cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/huggingface
          key: qwen-shorts-0-8b-2fc06364715b967f1860aea9cf38778875588b17-v1
      - name: Restore the Russian Piper voice model cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ runner.temp }}/ru_RU-irina-medium.onnx
            ${{ runner.temp }}/ru_RU-irina-medium.onnx.json
          key: piper-ru-irina-medium-v1
      - name: Restore recent Steam game selection memory
        uses: actions/cache/restore@v6
        with:
          path: youtube-bot/data/recent-games.json
          key: youtube-review-history-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: youtube-review-history-
      - name: Install render, local Qwen, and local Russian voice dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu-core
          python -m pip install --upgrade pip
          python -m pip install -r youtube-bot/requirements-autopilot.txt
      - name: Download local Russian Piper voice model
        id: piper-download
        run: |
          set -euo pipefail
          download_model() {
            local url="$1"
            local target="$2"
            if [ -s "$target" ]; then
              return
            fi
            local partial="${target}.partial"
            rm -f "$partial"
            curl --fail --location --retry 8 --retry-all-errors --retry-delay 5 \
              --connect-timeout 30 --max-time 600 --output "$partial" "$url"
            test -s "$partial"
            mv "$partial" "$target"
          }
          download_model \
            https://huggingface.co/rhasspy/piper-voices/resolve/main/ru/ru_RU/irina/medium/ru_RU-irina-medium.onnx \
            "$PIPER_MODEL_PATH"
          download_model \
            https://huggingface.co/rhasspy/piper-voices/resolve/main/ru/ru_RU/irina/medium/ru_RU-irina-medium.onnx.json \
            "$PIPER_MODEL_PATH.json"
          test -s "$PIPER_MODEL_PATH" && test -s "$PIPER_MODEL_PATH.json"
      - name: Save the Russian Piper voice model cache
        if: always() && steps.piper-download.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ runner.temp }}/ru_RU-irina-medium.onnx
            ${{ runner.temp }}/ru_RU-irina-medium.onnx.json
          key: piper-ru-irina-medium-v1
      - name: Generate sourced Russian long-form review with local Qwen
        env:
          HF_HOME: ${{ runner.temp }}/huggingface
        run: python youtube-bot/run_game_review.py "$RUNNER_TEMP/games-long-review.mp4" --format long
      - name: Upload and schedule long-form video
        run: python youtube-bot/publish_to_supabase.py "$RUNNER_TEMP/games-long-review.result.json"
      - name: Save only non-sensitive Steam game selection memory
        if: always() && hashFiles('youtube-bot/data/recent-games.json') != ''
        uses: actions/cache/save@v6
        with:
          path: youtube-bot/data/recent-games.json
          key: youtube-review-history-${{ github.run_id }}-${{ github.run_attempt }}
