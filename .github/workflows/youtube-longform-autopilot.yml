name: YouTube long-form review (use reviews autopilot)

# The existing live publisher currently authorizes only youtube-shorts-autopilot.
# Keep this manual entry point as a safe, immediate explanation, not a second
# scheduled publisher. Do not start rendering an upload that cannot authenticate.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  instructions:
    runs-on: ubuntu-latest
    steps:
      - name: Direct the owner to the authorized publisher
        run: |
          echo '::error::For long reviews, open the YouTube reviews autopilot workflow, select main and video_format=long. This legacy workflow is not authorized to upload.'
          echo 'https://github.com/m98978672-boop/games/actions/workflows/youtube-shorts-autopilot.yml'
          exit 1
