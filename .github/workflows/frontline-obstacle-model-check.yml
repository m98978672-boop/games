name: Frontline obstacle model check
on:
  push:
    branches: [arena/2045b9f2-games]
    paths: [.github/workflows/frontline-obstacle-model-check.yml, frontline-command/tools/training/obstacle-eval.py]
permissions:
  contents: read
jobs:
  evaluate:
    if: github.repository == 'm98978672-boop/games'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OMP_NUM_THREADS: '2'
      HF_HUB_DISABLE_XET: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check the independent map scorer
        run: python frontline-command/tools/training/obstacle-eval.py --self-test
      - name: Download previous research adapter
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download frontline-qwen35-lora-research-44375607542 --pattern 'frontline-qwen35-lora-research.tar.gz' --dir "$RUNNER_TEMP"
          mkdir "$RUNNER_TEMP/adapter-data"
          tar -xzf "$RUNNER_TEMP/frontline-qwen35-lora-research.tar.gz" -C "$RUNNER_TEMP/adapter-data"
      - name: Install CPU inference dependencies
        run: |
          python -m pip install 'torch==2.8.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'transformers==5.5.4' 'peft==0.19.1' 'accelerate==1.13.0' 'safetensors==0.7.0'
      - name: Test base and adapter with and without demonstrations
        run: python -u frontline-command/tools/training/obstacle-eval.py --adapter "$RUNNER_TEMP/adapter-data/adapter" --output "$RUNNER_TEMP/obstacle-results.json"
      - name: Report model answers in job annotations
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/obstacle-results.json" ]; then
            python -c 'import json,os; p=os.path.join(os.environ["RUNNER_TEMP"],"obstacle-results.json"); d=json.load(open(p)); [print("::notice::OBSTACLE_GROUP "+json.dumps([r for r in d["results"] if r["model"]==m],ensure_ascii=True,separators=(",",":"))) for m in ("base","adapter")]'
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: obstacle-model-results
          path: ${{ runner.temp }}/obstacle-results.json
          if-no-files-found: warn
          retention-days: 30
