name: YouTube reviews autopilot (Shorts and long)

on:
  schedule:
    # Four Shorts and four long reviews a day. Each run fires exactly three
    # hours before the slot it serves, so a slow run still makes its slot and
    # no firing crosses midnight in Moscow.
    # Shorts: 09:00, 13:00, 17:00, 21:00 Moscow -> 06:00, 10:00, 14:00, 18:00.
    - cron: "0 3 * * *"
    - cron: "0 7 * * *"
    - cron: "0 11 * * *"
    - cron: "0 15 * * *"
    # Long: 06:00, 11:00, 15:00, 19:00 Moscow -> 03:00, 08:00, 12:00, 16:00.
    - cron: "0 0 * * *"
    - cron: "0 5 * * *"
    - cron: "0 9 * * *"
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      review_capture_run:
        description: "Publish the exact completed Steam review preview from this Actions run ID"
        type: string
        required: false
      review_preview:
        description: "Render one complete Steam game review without uploading"
        type: boolean
        default: false
      adventure_preview:
        description: "Record a finite story adventure instead of reviews (private draft)"
        type: boolean
        default: false
      puzzle_episode:
        description: "Record, edit and schedule a new independent Zuza puzzle episode"
        type: boolean
        default: false
      adventure_capture_run:
        description: "Completed private capture run ID, or lighthouse to play and automatically publish"
        type: string
        required: false
      publish_at:
        description: "Moscow time YYYY-MM-DD HH:MM; blank picks regular slots (batch: 8h lead, 4 Shorts a day / 4 long a day)"
        type: string
        required: false
      made_for_kids:
        description: "Owner-approved audience classification"
        type: choice
        options:
          - "false"
          - "true"
        default: "false"
        required: true
      video_format:
        description: "Video type for a manual run"
        type: choice
        options:
          - short
          - long
        default: short
        required: true
      batch_count:
        description: "Sequential queue size (1–5 Shorts or 1–2 long); blank publish_at picks a regular slot"
        type: string
        default: "1"
        required: true
      check_topics_only:
        description: "Read-only topic ledger check; never render or upload"
        type: boolean
        default: false
        required: false

permissions:
  contents: read
  id-token: write

concurrency:
  # Separate lanes can run in parallel, but GitHub retains at most one pending
  # run per group. Submit one batch per lane and wait for it to finish.
  # One lane per format, so a long review never waits behind a Short. GitHub
  # keeps at most one pending run per group, which is why the batch input is
  # capped; separate firing times never share a lane at the same moment.
  group: youtube-review-${{ (github.event_name == 'schedule' && contains(fromJSON('["0 0 * * *","0 5 * * *","0 9 * * *","0 13 * * *"]'), github.event.schedule) && 'long') || (github.event_name == 'schedule' && 'short') || (inputs.review_preview && 'review-preview') || (inputs.adventure_preview && 'adventure-preview') || (inputs.puzzle_episode && 'puzzle-episode') || inputs.video_format }}
  cancel-in-progress: false

jobs:
  # Reads one input to know which job name to keep, so a change to the
  # reconciliation logic updates this job instead of silently never running.
  reconcile-scheduled-slots:
    if: github.event_name == 'schedule' && github.repository == 'm98978672-boop/games'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REVIEW_SCHEDULE: ${{ github.event.schedule || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Check which planned slots still have no video
        run: |
          set -euo pipefail
          # Read-only: lists planned slots, their state and the exact start
          # command for every missing one. It never renders or uploads.
          python youtube-bot/reconcile_schedule.py | tee "$RUNNER_TEMP/slots.md"
          cat "$RUNNER_TEMP/slots.md" >> "$GITHUB_STEP_SUMMARY"

  check-topic-history:
    if: github.event_name == 'workflow_dispatch' && inputs.check_topics_only
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Verify the shared topic ledger without rendering or uploading
        run: PYTHONPATH=youtube-bot python -c 'from publish_to_supabase import _supabase_post; r = _supabase_post("/autopilot/topic-history", {}); assert r.get("version") == 1 and isinstance(r.get("game_ids"), list); print("History available:", len(r["game_ids"]), "topics")'

  create-and-schedule:
    if: ${{ !inputs.check_topics_only && !inputs.review_capture_run && !inputs.adventure_capture_run && !inputs.puzzle_episode && !inputs.adventure_preview }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      # The channel owner explicitly classified the audience as not made for kids.
      # Manual dispatch exposes the same explicit choice; scheduled runs use it too.
      YOUTUBE_MADE_FOR_KIDS: ${{ inputs.made_for_kids || 'false' }}
      MANUAL_PUBLISH_AT: ${{ inputs.publish_at || '' }}
      REVIEW_SCHEDULE: ${{ github.event.schedule || '' }}
      REVIEW_PREVIEW: ${{ inputs.review_preview }}
      MANUAL_VIDEO_FORMAT: ${{ inputs.video_format || '' }}
      REVIEW_BATCH_COUNT: ${{ inputs.batch_count || '1' }}
      DATA_DIR: youtube-bot/data
      # Never render with an unavailable or incomplete shared topic ledger.
      REQUIRE_SHARED_TOPIC_HISTORY: "true"
    steps:
      # The pipeline is cut by purpose, not by tool: each stage produces exactly
      # the inputs the next one needs, and starts as soon as those inputs exist.
      #
      #   stage 1  ready to generate   -> checkout, inputs, caches, ffmpeg, voice
      #   stage 2  ready to render     -> one review planned for a confirmed slot
      #   stage 3  ready to publish    -> verified 1080p50 file
      #   stage 4  publish             -> exactly one upload
      #
      # Stage 1: everything stage 2 needs.
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: youtube-bot/requirements-autopilot.txt
      # Entry contract of stage 1: format, queue times, audience and the voice
      # path are checked in one step, before caches and FFmpeg, so a typo fails
      # in seconds. Each check still fails closed on its own and prints one
      # readable ::error:: line; nothing is rendered or uploaded when it fails.
      # An empty publish_at is valid and picks regular slots.
      - name: "Stage 1: validate inputs and set the voice model path"
        run: |
          set -euo pipefail
          python youtube-bot/review_workflow_format.py
          # A value written to $GITHUB_ENV reaches only later steps, so pass the
          # format to the same-step validator explicitly.
          if [ "$REVIEW_PREVIEW" != "true" ]; then
            VIDEO_FORMAT=$(grep -m1 '^VIDEO_FORMAT=' "$GITHUB_ENV" | cut -d= -f2-)
            VIDEO_FORMAT="$VIDEO_FORMAT" python youtube-bot/review_batch.py --check
          fi
          if [ "$YOUTUBE_MADE_FOR_KIDS" != "true" ] && [ "$YOUTUBE_MADE_FOR_KIDS" != "false" ]; then
            echo "::error::Choose the owner-approved audience value true or false in the workflow input."
            exit 1
          fi
          echo "PIPER_MODEL_PATH=$RUNNER_TEMP/ru_RU-irina-medium.onnx" >> "$GITHUB_ENV"
      - name: Restore the local Qwen model cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/huggingface
          key: qwen-shorts-0-8b-2fc06364715b967f1860aea9cf38778875588b17-v1
      - name: Restore the Russian Piper voice model cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ runner.temp }}/ru_RU-irina-medium.onnx
            ${{ runner.temp }}/ru_RU-irina-medium.onnx.json
          key: piper-ru-irina-medium-v1
      - name: Restore recent game selection memory
        uses: actions/cache/restore@v6
        with:
          path: youtube-bot/data/recent-games.json
          key: youtube-review-history-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: youtube-review-history-
      - name: Install renderer and model dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu-core
          python -m pip install --upgrade pip
          python -m pip install -r youtube-bot/requirements-autopilot.txt
      - name: Download the local Russian Piper voice model
        id: piper-download
        run: |
          set -euo pipefail
          download_model() {
            local url="$1"
            local target="$2"
            if [ -s "$target" ]; then
              return
            fi
            local partial="${target}.partial"
            rm -f "$partial"
            curl --fail --location --retry 8 --retry-all-errors --retry-delay 5 \
              --connect-timeout 30 --max-time 600 --output "$partial" "$url"
            test -s "$partial"
            mv "$partial" "$target"
          }
          download_model \
            https://huggingface.co/rhasspy/piper-voices/resolve/main/ru/ru_RU/irina/medium/ru_RU-irina-medium.onnx \
            "$PIPER_MODEL_PATH"
          download_model \
            https://huggingface.co/rhasspy/piper-voices/resolve/main/ru/ru_RU/irina/medium/ru_RU-irina-medium.onnx.json \
            "$PIPER_MODEL_PATH.json"
          test -s "$PIPER_MODEL_PATH" && test -s "$PIPER_MODEL_PATH.json"
      - name: Save the Russian Piper voice model cache
        if: always() && steps.piper-download.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ runner.temp }}/ru_RU-irina-medium.onnx
            ${{ runner.temp }}/ru_RU-irina-medium.onnx.json
          key: piper-ru-irina-medium-v1

      # Stage 2: everything stage 3 needs - a planned review for a free slot.
      - name: "Stage 2: confirm the slot (read-only)"
        id: slot-state
        if: ${{ !inputs.review_preview }}
        # A scheduled run asks the private queue first: reading is cheap,
        # rendering is not. A manual dispatch keeps its explicit plan and is
        # never skipped here; its own requested time is checked inside the
        # renderer before any expensive work. An unreadable queue stops the run.
        run: python youtube-bot/review_batch.py --check-queue

      # Stage 3: everything stage 4 needs - a verified file.
      - name: "Stage 3: generate and render the review"
        if: ${{ !inputs.review_preview && steps.slot-state.outputs.skip != 'true' }}
        env:
          HF_HOME: ${{ runner.temp }}/huggingface
        # Narration for every scene, then frames for every scene, run in
        # parallel inside the renderer; still frames are drawn once and reused.
        run: python youtube-bot/review_batch.py

      # Stage 4 (publish) runs inside stage 3: review_batch publishes each
      # rendered file exactly once and never retries an upload.

      - name: Render one private game review with corrected Russian pronunciation
        if: inputs.review_preview
        env:
          HF_HOME: ${{ runner.temp }}/huggingface
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/review-preview"
          python -u youtube-bot/run_game_review.py "$RUNNER_TEMP/review-preview/review.mp4" --format "$VIDEO_FORMAT" --preview
      - name: Verify the exported review MP4 and audio
        if: inputs.review_preview
        run: python youtube-bot/verify_review_artifact.py "$RUNNER_TEMP/review-preview"
      - name: Save review MP4 and verification reports
        if: inputs.review_preview
        uses: actions/upload-artifact@v4
        with:
          name: voiced-steam-review-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/review-preview/review.mp4
            ${{ runner.temp }}/review-preview/review.result.json
            ${{ runner.temp }}/review-preview/review.media.json
          if-no-files-found: error
          retention-days: 7
      - name: Retain only non-sensitive model selection memory
        if: always() && hashFiles('youtube-bot/data/recent-games.json') != ''
        uses: actions/cache/save@v6
        with:
          path: youtube-bot/data/recent-games.json
          key: youtube-review-history-${{ github.run_id }}-${{ github.run_attempt }}

  check-puzzle-episode:
    if: github.event_name == 'workflow_dispatch' && inputs.puzzle_episode && !inputs.review_capture_run && !inputs.adventure_preview && !inputs.check_topics_only
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      CAPTURE_RUN: ${{ inputs.adventure_capture_run }}
      PUBLISH_AT: ${{ inputs.publish_at }}
      PUZZLE_RECORDING_RIGHTS_VERIFIED: ${{ vars.PUZZLE_RECORDING_RIGHTS_VERIFIED }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Check publishing prerequisites before starting the recording
        run: |
          [[ "$GITHUB_REF" == refs/heads/main && -z "$CAPTURE_RUN" ]] || { echo '::error::Select main and do not set a previous capture run.'; exit 1; }
          [[ "$PUZZLE_RECORDING_RIGHTS_VERIFIED" == true ]] || { echo '::error::Verify recording and asset rights, then set PUZZLE_RECORDING_RIGHTS_VERIFIED=true.'; exit 1; }
          PYTHONPATH=youtube-bot python - <<'PYCODE'
          import os
          from datetime import datetime, timedelta, timezone
          from schedule_policy import manual_publish_time
          now = datetime.now(timezone.utc)
          if manual_publish_time(os.environ['PUBLISH_AT'], now=now) < now + timedelta(hours=3):
              raise SystemExit('Choose a Moscow publication slot at least 3 hours ahead for recording, retry and upload.')
          PYCODE

  record-puzzle-episode:
    needs: check-puzzle-episode
    permissions:
      contents: read
    uses: ./.github/workflows/adventure-experiment.yml
    with:
      puzzle_episode: true

  record-adventure-preview:
    if: github.event_name == 'workflow_dispatch' && inputs.adventure_preview && !inputs.review_capture_run && !inputs.puzzle_episode && !inputs.check_topics_only && inputs.adventure_capture_run == ''
    permissions:
      contents: read
    uses: ./.github/workflows/adventure-experiment.yml
    with:
      adventure_only: true

  record-lighthouse-episode:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.adventure_capture_run == 'lighthouse' && !inputs.puzzle_episode && !inputs.review_preview && !inputs.review_capture_run && !inputs.adventure_preview && !inputs.check_topics_only
    permissions:
      contents: read
    uses: ./.github/workflows/adventure-experiment.yml
    with:
      lighthouse: true
      adventure_only: true

  publish-lighthouse-episode:
    needs: record-lighthouse-episode
    if: github.ref == 'refs/heads/main' && needs.record-lighthouse-episode.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      TRUSTED_LIGHTHOUSE_CAPTURE: 'true'
      YOUTUBE_MADE_FOR_KIDS: ${{ inputs.made_for_kids }}
      PUBLISH_AT: ${{ inputs.publish_at }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: adventure-private-${{ github.run_id }}
          path: ${{ runner.temp }}/lighthouse
      - name: Verify completed story and send to YouTube queue
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          python youtube-bot/publish_adventure_short.py "$RUNNER_TEMP/lighthouse" "$GITHUB_RUN_ID" "$PUBLISH_AT"

  publish-adventure-pilot:
    needs: record-puzzle-episode
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && !inputs.review_capture_run && !inputs.adventure_preview && !inputs.check_topics_only && ((inputs.puzzle_episode && needs.record-puzzle-episode.result == 'success') || (!inputs.puzzle_episode && inputs.adventure_capture_run != '' && inputs.adventure_capture_run != 'lighthouse')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      CAPTURE_RUN: ${{ inputs.puzzle_episode && github.run_id || inputs.adventure_capture_run }}
      PUBLISH_AT: ${{ inputs.publish_at }}
      YOUTUBE_MADE_FOR_KIDS: ${{ inputs.made_for_kids }}
      ADVENTURE_RECORDING_RIGHTS_VERIFIED: ${{ vars.ADVENTURE_RECORDING_RIGHTS_VERIFIED }}
      PUZZLE_RECORDING_RIGHTS_VERIFIED: ${{ vars.PUZZLE_RECORDING_RIGHTS_VERIFIED }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Fetch this episode from the same run
        if: inputs.puzzle_episode
        uses: actions/download-artifact@v4
        with:
          name: puzzle-private-${{ github.run_id }}
          path: ${{ runner.temp }}/adventure-publish
      - name: Verify capture provenance and fetch the private artifact
        if: ${{ !inputs.puzzle_episode }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ -n "$PUBLISH_AT" && "$CAPTURE_RUN" =~ ^[0-9]+$ ]] || { echo "::error::A publication time and numeric capture run are required."; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CAPTURE_RUN" | jq -e '
            .conclusion == "success" and (.path == ".github/workflows/adventure-experiment.yml"
              or (.path == ".github/workflows/youtube-shorts-autopilot.yml" and .event == "workflow_dispatch"))
            and .head_branch == "arena/7d9fee46-games" and .head_repository.full_name == "m98978672-boop/games"' >/dev/null || { echo "::error::Capture run is not a successful trusted source."; exit 1; }
          artifact="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CAPTURE_RUN/artifacts" | jq -er --arg id "$CAPTURE_RUN" '[.artifacts[] | select(.expired == false and (.name == ("puzzle-private-" + $id) or .name == ("adventure-private-" + $id))) | .name] | select(length == 1) | .[0]')"
          case "$artifact" in
            puzzle-*) [[ "$PUZZLE_RECORDING_RIGHTS_VERIFIED" == true ]] || exit 1 ;;
            adventure-*)
              # One reviewed artifact: the capture uses only the MIT-licensed local HTML/CSS/JS and synthetic narration.
              if [[ "$CAPTURE_RUN" == 45699744277 ]]; then
                gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/15063091128" | jq -e '
                  .name == "adventure-private-45699744277" and .expired == false
                  and .digest == "sha256:d7ce3b3afd1660d41c69dedf4f4ae347b8717a01e794cfc0fdc709e35d676918"' >/dev/null
                echo 'ADVENTURE_RECORDING_RIGHTS_VERIFIED=true' >> "$GITHUB_ENV"
              else
                [[ "$ADVENTURE_RECORDING_RIGHTS_VERIFIED" == true ]] || { echo "::error::Recording rights were not verified for this capture."; exit 1; }
              fi ;;
          esac
          gh run download "$CAPTURE_RUN" --name "$artifact" --dir "$RUNNER_TEMP/adventure-publish"
      - name: Install media verifier
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Publish through the existing authorized uploader
        env:
          DATA_DIR: ${{ runner.temp }}/adventure-history
        run: |
          set -euo pipefail
          folder="$RUNNER_TEMP/adventure-publish"
          if jq -e '.beta_episode == true or (has("beta_episode") | not) and .short == true' "$folder/pilot.json" >/dev/null; then
            python youtube-bot/publish_adventure_short.py "$folder" "$CAPTURE_RUN" "$PUBLISH_AT"
          else
            python youtube-bot/publish_adventure_draft.py "$folder" "$CAPTURE_RUN" "$PUBLISH_AT"
          fi

  publish-saved-review:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.review_capture_run != '' && !inputs.review_preview && !inputs.adventure_preview && !inputs.puzzle_episode && !inputs.check_topics_only && inputs.adventure_capture_run == ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      CAPTURE_RUN: ${{ inputs.review_capture_run }}
      PUBLISH_AT: ${{ inputs.publish_at }}
      YOUTUBE_MADE_FOR_KIDS: ${{ inputs.made_for_kids }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Download the selected private review from this repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$CAPTURE_RUN" =~ ^[0-9]+$ && -n "$PUBLISH_AT" ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CAPTURE_RUN" | jq -e --arg repo "$GITHUB_REPOSITORY" '
            .conclusion == "success" and .event == "workflow_dispatch"
            and .path == ".github/workflows/youtube-shorts-autopilot.yml"
            and .head_repository.full_name == $repo
            and (.head_branch == "main" or .head_branch == "arena/7d9fee46-games")' >/dev/null
          gh run download "$CAPTURE_RUN" --name "voiced-steam-review-$CAPTURE_RUN" --dir "$RUNNER_TEMP/saved-review"
      - name: Verify and schedule the exact video through the existing uploader
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          python youtube-bot/publish_review_preview.py "$RUNNER_TEMP/saved-review" "$CAPTURE_RUN" "$PUBLISH_AT"

  publish-adventure-beta-short:
    needs: record-adventure-preview
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.adventure_preview && vars.ADVENTURE_BETA_AUTOPUBLISH == 'true' && vars.ADVENTURE_RECORDING_RIGHTS_VERIFIED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      YOUTUBE_MADE_FOR_KIDS: ${{ inputs.made_for_kids }}
      ADVENTURE_RECORDING_RIGHTS_VERIFIED: ${{ vars.ADVENTURE_RECORDING_RIGHTS_VERIFIED }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: adventure-private-${{ github.run_id }}
          path: ${{ runner.temp }}/adventure-beta
      - name: Verify the completed Short and schedule it on YouTube
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          python youtube-bot/publish_adventure_short.py "$RUNNER_TEMP/adventure-beta" "$GITHUB_RUN_ID"
