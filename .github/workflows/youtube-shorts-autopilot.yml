name: YouTube reviews autopilot (Shorts and long)

on:
  schedule:
    # Start at 04:00 and 08:00 Moscow, ahead of 08:00 and 12:00 publication.
    - cron: "0 1,5 * * *"
    # Start at 01:00 Moscow, ahead of 06:00 long-review publication.
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      publish_at:
        description: "Moscow time YYYY-MM-DD HH:MM; if rendering runs late, publish later once"
        type: string
        required: false
      made_for_kids:
        description: "Owner-approved audience classification"
        type: choice
        options:
          - "false"
          - "true"
        default: "false"
        required: true
      video_format:
        description: "Video type for a manual run"
        type: choice
        options:
          - short
          - long
        default: short
        required: true
      catalog_video:
        description: "Optional repository path to a ready MP4 (catalog upload mode)"
        type: string
        required: false
        default: ""
      catalog_title:
        description: "Catalog video title (required with catalog_video)"
        type: string
        required: false
        default: ""
      catalog_description:
        description: "Catalog video description"
        type: string
        required: false
        default: ""
      catalog_tags:
        description: "Comma-separated catalog tags"
        type: string
        required: false
        default: ""
      catalog_category_id:
        description: "YouTube category ID for the catalog video"
        type: string
        required: false
        default: "24"
      catalog_publish_at:
        description: "Catalog publication time in Moscow, YYYY-MM-DD HH:MM"
        type: string
        required: false
        default: ""
      catalog_game_id:
        description: "Stable lowercase catalog item ID"
        type: string
        required: false
        default: "catalog-video"

permissions:
  contents: read
  id-token: write

concurrency:
  # Catalog runs need separate groups: GitHub replaces pending runs in a shared group.
  group: ${{ inputs.catalog_video != '' && format('youtube-catalog-{0}', github.run_id) || 'youtube-shorts-autopilot' }}
  cancel-in-progress: false

jobs:
  create-and-schedule:
    # A catalog run uploads an existing MP4 in the separate job below.
    if: github.event_name == 'schedule' || inputs.catalog_video == ''
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      # The channel owner explicitly classified the audience as not made for kids.
      # Manual dispatch exposes the same explicit choice; scheduled runs use it too.
      YOUTUBE_MADE_FOR_KIDS: ${{ inputs.made_for_kids || 'false' }}
      MANUAL_PUBLISH_AT: ${{ inputs.publish_at || '' }}
      REVIEW_SCHEDULE: ${{ github.event.schedule || '' }}
      MANUAL_VIDEO_FORMAT: ${{ inputs.video_format || '' }}
      DATA_DIR: youtube-bot/data
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: youtube-bot/requirements-autopilot.txt
      - name: Select review format from trusted workflow event
        run: python youtube-bot/review_workflow_format.py
      - name: Validate optional manual publication time
        if: env.MANUAL_PUBLISH_AT != ''
        run: python youtube-bot/schedule_policy.py --manual-publish-at "$MANUAL_PUBLISH_AT"
      - name: Require the explicit owner-approved audience value
        run: |
          if [ "$YOUTUBE_MADE_FOR_KIDS" != "true" ] && [ "$YOUTUBE_MADE_FOR_KIDS" != "false" ]; then
            echo "::error::Choose the owner-approved audience value true or false in the workflow input."
            exit 1
          fi
      - name: Set the Russian Piper model path
        run: echo "PIPER_MODEL_PATH=$RUNNER_TEMP/ru_RU-irina-medium.onnx" >> "$GITHUB_ENV"
      - name: Restore the local Qwen model cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/huggingface
          key: qwen-shorts-0-8b-2fc06364715b967f1860aea9cf38778875588b17-v1
      - name: Restore the Russian Piper voice model cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ runner.temp }}/ru_RU-irina-medium.onnx
            ${{ runner.temp }}/ru_RU-irina-medium.onnx.json
          key: piper-ru-irina-medium-v1
      - name: Restore recent game selection memory
        uses: actions/cache/restore@v6
        with:
          path: youtube-bot/data/recent-games.json
          key: youtube-review-history-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: youtube-review-history-
      - name: Install renderer and model dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu-core
          python -m pip install --upgrade pip
          python -m pip install -r youtube-bot/requirements-autopilot.txt
      - name: Download the local Russian Piper voice model
        id: piper-download
        run: |
          set -euo pipefail
          download_model() {
            local url="$1"
            local target="$2"
            if [ -s "$target" ]; then
              return
            fi
            local partial="${target}.partial"
            rm -f "$partial"
            curl --fail --location --retry 8 --retry-all-errors --retry-delay 5 \
              --connect-timeout 30 --max-time 600 --output "$partial" "$url"
            test -s "$partial"
            mv "$partial" "$target"
          }
          download_model \
            https://huggingface.co/rhasspy/piper-voices/resolve/main/ru/ru_RU/irina/medium/ru_RU-irina-medium.onnx \
            "$PIPER_MODEL_PATH"
          download_model \
            https://huggingface.co/rhasspy/piper-voices/resolve/main/ru/ru_RU/irina/medium/ru_RU-irina-medium.onnx.json \
            "$PIPER_MODEL_PATH.json"
          test -s "$PIPER_MODEL_PATH" && test -s "$PIPER_MODEL_PATH.json"
      - name: Save the Russian Piper voice model cache
        if: always() && steps.piper-download.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ runner.temp }}/ru_RU-irina-medium.onnx
            ${{ runner.temp }}/ru_RU-irina-medium.onnx.json
          key: piper-ru-irina-medium-v1
      - name: Generate a Steam-sourced Russian game review with local Qwen
        env:
          HF_HOME: ${{ runner.temp }}/huggingface
        run: |
          # Retry rendering once only, before the upload step has started.
          # Never rerun the publisher automatically: a video might already exist.
          for attempt in 1 2; do
            if python youtube-bot/run_game_review.py "$RUNNER_TEMP/games-review.mp4" --format "$VIDEO_FORMAT"; then
              exit 0
            fi
            if [ "$attempt" = 1 ]; then
              echo "::warning::Review rendering failed; retrying once before any upload."
              sleep 20
            fi
          done
          echo "::error::Review rendering failed twice; no upload was started."
          exit 1
      - name: Start resumable YouTube upload and schedule
        run: python youtube-bot/publish_to_supabase.py "$RUNNER_TEMP/games-review.result.json"
      - name: Retain only non-sensitive model selection memory
        if: always() && hashFiles('youtube-bot/data/recent-games.json') != ''
        uses: actions/cache/save@v6
        with:
          path: youtube-bot/data/recent-games.json
          key: youtube-review-history-${{ github.run_id }}-${{ github.run_attempt }}

  publish-catalog-video:
    # Upload an existing repository MP4 through the same authorized publisher.
    if: github.event_name == 'workflow_dispatch' && inputs.catalog_video != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      YOUTUBE_MADE_FOR_KIDS: ${{ inputs.made_for_kids }}
      CATALOG_VIDEO: ${{ inputs.catalog_video }}
      CATALOG_TITLE: ${{ inputs.catalog_title }}
      CATALOG_DESCRIPTION: ${{ inputs.catalog_description }}
      CATALOG_TAGS: ${{ inputs.catalog_tags }}
      CATALOG_CATEGORY_ID: ${{ inputs.catalog_category_id }}
      CATALOG_PUBLISH_AT: ${{ inputs.catalog_publish_at }}
      CATALOG_GAME_ID: ${{ inputs.catalog_game_id }}
      VIDEO_FORMAT: ${{ inputs.video_format }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Require complete catalog inputs and owner-approved audience value
        run: |
          if [ -z "$CATALOG_TITLE" ] || [ -z "$CATALOG_PUBLISH_AT" ]; then
            echo "::error::catalog_video, catalog_title and catalog_publish_at are required together."
            exit 1
          fi
          if [ "$YOUTUBE_MADE_FOR_KIDS" != "true" ] && [ "$YOUTUBE_MADE_FOR_KIDS" != "false" ]; then
            echo "::error::Choose the owner-approved audience value true or false in the workflow input."
            exit 1
          fi
      - name: Build catalog upload metadata
        run: |
          python youtube-bot/catalog_upload.py \
            --video "$CATALOG_VIDEO" \
            --title "$CATALOG_TITLE" \
            --description "$CATALOG_DESCRIPTION" \
            --tags "$CATALOG_TAGS" \
            --category-id "$CATALOG_CATEGORY_ID" \
            --publish-at "$CATALOG_PUBLISH_AT" \
            --game-id "$CATALOG_GAME_ID" \
            --format "$VIDEO_FORMAT" \
            --output "$RUNNER_TEMP/catalog.result.json"
      - name: Start resumable YouTube upload and schedule
        run: python youtube-bot/publish_to_supabase.py "$RUNNER_TEMP/catalog.result.json"
