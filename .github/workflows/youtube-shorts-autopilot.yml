name: YouTube reviews autopilot (Shorts and long)

on:
  schedule:
    # Start at 04:00 and 08:00 Moscow, ahead of 08:00 and 12:00 publication.
    - cron: "0 1,5 * * *"
    # Start at 01:00 Moscow, ahead of 06:00 long-review publication.
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      publish_at:
        description: "Moscow time YYYY-MM-DD HH:MM; required when batch_count > 1; if rendering runs late, publish later once"
        type: string
        required: false
      made_for_kids:
        description: "Owner-approved audience classification"
        type: choice
        options:
          - "false"
          - "true"
        default: "false"
        required: true
      video_format:
        description: "Video type for a manual run"
        type: choice
        options:
          - short
          - long
        default: short
        required: true
      batch_count:
        description: "Sequential queue size (1–5 Shorts or 1–2 long); requires publish_at when > 1"
        type: string
        default: "1"
        required: true

permissions:
  contents: read
  id-token: write

concurrency:
  # Separate lanes can run in parallel, but GitHub retains at most one pending
  # run per group. Submit one batch per lane and wait for it to finish.
  group: youtube-review-${{ (github.event_name == 'schedule' && github.event.schedule == '0 22 * * *' && 'long') || (github.event_name == 'schedule' && 'short') || inputs.video_format }}
  cancel-in-progress: false

jobs:
  create-and-schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      # The channel owner explicitly classified the audience as not made for kids.
      # Manual dispatch exposes the same explicit choice; scheduled runs use it too.
      YOUTUBE_MADE_FOR_KIDS: ${{ inputs.made_for_kids || 'false' }}
      MANUAL_PUBLISH_AT: ${{ inputs.publish_at || '' }}
      REVIEW_SCHEDULE: ${{ github.event.schedule || '' }}
      MANUAL_VIDEO_FORMAT: ${{ inputs.video_format || '' }}
      REVIEW_BATCH_COUNT: ${{ inputs.batch_count || '1' }}
      DATA_DIR: youtube-bot/data
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: youtube-bot/requirements-autopilot.txt
      - name: Select review format from trusted workflow event
        run: python youtube-bot/review_workflow_format.py
      - name: Validate queue and publication times before rendering
        # One readable line with the exact fix (for example a pasteable Moscow
        # time when batch_count > 1 but publish_at is empty) instead of a
        # traceback. Nothing is rendered or uploaded when this step fails.
        run: python youtube-bot/review_batch.py --check
      - name: Require the explicit owner-approved audience value
        run: |
          if [ "$YOUTUBE_MADE_FOR_KIDS" != "true" ] && [ "$YOUTUBE_MADE_FOR_KIDS" != "false" ]; then
            echo "::error::Choose the owner-approved audience value true or false in the workflow input."
            exit 1
          fi
      - name: Set the Russian Piper model path
        run: echo "PIPER_MODEL_PATH=$RUNNER_TEMP/ru_RU-irina-medium.onnx" >> "$GITHUB_ENV"
      - name: Restore the local Qwen model cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/huggingface
          key: qwen-shorts-0-8b-2fc06364715b967f1860aea9cf38778875588b17-v1
      - name: Restore the Russian Piper voice model cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ runner.temp }}/ru_RU-irina-medium.onnx
            ${{ runner.temp }}/ru_RU-irina-medium.onnx.json
          key: piper-ru-irina-medium-v1
      - name: Restore recent game selection memory
        uses: actions/cache/restore@v6
        with:
          path: youtube-bot/data/recent-games.json
          key: youtube-review-history-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: youtube-review-history-
      - name: Install renderer and model dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu-core
          python -m pip install --upgrade pip
          python -m pip install -r youtube-bot/requirements-autopilot.txt
      - name: Download the local Russian Piper voice model
        id: piper-download
        run: |
          set -euo pipefail
          download_model() {
            local url="$1"
            local target="$2"
            if [ -s "$target" ]; then
              return
            fi
            local partial="${target}.partial"
            rm -f "$partial"
            curl --fail --location --retry 8 --retry-all-errors --retry-delay 5 \
              --connect-timeout 30 --max-time 600 --output "$partial" "$url"
            test -s "$partial"
            mv "$partial" "$target"
          }
          download_model \
            https://huggingface.co/rhasspy/piper-voices/resolve/main/ru/ru_RU/irina/medium/ru_RU-irina-medium.onnx \
            "$PIPER_MODEL_PATH"
          download_model \
            https://huggingface.co/rhasspy/piper-voices/resolve/main/ru/ru_RU/irina/medium/ru_RU-irina-medium.onnx.json \
            "$PIPER_MODEL_PATH.json"
          test -s "$PIPER_MODEL_PATH" && test -s "$PIPER_MODEL_PATH.json"
      - name: Save the Russian Piper voice model cache
        if: always() && steps.piper-download.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ runner.temp }}/ru_RU-irina-medium.onnx
            ${{ runner.temp }}/ru_RU-irina-medium.onnx.json
          key: piper-ru-irina-medium-v1
      - name: Generate and schedule review queue sequentially
        env:
          HF_HOME: ${{ runner.temp }}/huggingface
        run: python youtube-bot/review_batch.py
      - name: Retain only non-sensitive model selection memory
        if: always() && hashFiles('youtube-bot/data/recent-games.json') != ''
        uses: actions/cache/save@v6
        with:
          path: youtube-bot/data/recent-games.json
          key: youtube-review-history-${{ github.run_id }}-${{ github.run_attempt }}
