name: YouTube Shorts autopilot

on:
  schedule:
    # Tue / Thu / Sat; the planner chooses 18:30 Europe/Amsterdam for upload.
    - cron: "0 14 * * 2,4,6"
  workflow_dispatch:
    inputs:
      made_for_kids:
        description: "Explicitly enter true or false; leave blank to cancel this run"
        type: string
        required: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: youtube-shorts-autopilot
  cancel-in-progress: false

jobs:
  create-and-schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      YOUTUBE_MADE_FOR_KIDS: ${{ inputs.made_for_kids || vars.YOUTUBE_MADE_FOR_KIDS }}
      DATA_DIR: youtube-bot/data
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: youtube-bot/requirements-autopilot.txt
      - name: Require an explicit YouTube audience declaration
        run: |
          if [ "$YOUTUBE_MADE_FOR_KIDS" != "true" ] && [ "$YOUTUBE_MADE_FOR_KIDS" != "false" ]; then
            echo "::error::Set repository variable YOUTUBE_MADE_FOR_KIDS to true or false. Autopublication is blocked until the owner explicitly classifies the audience."
            exit 1
          fi
      - name: Restore the local Qwen model cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/huggingface
          key: qwen-shorts-0-8b-2fc06364715b967f1860aea9cf38778875588b17-v1
      - name: Restore recent game selection memory
        uses: actions/cache/restore@v6
        with:
          path: youtube-bot/data/recent-games.json
          key: youtube-review-history-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: youtube-review-history-
      - name: Install renderer and model dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak-ng fonts-dejavu-core
          python -m pip install --upgrade pip
          python -m pip install -r youtube-bot/requirements-autopilot.txt
      - name: Generate a source-grounded game review with Qwen
        env:
          HF_HOME: ${{ runner.temp }}/huggingface
        run: python youtube-bot/run_game_review.py "$RUNNER_TEMP/games-review.mp4"
      - name: Upload and schedule with YouTube
        run: |
          # The publisher requests its own audience-scoped OIDC token; it is never logged or passed as an argument.
          python youtube-bot/publish_to_supabase.py "$RUNNER_TEMP/games-review.result.json"
      - name: Retain only non-sensitive model selection memory
        if: always() && hashFiles('youtube-bot/data/recent-games.json') != ''
        uses: actions/cache/save@v6
        with:
          path: youtube-bot/data/recent-games.json
          key: youtube-review-history-${{ github.run_id }}-${{ github.run_attempt }}
