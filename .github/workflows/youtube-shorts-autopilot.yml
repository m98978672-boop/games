# The name is referenced by youtube-autopilot-monitor.yml; renaming it here
# would silently stop failure monitoring, so the third category is documented in
# the schedule comment instead.
name: YouTube reviews autopilot (Shorts and long)

on:
  schedule:
    # Owner-approved review cadence: two Shorts and one long per day.
    - cron: "0 3 * * *" # Short at 09:00 Moscow
    - cron: "0 7 * * *" # Short at 13:00 Moscow
    - cron: "0 0 * * *" # Long review at 06:00 Moscow
    # Gameplay: one a day at 18:00 Moscow, and only while a playthrough is open.
    # The run checks readiness; a finished playthrough uploads nothing.
    - cron: "0 14 * * *"
  workflow_dispatch:
    inputs:
      review_capture_run:
        description: "Publish the exact completed Steam review preview from this Actions run ID"
        type: string
        required: false
      review_preview:
        description: "Render one complete Steam game review without uploading"
        type: boolean
        default: false
      adventure_preview:
        description: "Record a finite story adventure instead of reviews (private draft)"
        type: boolean
        default: false
      puzzle_episode:
        description: "Record, edit and schedule a new independent Zuza puzzle episode"
        type: boolean
        default: false
      adventure_capture_run:
        description: "Optional completed private finite-game capture run ID; publish pilot only"
        type: string
        required: false
      gameplay_episode:
        description: "Record today's gameplay video (one a day, only while the playthrough is open)"
        type: boolean
        default: false
      publish_at:
        description: "Moscow time YYYY-MM-DD HH:MM; blank picks regular slots (batch: 8h lead, 2 Shorts a day / 1 long a day)"
        type: string
        required: false
      made_for_kids:
        description: "Owner-approved audience classification"
        type: choice
        options:
          - "false"
          - "true"
        default: "false"
        required: true
      video_format:
        description: "Video type for a manual run"
        type: choice
        options:
          - short
          - long
        default: short
        required: true
      batch_count:
        description: "Sequential queue size (1–5 Shorts or 1–2 long); blank publish_at picks a regular slot"
        type: string
        default: "1"
        required: true
      check_topics_only:
        description: "Read-only topic ledger check; never render or upload"
        type: boolean
        default: false
        required: false

permissions:
  contents: read
  id-token: write

concurrency:
  # Separate lanes can run in parallel, but GitHub retains at most one pending
  # run per group. Submit one batch per lane and wait for it to finish.
  # One lane per format, so a long review never waits behind a Short. GitHub
  # keeps at most one pending run per group, which is why the batch input is
  # capped; separate firing times never share a lane at the same moment.
  group: youtube-review-${{ (github.event_name == 'schedule' && github.event.schedule == '0 14 * * *' && 'gameplay') || (github.event_name == 'schedule' && github.event.schedule == '0 0 * * *' && 'long') || (github.event_name == 'schedule' && 'short') || (inputs.review_preview && 'review-preview') || (inputs.adventure_preview && 'adventure-preview') || (inputs.puzzle_episode && 'puzzle-episode') || inputs.video_format }}
  cancel-in-progress: false

jobs:
  # Reads one input to know which job name to keep, so a change to the
  # reconciliation logic updates this job instead of silently never running.
  reconcile-scheduled-slots:
    if: github.event_name == 'schedule' && github.repository == 'm98978672-boop/games'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # The plan is written to an issue, because Actions logs are not readable
      # from a phone and the owner must not have to dig for the schedule.
      issues: write
    env:
      REVIEW_SCHEDULE: ${{ github.event.schedule || '' }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Check which planned slots still have no video
        run: |
          set -euo pipefail
          # Read-only: lists planned slots, their state and the exact start
          # command for every missing one. It never renders or uploads.
          python youtube-bot/reconcile_schedule.py > "$RUNNER_TEMP/slots.md" 2>&1 || true
          cat "$RUNNER_TEMP/slots.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Publish the plan to the pinned issue
        run: |
          set -euo pipefail
          # Strip runner protocol lines. "::add-mask::<token>" is a command for
          # the runner, not Markdown; pasting it into an issue would print a
          # credential in the clear.
          grep -v -e '^::' -e '^eyJ' "$RUNNER_TEMP/slots.md" > "$RUNNER_TEMP/plan.md" || true
          if [ ! -s "$RUNNER_TEMP/plan.md" ]; then
            printf '## Что выйдет в ближайшие дни\n\nОчередь прочитать не удалось. Ничего не запущено.\n' \
              > "$RUNNER_TEMP/plan.md"
          fi
          {
            cat "$RUNNER_TEMP/plan.md"
            echo
            echo '---'
            echo "Обновлено: $(TZ=Europe/Moscow date '+%d.%m %H:%M') МСК."
            echo 'Это только чтение: доска ничего не рендерит и не загружает.'
          } > "$RUNNER_TEMP/issue.md"
          number=$(gh issue list --state open --limit 100 --json number,title \
            --jq '.[] | select(.title == "План видео") | .number' | head -n 1)
          if [ -z "$number" ]; then
            gh issue create --title "План видео" --body-file "$RUNNER_TEMP/issue.md" > /dev/null
            echo "Доска создана." >> "$GITHUB_STEP_SUMMARY"
          else
            gh issue edit "$number" --body-file "$RUNNER_TEMP/issue.md"
            echo "Доска #$number обновлена." >> "$GITHUB_STEP_SUMMARY"
          fi

  gameplay-gate:
    # The owner's rule, checked before an hour of capture is spent: a gameplay
    # video is at most one a day, only while the playthrough is open, and a cut
    # under three minutes is a Short. This job decides; it never records.
    if: github.event_name == 'schedule' && contains(fromJSON('["0 14 * * *"]'), github.event.schedule)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The decision is the whole point of this job: without these the recording
    # job downstream would receive empty strings and record regardless.
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
      video_kind: ${{ steps.decide.outputs.video_kind }}
      publish_at: ${{ steps.decide.outputs.publish_at }}
    permissions:
      contents: read
      id-token: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Decide today's gameplay publication
        id: decide
        run: |
          set -euo pipefail
          # An unreadable playthrough state stops here: treating a finished game
          # as open would restart a playthrough the AI already completed.
          python youtube-bot/gameplay_today.py --game adventure > "$RUNNER_TEMP/gameplay.txt" 2>&1 || {
            cat "$RUNNER_TEMP/gameplay.txt" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }
          cat "$RUNNER_TEMP/gameplay.txt" | tee -a "$GITHUB_STEP_SUMMARY" | grep -v -e '^::' -e '^eyJ' || true
          publish=$(grep -m1 '^publish=' "$RUNNER_TEMP/gameplay.txt" | cut -d= -f2-)
          kind=$(grep -m1 '^video_kind=' "$RUNNER_TEMP/gameplay.txt" | cut -d= -f2-)
          when=$(grep -m1 '^publish_at=' "$RUNNER_TEMP/gameplay.txt" | cut -d= -f2-)
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "video_kind=$kind" >> "$GITHUB_OUTPUT"
          echo "publish_at=$when" >> "$GITHUB_OUTPUT"
      - name: Explain the decision in plain words
        run: |
          set -euo pipefail
          if [ "${{ steps.decide.outputs.publish }}" != "true" ]; then
            echo "Сегодня игрового видео нет — и это правильно. Ничего не записано." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          case "${{ steps.decide.outputs.video_kind }}" in
            short) shelf="Shorts (запись короче трёх минут)";;
            long)  shelf="полное видео (три минуты и больше)";;
            *)     echo "::error::Неизвестная категория игрового видео."; exit 1;;
          esac
          {
            echo "### Игровое видео на сегодня"
            echo
            echo "- Категория: $shelf"
            echo "- Время выхода: ${{ steps.decide.outputs.publish_at }} МСК"
            echo
            echo "Запись запускается отдельной джобой прохождения; здесь только решение."
          } >> "$GITHUB_STEP_SUMMARY"

  record-gameplay:
    # The gameplay category, executed as far as publication is currently
    # permitted: the gate decides, this job records and assembles the private
    # artifact. Publishing stays blocked by gameplay_release_gate until timed
    # subtitles, proven real play and safe same-day splitting exist, so this job
    # must not promise that a video will appear.
    #
    # One a day is enforced twice: the gate skips a closed playthrough or a day
    # that already published, and this job only runs for the gameplay firing or
    # an explicit manual request.
    needs: gameplay-gate
    if: ${{ always() && !cancelled() && ((github.event_name == 'workflow_dispatch' && inputs.gameplay_episode) || (github.event_name == 'schedule' && github.event.schedule == '0 14 * * *')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
    env:
      GATE_PUBLISH: ${{ needs.gameplay-gate.outputs.publish }}
      GATE_PUBLISH_AT: ${{ needs.gameplay-gate.outputs.publish_at }}
    outputs:
      record: ${{ steps.decide.outputs.record }}
      publish_at: ${{ steps.slot.outputs.publish_at }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Skip when the gate said no
        id: decide
        run: |
          set -euo pipefail
          if [ "${GATE_PUBLISH:-}" = "false" ]; then
            echo "Гейт решил не публиковать сегодня: запись не запускается." >> "$GITHUB_STEP_SUMMARY"
            echo "record=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "record=true" >> "$GITHUB_OUTPUT"
      - name: Work out the publication slot
        if: steps.decide.outputs.record == 'true'
        id: slot
        run: |
          set -euo pipefail
          slot="${GATE_PUBLISH_AT:-}"
          if [ -z "$slot" ]; then
            slot=$(PYTHONPATH=youtube-bot python -c 'from datetime import datetime, timezone; from schedule_policy import CHANNEL_TZ; from gameplay_policy import next_gameplay_slot; print(next_gameplay_slot(datetime.now(timezone.utc)).astimezone(CHANNEL_TZ).strftime("%Y-%m-%d %H:%M"))')
          fi
          echo "publish_at=$slot" >> "$GITHUB_OUTPUT"
          # Not "will be released": publication is blocked until the release
          # requirements are verifiable, so promising a release would be false.
          echo "Запись для слота $slot МСК будет подготовлена; публикация ждёт проверки требований." >> "$GITHUB_STEP_SUMMARY"

  capture-gameplay:
    # The recording itself, split out because a reusable workflow cannot be a
    # step: it must be its own job. Without this the decision above was still
    # only a decision.
    needs: record-gameplay
    if: ${{ always() && !cancelled() && needs.record-gameplay.outputs.record == 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/adventure-experiment.yml
    with:
      adventure_only: true

  publish-gameplay:
    # Recording without publishing was the last dead end: the decision was
    # executed and the result still never reached the channel. This job uploads
    # what the capture just produced, and the release gate inside the publisher
    # decides whether it may go out.
    needs: [record-gameplay, capture-gameplay]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.capture-gameplay.result == 'success' && needs.record-gameplay.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      CAPTURE_RUN: ${{ github.run_id }}
      PUBLISH_AT: ${{ needs.record-gameplay.outputs.publish_at }}
      YOUTUBE_MADE_FOR_KIDS: ${{ inputs.made_for_kids || 'false' }}
      # The uploader checks this too, so it has to be present here or the job
      # would fail after the recording was already made.
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Fetch the recording from this run
        uses: actions/download-artifact@v4
        with:
          name: adventure-private-${{ github.run_id }}
          path: ${{ runner.temp }}/adventure-publish
      - name: Install the media verifier
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Publish through the existing authorized uploader
        env:
          DATA_DIR: ${{ runner.temp }}/adventure-history
        run: |
          set -euo pipefail
          folder="$RUNNER_TEMP/adventure-publish"
          if [[ ! -f "$folder/release.evidence.json" ]]; then
            echo '::error::The recording carries no release evidence; nothing is published.'
            exit 1
          fi
          if jq -e '.short == true' "$folder/pilot.json" >/dev/null; then
            python youtube-bot/publish_adventure_short.py "$folder" "$CAPTURE_RUN" "$PUBLISH_AT"
          else
            python youtube-bot/publish_adventure_draft.py "$folder" "$CAPTURE_RUN" "$PUBLISH_AT"
          fi

  check-topic-history:
    if: github.event_name == 'workflow_dispatch' && inputs.check_topics_only
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Verify the shared topic ledger without rendering or uploading
        run: PYTHONPATH=youtube-bot python -c 'from publish_to_supabase import _supabase_post; r = _supabase_post("/autopilot/topic-history", {}); assert r.get("version") == 1 and isinstance(r.get("game_ids"), list); print("History available:", len(r["game_ids"]), "topics")'

  create-and-schedule:
    # The gameplay firing is a different category: it must never render a review.
    # Without this guard the 17:00 Moscow run would also start a review render
    # and, on a busy day, publish a tenth video nobody asked for.
    if: ${{ !inputs.check_topics_only && !inputs.review_capture_run && !inputs.adventure_capture_run && !inputs.puzzle_episode && !inputs.adventure_preview && !(github.event_name == 'schedule' && github.event.schedule == '0 14 * * *') }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      # The channel owner explicitly classified the audience as not made for kids.
      # Manual dispatch exposes the same explicit choice; scheduled runs use it too.
      YOUTUBE_MADE_FOR_KIDS: ${{ inputs.made_for_kids || 'false' }}
      MANUAL_PUBLISH_AT: ${{ inputs.publish_at || '' }}
      REVIEW_SCHEDULE: ${{ github.event.schedule || '' }}
      REVIEW_PREVIEW: ${{ inputs.review_preview }}
      MANUAL_VIDEO_FORMAT: ${{ inputs.video_format || '' }}
      REVIEW_BATCH_COUNT: ${{ inputs.batch_count || '1' }}
      DATA_DIR: youtube-bot/data
      # Never render with an unavailable or incomplete shared topic ledger.
      REQUIRE_SHARED_TOPIC_HISTORY: "true"
    steps:
      # The pipeline is cut by purpose, not by tool: each stage produces exactly
      # the inputs the next one needs, and starts as soon as those inputs exist.
      #
      #   stage 1  ready to generate   -> checkout, inputs, caches, ffmpeg, voice
      #   stage 2  ready to render     -> one review planned for a confirmed slot
      #   stage 3  ready to publish    -> verified 1080p50 file
      #   stage 4  publish             -> exactly one upload
      #
      # Stage 1: everything stage 2 needs.
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: youtube-bot/requirements-autopilot.txt
      # Entry contract of stage 1: format, queue times, audience and the voice
      # path are checked in one step, before caches and FFmpeg, so a typo fails
      # in seconds. Each check still fails closed on its own and prints one
      # readable ::error:: line; nothing is rendered or uploaded when it fails.
      # An empty publish_at is valid and picks regular slots.
      - name: "Stage 1: validate inputs and set the voice model path"
        run: |
          set -euo pipefail
          python youtube-bot/review_workflow_format.py
          # A value written to $GITHUB_ENV reaches only later steps, so pass the
          # format to the same-step validator explicitly.
          if [ "$REVIEW_PREVIEW" != "true" ]; then
            VIDEO_FORMAT=$(grep -m1 '^VIDEO_FORMAT=' "$GITHUB_ENV" | cut -d= -f2-)
            VIDEO_FORMAT="$VIDEO_FORMAT" python youtube-bot/review_batch.py --check
          fi
          if [ "$YOUTUBE_MADE_FOR_KIDS" != "true" ] && [ "$YOUTUBE_MADE_FOR_KIDS" != "false" ]; then
            echo "::error::Choose the owner-approved audience value true or false in the workflow input."
            exit 1
          fi
          echo "PIPER_MODEL_PATH=$RUNNER_TEMP/ru_RU-irina-medium.onnx" >> "$GITHUB_ENV"
      - name: Restore the local Qwen model cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/huggingface
          key: qwen-shorts-0-8b-2fc06364715b967f1860aea9cf38778875588b17-v1
      - name: Restore the Russian Piper voice model cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ runner.temp }}/ru_RU-irina-medium.onnx
            ${{ runner.temp }}/ru_RU-irina-medium.onnx.json
          key: piper-ru-irina-medium-v1
      - name: Restore recent game selection memory
        uses: actions/cache/restore@v6
        with:
          path: youtube-bot/data/recent-games.json
          key: youtube-review-history-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: youtube-review-history-
      - name: Install renderer and model dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu-core
          python -m pip install --upgrade pip
          python -m pip install -r youtube-bot/requirements-autopilot.txt
      - name: Download the local Russian Piper voice model
        id: piper-download
        run: |
          set -euo pipefail
          download_model() {
            local url="$1"
            local target="$2"
            if [ -s "$target" ]; then
              return
            fi
            local partial="${target}.partial"
            rm -f "$partial"
            curl --fail --location --retry 8 --retry-all-errors --retry-delay 5 \
              --connect-timeout 30 --max-time 600 --output "$partial" "$url"
            test -s "$partial"
            mv "$partial" "$target"
          }
          download_model \
            https://huggingface.co/rhasspy/piper-voices/resolve/main/ru/ru_RU/irina/medium/ru_RU-irina-medium.onnx \
            "$PIPER_MODEL_PATH"
          download_model \
            https://huggingface.co/rhasspy/piper-voices/resolve/main/ru/ru_RU/irina/medium/ru_RU-irina-medium.onnx.json \
            "$PIPER_MODEL_PATH.json"
          test -s "$PIPER_MODEL_PATH" && test -s "$PIPER_MODEL_PATH.json"
      - name: Save the Russian Piper voice model cache
        if: always() && steps.piper-download.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ runner.temp }}/ru_RU-irina-medium.onnx
            ${{ runner.temp }}/ru_RU-irina-medium.onnx.json
          key: piper-ru-irina-medium-v1

      # Stage 2: everything stage 3 needs - a planned review for a free slot.
      - name: "Stage 2: confirm the slot (read-only)"
        id: slot-state
        if: ${{ !inputs.review_preview }}
        # A scheduled run asks the private queue first: reading is cheap,
        # rendering is not. A manual dispatch keeps its explicit plan and is
        # never skipped here; its own requested time is checked inside the
        # renderer before any expensive work. An unreadable queue stops the run.
        run: python youtube-bot/review_batch.py --check-queue

      # Stage 3: everything stage 4 needs - a verified file.
      - name: "Stage 3: generate and render the review"
        if: ${{ !inputs.review_preview && steps.slot-state.outputs.skip != 'true' }}
        env:
          HF_HOME: ${{ runner.temp }}/huggingface
        # Narration for every scene, then frames for every scene, run in
        # parallel inside the renderer; still frames are drawn once and reused.
        run: python youtube-bot/review_batch.py

      # Stage 4 (publish) runs inside stage 3: review_batch publishes each
      # rendered file exactly once and never retries an upload.

      - name: Render one private game review with corrected Russian pronunciation
        if: inputs.review_preview
        env:
          HF_HOME: ${{ runner.temp }}/huggingface
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/review-preview"
          python -u youtube-bot/run_game_review.py "$RUNNER_TEMP/review-preview/review.mp4" --format "$VIDEO_FORMAT" --preview
      - name: Verify the exported review MP4 and audio
        if: inputs.review_preview
        run: python youtube-bot/verify_review_artifact.py "$RUNNER_TEMP/review-preview"
      - name: Save review MP4 and verification reports
        if: inputs.review_preview
        uses: actions/upload-artifact@v4
        with:
          name: voiced-steam-review-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/review-preview/review.mp4
            ${{ runner.temp }}/review-preview/review.result.json
            ${{ runner.temp }}/review-preview/review.media.json
          if-no-files-found: error
          retention-days: 7
      - name: Retain only non-sensitive model selection memory
        if: always() && hashFiles('youtube-bot/data/recent-games.json') != ''
        uses: actions/cache/save@v6
        with:
          path: youtube-bot/data/recent-games.json
          key: youtube-review-history-${{ github.run_id }}-${{ github.run_attempt }}

  check-puzzle-episode:
    if: github.event_name == 'workflow_dispatch' && inputs.puzzle_episode && !inputs.review_capture_run && !inputs.adventure_preview && !inputs.check_topics_only
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      CAPTURE_RUN: ${{ inputs.adventure_capture_run }}
      PUBLISH_AT: ${{ inputs.publish_at }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Check publishing prerequisites before starting the recording
        run: |
          [[ "$GITHUB_REF" == refs/heads/main && -z "$CAPTURE_RUN" ]] || { echo '::error::Select main and do not set a previous capture run.'; exit 1; }
          PYTHONPATH=youtube-bot python - <<'PYCODE'
          import os
          from datetime import datetime, timedelta, timezone
          from schedule_policy import manual_publish_time
          now = datetime.now(timezone.utc)
          if manual_publish_time(os.environ['PUBLISH_AT'], now=now) < now + timedelta(hours=3):
              raise SystemExit('Choose a Moscow publication slot at least 3 hours ahead for recording, retry and upload.')
          PYCODE

  record-puzzle-episode:
    needs: check-puzzle-episode
    permissions:
      contents: read
    uses: ./.github/workflows/adventure-experiment.yml
    with:
      puzzle_episode: true

  record-adventure-preview:
    if: github.event_name == 'workflow_dispatch' && inputs.adventure_preview && !inputs.review_capture_run && !inputs.puzzle_episode && !inputs.check_topics_only && inputs.adventure_capture_run == ''
    permissions:
      contents: read
    uses: ./.github/workflows/adventure-experiment.yml
    with:
      adventure_only: true

  publish-adventure-pilot:
    needs: record-puzzle-episode
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && !inputs.review_capture_run && !inputs.adventure_preview && !inputs.check_topics_only && ((inputs.puzzle_episode && needs.record-puzzle-episode.result == 'success') || (!inputs.puzzle_episode && inputs.adventure_capture_run != '')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      CAPTURE_RUN: ${{ inputs.puzzle_episode && github.run_id || inputs.adventure_capture_run }}
      TRUSTED_LIGHTHOUSE_CAPTURE: 'true'
      PUBLISH_AT: ${{ inputs.publish_at }}
      YOUTUBE_MADE_FOR_KIDS: ${{ inputs.made_for_kids }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Fetch this episode from the same run
        if: inputs.puzzle_episode
        uses: actions/download-artifact@v4
        with:
          name: puzzle-private-${{ github.run_id }}
          path: ${{ runner.temp }}/adventure-publish
      - name: Verify capture provenance and fetch the private artifact
        if: ${{ !inputs.puzzle_episode }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$CAPTURE_RUN" == 45841604660 ]]; then
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/15127728538" | jq -e '
              .name == "supertuxkart-race-45841604660" and .expired == false and .workflow_run.id == 45841604660
              and .digest == "sha256:dafbde43a4a3f560e38d89ae1426bcc1b4e6be14c58c51df1f38f8dec0656c9b"' >/dev/null
            gh run download "$CAPTURE_RUN" --name supertuxkart-race-45841604660 --dir "$RUNNER_TEMP/adventure-publish"
            echo 'TRUSTED_STK_CAPTURE=true' >> "$GITHUB_ENV"
            exit 0
          fi
          if [[ "$CAPTURE_RUN" == 45835569880 ]]; then
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/15124642887" | jq -e '
              .name == "relay-3d-beta-45835569880" and .expired == false and .workflow_run.id == 45835569880
              and .digest == "sha256:726c86da8b2480ee2b4d20bfd0c45e8884fc62ea169184be2fab7c39c2a55a01"' >/dev/null
            gh run download "$CAPTURE_RUN" --name relay-3d-beta-45835569880 --dir "$RUNNER_TEMP/adventure-publish"
            echo 'TRUSTED_RELAY_CAPTURE=true' >> "$GITHUB_ENV"
            exit 0
          fi
          if [[ "$CAPTURE_RUN" == 45708093545 || "$CAPTURE_RUN" == lighthouse-revoice ]]; then
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/15065774746" | jq -e '
              .name == "adventure-private-45708093545" and .expired == false and .workflow_run.id == 45708093545
              and .digest == "sha256:4a80b5aba819c13881ecf6d51d1953075e8b61c5424fc9a6d68de5bd246cd044"' >/dev/null
            gh run download 45708093545 --name adventure-private-45708093545 --dir "$RUNNER_TEMP/adventure-publish"
            echo 'TRUSTED_LIGHTHOUSE_CAPTURE=true' >> "$GITHUB_ENV"
            if [[ "$CAPTURE_RUN" == lighthouse-revoice ]]; then echo 'LIGHTHOUSE_REVOICE=true' >> "$GITHUB_ENV"; fi
            exit 0
          fi
          [[ -n "$PUBLISH_AT" && "$CAPTURE_RUN" =~ ^[0-9]+$ ]] || { echo "::error::A publication time and numeric capture run are required."; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CAPTURE_RUN" | jq -e '
            .conclusion == "success" and .path == ".github/workflows/adventure-experiment.yml"
            and .head_branch == "arena/7d9fee46-games" and .head_repository.full_name == "m98978672-boop/games"' >/dev/null
          artifact="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CAPTURE_RUN/artifacts" | jq -er --arg id "$CAPTURE_RUN" '[.artifacts[] | select(.expired == false and (.name == ("puzzle-private-" + $id) or .name == ("adventure-private-" + $id))) | .name] | select(length == 1) | .[0]')"
          # Rights are no longer a variable to tick: the release gate reads
          # release.evidence.json and refuses an external game without a
          # verified open licence. Our own games say "own" and need nothing.
          gh run download "$CAPTURE_RUN" --name "$artifact" --dir "$RUNNER_TEMP/adventure-publish"
      - name: Install media verifier
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Replace narration with Russian neural voice
        if: env.LIGHTHOUSE_REVOICE == 'true'
        run: |
          set -euo pipefail
          python -m pip install 'piper-tts==1.3.0'
          export PIPER_MODEL_PATH="$RUNNER_TEMP/ru_RU-irina-medium.onnx"
          base=https://huggingface.co/rhasspy/piper-voices/resolve/main/ru/ru_RU/irina/medium/ru_RU-irina-medium.onnx
          curl --fail --location --retry 4 --max-time 180 "$base" -o "$PIPER_MODEL_PATH"
          curl --fail --location --retry 4 --max-time 180 "$base.json" -o "$PIPER_MODEL_PATH.json"
          python youtube-bot/adventure_draft.py "$RUNNER_TEMP/adventure-publish"
      - name: Save the corrected edition before the upload
        if: env.LIGHTHOUSE_REVOICE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-russian-voice-v2-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/adventure-publish/zuza-adventure-short.mp4
            ${{ runner.temp }}/adventure-publish/zuza-adventure-short.ru.srt
            ${{ runner.temp }}/adventure-publish/pilot.json
          if-no-files-found: error
      - name: Publish through the existing authorized uploader
        env:
          DATA_DIR: ${{ runner.temp }}/adventure-history
        run: |
          set -euo pipefail
          folder="$RUNNER_TEMP/adventure-publish"
          if [[ "$CAPTURE_RUN" == 45841604660 ]] || jq -e '.beta_episode == true or (has("beta_episode") | not) and .short == true' "$folder/pilot.json" >/dev/null; then
            source_run="$CAPTURE_RUN"
            if [[ "$CAPTURE_RUN" == lighthouse-revoice ]]; then source_run=45708093545; fi
            python youtube-bot/publish_adventure_short.py "$folder" "$source_run" "$PUBLISH_AT"
          else
            python youtube-bot/publish_adventure_draft.py "$folder" "$CAPTURE_RUN" "$PUBLISH_AT"
          fi

  publish-saved-review:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.review_capture_run != '' && !inputs.review_preview && !inputs.adventure_preview && !inputs.puzzle_episode && !inputs.check_topics_only && inputs.adventure_capture_run == ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      CAPTURE_RUN: ${{ inputs.review_capture_run }}
      PUBLISH_AT: ${{ inputs.publish_at }}
      YOUTUBE_MADE_FOR_KIDS: ${{ inputs.made_for_kids }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Download the selected private review from this repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$CAPTURE_RUN" =~ ^[0-9]+$ && -n "$PUBLISH_AT" ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CAPTURE_RUN" | jq -e --arg repo "$GITHUB_REPOSITORY" '
            .conclusion == "success" and .event == "workflow_dispatch"
            and .path == ".github/workflows/youtube-shorts-autopilot.yml"
            and .head_repository.full_name == $repo
            and (.head_branch == "main" or .head_branch == "arena/7d9fee46-games")' >/dev/null
          gh run download "$CAPTURE_RUN" --name "voiced-steam-review-$CAPTURE_RUN" --dir "$RUNNER_TEMP/saved-review"
      - name: Verify and schedule the exact video through the existing uploader
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          python youtube-bot/publish_review_preview.py "$RUNNER_TEMP/saved-review" "$CAPTURE_RUN" "$PUBLISH_AT"
