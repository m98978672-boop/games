name: Russian speech smoke
on:
  push:
    branches: [main, arena/4735b829-games]
    paths:
      - .github/workflows/speech-quality-check.yml
      - youtube-bot/speech_pronunciation.py
      - youtube-bot/speech_synthesis.py
      - youtube-bot/adventure_draft.py
      - youtube-bot/gameplay_voiceover.py
      - youtube-bot/tests/live_speech_smoke.py
      - youtube-bot/tests/test_speech_pronunciation.py
permissions:
  contents: read
jobs:
  speech:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install local speech engines
        run: |
          sudo apt-get update && sudo apt-get install -y espeak-ng ffmpeg
          python -m pip install 'piper-tts==1.3.0'
      - name: Fetch Russian voice
        run: |
          base=https://huggingface.co/rhasspy/piper-voices/resolve/main/ru/ru_RU/irina/medium/ru_RU-irina-medium.onnx
          curl --fail --location --retry 5 --retry-all-errors --connect-timeout 30 --max-time 600 "$base" -o "$RUNNER_TEMP/voice.onnx"
          curl --fail --location --retry 5 --retry-all-errors --connect-timeout 30 --max-time 600 "$base.json" -o "$RUNNER_TEMP/voice.onnx.json"
      - name: Test normalization, cadence and real speech
        env:
          PIPER_MODEL_PATH: ${{ runner.temp }}/voice.onnx
        run: |
          python -m unittest discover -s youtube-bot/tests -p test_speech_pronunciation.py
          python youtube-bot/tests/live_speech_smoke.py "$RUNNER_TEMP/speech-preview"
      - uses: actions/upload-artifact@v4
        with:
          name: russian-speech-listening-preview
          path: ${{ runner.temp }}/speech-preview
          if-no-files-found: error
