<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-label="Обложка игры НИКА: ЖИВАЯ">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101821"/><stop offset="0.55" stop-color="#1b1d2b"/><stop offset="1" stop-color="#2a1d2c"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="55%">
      <stop offset="0" stop-color="#e78fa6" stop-opacity=".30"/><stop offset="1" stop-color="#e78fa6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dress" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#f0788d"/><stop offset="1" stop-color="#b94768"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d4642"/><stop offset="0.45" stop-color="#432c33"/><stop offset="1" stop-color="#2b1f28"/>
    </linearGradient>
    <linearGradient id="hair2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#794e45"/><stop offset="0.55" stop-color="#4b3136"/><stop offset="1" stop-color="#302129"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff2e0"/><stop offset="0.4" stop-color="#f9dac1"/><stop offset="0.75" stop-color="#f1c5a7"/><stop offset="1" stop-color="#dfa98c"/>
    </linearGradient>
    <radialGradient id="iris" cx="35%" cy="30%" r="72%">
      <stop offset="0" stop-color="#e6ca92"/><stop offset="0.4" stop-color="#a99a61"/><stop offset="0.75" stop-color="#6d7c50"/><stop offset="1" stop-color="#2e3929"/>
    </radialGradient>
    <radialGradient id="blush" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#e7788d" stop-opacity=".55"/><stop offset="1" stop-color="#e7788d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cheekShade" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#9e5e4c" stop-opacity=".28"/><stop offset="1" stop-color="#9e5e4c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b85f6e"/><stop offset="0.5" stop-color="#d47f8b"/><stop offset="1" stop-color="#bd6374"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd0dc"/><stop offset="1" stop-color="#e78fa6"/>
    </linearGradient>
  </defs>
  <rect width="1440" height="810" fill="url(#bg)"/>
  <rect width="1440" height="810" fill="url(#glow)"/>
  <!-- сетка «скелетных» узлов -->
  <g stroke="#e78fa6" stroke-opacity=".14" stroke-width="1">
    <path d="M0 120H1440M0 240H1440M0 360H1440M0 480H1440M0 600H1440M0 720H1440"/>
    <path d="M120 0V810M240 0V810M360 0V810M480 0V810M600 0V810M720 0V810M840 0V810M960 0V810M1080 0V810M1200 0V810M1320 0V810"/>
  </g>
  <!-- левый текст -->
  <g font-family="Segoe UI, system-ui, sans-serif">
    <text x="96" y="196" fill="#e78fa6" font-size="22" letter-spacing="7">БРАУЗЕРНАЯ ИГРА · НОВАЯ ВНЕШНОСТЬ · 0 ₽</text>
    <text x="92" y="310" fill="#ffd0dc" font-size="112" font-weight="800" letter-spacing="6">НИКА:</text>
    <text x="92" y="420" fill="#f2ecdf" font-size="112" font-weight="800" letter-spacing="6">ЖИВАЯ</text>
    <text x="96" y="488" fill="#a9a294" font-size="25">Девушка, которой управляет локальный ИИ</text>
    <text x="96" y="532" fill="#a9a294" font-size="25">13 зон · 400 ассетов · 2400 точек · переодевание в 3 фазы</text>
    <g transform="translate(96,584)">
      <rect width="228" height="52" rx="26" fill="url(#gold)"/>
      <text x="114" y="34" text-anchor="middle" fill="#2a1420" font-size="21" font-weight="800">483 АНИМАЦИИ</text>
      <rect x="244" width="216" height="52" rx="26" fill="rgba(231,143,166,.14)" stroke="#e78fa6" stroke-opacity=".6"/>
      <text x="352" y="34" text-anchor="middle" fill="#ffd0dc" font-size="21" font-weight="700">33 ЧАСТИ ТЕЛА</text>
      <rect x="476" width="220" height="52" rx="26" fill="rgba(155,140,240,.14)" stroke="#9b8cf0" stroke-opacity=".6"/>
      <text x="586" y="34" text-anchor="middle" fill="#c9c0ff" font-size="21" font-weight="700">ИИ БЕЗ ОБЛАКА</text>
    </g>
    <text x="96" y="706" fill="#6f6a5f" font-size="19">min 10 клипов на часть · характер и комплексы · нижний слой одежды · моторные программы · локальное обучение</text>
  </g>
  <!-- девушка: мягкая иллюстрация, как в самой игре -->
  <g transform="translate(1065,405)">
    <ellipse cx="0" cy="270" rx="140" ry="20" fill="#000" opacity=".28"/>
    <!-- волнистые волосы сзади -->
    <path d="M-72 -118 C-106 -46 -96 92 -70 140 C-30 164 30 164 70 140 C96 92 106 -46 72 -118 Z" fill="url(#hair)"/>
    <g stroke="#b37e66" stroke-opacity=".24" stroke-width="3" fill="none" stroke-linecap="round">
      <path d="M-48 -100 C-64 -20 -60 60 -46 132"/>
      <path d="M0 -110 C-8 -30 -6 60 0 140"/>
      <path d="M48 -100 C64 -20 60 60 46 132"/>
    </g>
    <!-- ноги -->
    <g stroke="#e9b99a" stroke-width="24" stroke-linecap="round" fill="none">
      <path d="M-28 84 L-40 216 L-48 262"/>
      <path d="M28 84 L40 216 L48 262"/>
    </g>
    <g stroke="#ece7dc" stroke-width="15" stroke-linecap="round">
      <path d="M-58 262 H-34"/><path d="M34 262 H58"/>
    </g>
    <!-- платье с мягким подолом -->
    <path d="M-52 -24 L-70 116 Q0 146 70 116 L52 -24 Z" fill="url(#dress)" stroke="#8f3d58" stroke-width="2.5"/>
    <path d="M-50 -24 C-52 -70 -48 -104 -34 -118 Q0 -136 34 -118 C48 -104 52 -70 50 -24 Z" fill="url(#dress)" stroke="#8f3d58" stroke-width="2.5"/>
    <g stroke="#f8a9b6" stroke-opacity=".45" stroke-width="2" fill="none">
      <path d="M-22 -10 Q-30 50 -38 112"/><path d="M22 -10 Q30 50 38 112"/>
    </g>
    <!-- руки -->
    <g stroke="url(#skin)" stroke-width="20" stroke-linecap="round" fill="none">
      <path d="M-46 -106 L-100 -48 L-118 -102"/>
      <path d="M46 -106 L106 -64 L132 -118"/>
    </g>
    <circle cx="-120" cy="-106" r="12" fill="#f7d6bd"/>
    <circle cx="134" cy="-122" r="12" fill="#f7d6bd"/>
    <!-- мягкие ключицы у ворота -->
    <g stroke="#f8a9b6" stroke-opacity=".45" stroke-width="2" fill="none" stroke-linecap="round">
      <path d="M-26 -112 Q-12 -102 0 -104"/><path d="M26 -112 Q12 -102 0 -104"/>
    </g>
    <!-- лицо: мягкий овал с узким подбородком -->
    <path d="M0 -222 C36 -224 56 -198 56 -166 C56 -140 42 -118 16 -104 C8 -100 -8 -100 -16 -104 C-42 -118 -56 -140 -56 -166 C-56 -198 -36 -224 0 -222 Z" fill="url(#skin)" stroke="#dfa98c" stroke-width="2"/>
    <ellipse cx="38" cy="-162" rx="20" ry="44" fill="url(#cheekShade)"/>
    <ellipse cx="-30" cy="-146" rx="17" ry="11" fill="url(#blush)"/>
    <ellipse cx="30" cy="-146" rx="17" ry="11" fill="url(#blush)"/>
    <!-- веснушки -->
    <g fill="#b87c66" opacity=".35">
      <circle cx="-26" cy="-152" r="1.5"/><circle cx="-20" cy="-149" r="1.5"/><circle cx="-14" cy="-152" r="1.5"/>
      <circle cx="20" cy="-152" r="1.5"/><circle cx="26" cy="-149" r="1.5"/>
    </g>
    <!-- глаза: миндалевидные, с ореховой радужкой -->
    <g>
      <path d="M-33 -167 Q-20 -184 -7 -167 Q-20 -155 -33 -167 Z" fill="#fffaf4"/>
      <circle cx="-20" cy="-168" r="7.4" fill="url(#iris)"/>
      <circle cx="-20" cy="-168" r="3.2" fill="#241f26"/>
      <circle cx="-22.6" cy="-170.6" r="2.3" fill="#fff"/>
      <circle cx="-17" cy="-165" r="1.1" fill="#fff" opacity=".65"/>
      <path d="M-33 -167 Q-20 -184 -7 -167" stroke="#3f3040" stroke-width="2.3" fill="none" stroke-linecap="round"/>
      <path d="M-33 -167 Q-20 -155 -7 -167" stroke="#c58d80" stroke-opacity=".65" stroke-width="1.3" fill="none"/>
      <path d="M-34 -171 l-4 -4 M-8 -171 l4 -4" stroke="#3f3040" stroke-width="1.7" stroke-linecap="round"/>
    </g>
    <g>
      <path d="M7 -167 Q20 -184 33 -167 Q20 -155 7 -167 Z" fill="#fffaf4"/>
      <circle cx="20" cy="-168" r="7.4" fill="url(#iris)"/>
      <circle cx="20" cy="-168" r="3.2" fill="#241f26"/>
      <circle cx="17.4" cy="-170.6" r="2.3" fill="#fff"/>
      <circle cx="23" cy="-165" r="1.1" fill="#fff" opacity=".65"/>
      <path d="M7 -167 Q20 -184 33 -167" stroke="#3f3040" stroke-width="2.3" fill="none" stroke-linecap="round"/>
      <path d="M7 -167 Q20 -155 33 -167" stroke="#c58d80" stroke-opacity=".65" stroke-width="1.3" fill="none"/>
      <path d="M8 -171 l-4 -4 M34 -171 l4 -4" stroke="#3f3040" stroke-width="1.7" stroke-linecap="round"/>
    </g>
    <!-- брови -->
    <path d="M-34 -184 Q-20 -195 -6 -182 Q-20 -188 -34 -181 Z" fill="#4a3034"/>
    <path d="M6 -182 Q20 -195 34 -184 Q20 -188 6 -179 Z" fill="#4a3034"/>
    <!-- нос и губы -->
    <path d="M2 -158 Q5 -150 1 -147" stroke="#d9a187" stroke-width="2" fill="none" stroke-linecap="round"/>
    <ellipse cx="-2" cy="-147" rx="2.4" ry="1.5" fill="#fff4e2" opacity=".65"/>
    <path d="M-11 -134 Q-6 -142 -2 -137 Q0 -134 2 -137 Q6 -142 11 -134 Q6 -125 0 -125 Q-6 -125 -11 -134 Z" fill="url(#lip)"/>
    <path d="M-11 -134 Q0 -131 11 -134" stroke="#7a3440" stroke-opacity=".6" stroke-width="1.1" fill="none"/>
    <!-- серёжки -->
    <g stroke="#d8ac63" stroke-width="2" fill="none">
      <circle cx="-56" cy="-150" r="5"/><circle cx="56" cy="-150" r="5"/>
    </g>
    <circle cx="-56" cy="-144" r="2.2" fill="#ffe6a8"/><circle cx="56" cy="-144" r="2.2" fill="#ffe6a8"/>
    <!-- косая чёлка и пряди у лица -->
    <path d="M-56 -186 C-62 -238 -16 -250 4 -226 C28 -250 60 -230 56 -182 C46 -198 32 -204 16 -204 C-2 -192 -28 -188 -56 -186 Z" fill="url(#hair2)"/>
    <path d="M-14 -236 C6 -234 26 -222 38 -204" stroke="#a9715f" stroke-opacity=".35" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M-54 -180 C-66 -110 -60 -18 -42 26 L-28 20 C-42 -20 -46 -100 -40 -182 Z" fill="url(#hair)"/>
    <path d="M54 -180 C66 -110 60 -18 42 26 L28 20 C42 -20 46 -100 40 -182 Z" fill="url(#hair)"/>
  </g>
  <!-- узлы-точки анимации вокруг -->
  <g fill="#ffd0dc">
    <circle cx="880" cy="300" r="6"/><circle cx="900" cy="240" r="4"/><circle cx="1250" cy="250" r="6"/>
    <circle cx="1290" cy="330" r="4"/><circle cx="870" cy="540" r="5"/><circle cx="1260" cy="600" r="5"/>
  </g>
  <g stroke="#ffd0dc" stroke-opacity=".35" fill="none">
    <path d="M880 300 L900 240 L1000 210"/><path d="M1250 250 L1290 330 L1310 420"/><path d="M870 540 L930 610"/><path d="M1260 600 L1210 660"/>
  </g>
  <rect x="24" y="24" width="1392" height="762" rx="24" fill="none" stroke="#ffd0dc" stroke-opacity=".22" stroke-width="2"/>
</svg>
