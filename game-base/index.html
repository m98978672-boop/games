<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>БАЗА — каркас всех игр: мини-игра «Светлячки»</title>
<meta name="description" content="БАЗА — самая простая игра-шаблон репозитория: единый дизайн (shared/theme.css) и готовый HUD-скелет, на основе которого создаются все остальные игры. Внутри — мини-игра «Светлячки»: лови светлячков кликом и собирай комбо.">
<meta name="theme-color" content="#0b0d0c">
<meta property="og:type" content="website">
<meta property="og:title" content="БАЗА — каркас всех игр">
<meta property="og:description" content="Простая игра-шаблон с единым дизайном всех игр: лови светлячков, собирай комбо, ставь рекорд. По этой базе делаются новые игры.">
<meta property="og:image" content="cover.svg">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b0d0c'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23ffd98a'/%3E%3Ccircle cx='16' cy='16' r='11' fill='none' stroke='%23e8b45a' stroke-opacity='.45' stroke-width='2'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- SVG-фильтр «набросок от руки»: лёгкое дрожание контуров мелких HUD-элементов -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <filter id="sketch" x="-6%" y="-6%" width="112%" height="112%">
    <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="7" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="2.4" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>

<!-- Игровое поле: canvas на весь экран под HUD -->
<canvas id="game" aria-label="Игровое поле: кликай по светлячкам, пока они не погасли"></canvas>

<!-- Единый HUD-скелет всех игр (см. shared/theme.css) -->
<header class="topbar">
  <a class="brand" href="../index.html" title="Все игры">
    <span class="logo">Б</span>
    <span class="brand-text"><b>БАЗА</b><i>каркас игр · светлячки</i></span>
  </a>

  <div class="top-stats">
    <div class="stat accent">
      <span>Очки</span>
      <b id="hud-score">0</b>
    </div>
    <div class="stat">
      <span>Рекорд</span>
      <b id="hud-best">0</b>
    </div>
    <div class="stat">
      <span>Комбо</span>
      <b id="hud-combo">×1</b>
    </div>
    <div class="stat">
      <span>Время</span>
      <b id="hud-time">60</b>
    </div>
  </div>

  <div class="top-actions">
    <button id="btn-pause" class="icon-btn" title="Пауза (Пробел)" aria-label="Пауза">⏸</button>
    <button id="btn-restart" class="icon-btn" title="Новый раунд (R)" aria-label="Новый раунд">↻</button>
    <button id="btn-sound" class="icon-btn" title="Звук (M)" aria-label="Звук">🔊</button>
    <button id="btn-save" class="icon-btn" title="Сохранить (S)" aria-label="Сохранить">💾</button>
    <button id="btn-help" class="icon-btn" title="Как играть (H)" aria-label="Помощь">?</button>
  </div>
</header>

<div id="save-indicator">● автосохранение</div>

<aside class="panel side" id="side" aria-label="Состояние раунда"></aside>

<div class="bottom-bar">
  <div id="hint" class="chip hint"></div>
  <div id="news" class="chip news"></div>
</div>

<div id="pause-flag" class="pause-flag">ПАУЗА · ПРОБЕЛ</div>
<div id="toasts" class="toasts" aria-live="polite"></div>
<div id="modal-root" class="modal-root"></div>

<noscript><p style="color:#f2ecdf;padding:24px">Для игры нужен JavaScript.</p></noscript>

<!-- Обычные скрипты без сборки: порядок важен, каждый добавляет своё в window.GB -->
<script src="src/config.js"></script>
<script src="src/util.js"></script>
<script src="src/save.js"></script>
<script src="src/audio.js"></script>
<script src="src/game.js"></script>
<script src="src/render.js"></script>
<script src="src/ui.js"></script>
<script src="src/main.js"></script>
</body>
</html>
