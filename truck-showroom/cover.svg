<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 810" width="1440" height="810" role="img" aria-label="ГАРАЖ 3D — шоурум тягачей, прицепов и автомобилей">
  <defs>
    <radialGradient id="bg" cx="50%" cy="28%" r="80%">
      <stop offset="0" stop-color="#1d272d"/>
      <stop offset="0.55" stop-color="#0e1315"/>
      <stop offset="1" stop-color="#060808"/>
    </radialGradient>
    <radialGradient id="floor" cx="50%" cy="50%" r="60%">
      <stop offset="0" stop-color="#2c353b"/>
      <stop offset="1" stop-color="#0a0d0e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffeec4"/>
      <stop offset="0.45" stop-color="#e8b45a"/>
      <stop offset="1" stop-color="#a87a2c"/>
    </linearGradient>
    <linearGradient id="gold2" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#fff3d6"/>
      <stop offset="0.5" stop-color="#e8b45a"/>
      <stop offset="1" stop-color="#b97f2c"/>
    </linearGradient>
    <linearGradient id="cab" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#2f6ea8"/>
      <stop offset="0.5" stop-color="#1b4f8a"/>
      <stop offset="1" stop-color="#102a4a"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#bcd9e8" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#5d8296" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="trailer" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#eef1f0"/>
      <stop offset="0.6" stop-color="#cfd6d6"/>
      <stop offset="1" stop-color="#9faaac"/>
    </linearGradient>
    <linearGradient id="floorLine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8b45a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#e8b45a" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="1440" height="810" fill="url(#bg)"/>
  <!-- софиты -->
  <g opacity="0.5">
    <ellipse cx="330" cy="70" rx="210" ry="26" fill="#fff2d6" filter="url(#soft)"/>
    <ellipse cx="1090" cy="60" rx="260" ry="22" fill="#dff1ff" filter="url(#soft)"/>
    <ellipse cx="720" cy="130" rx="420" ry="30" fill="#ffe9c4" opacity="0.5" filter="url(#soft)"/>
  </g>
  <!-- пол и подиум -->
  <ellipse cx="720" cy="640" rx="700" ry="210" fill="url(#floor)"/>
  <ellipse cx="720" cy="632" rx="580" ry="96" fill="#141a1d"/>
  <ellipse cx="720" cy="628" rx="580" ry="96" fill="none" stroke="#e8b45a" stroke-opacity="0.55" stroke-width="3"/>
  <ellipse cx="720" cy="628" rx="470" ry="70" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="2"/>
  <!-- сетка на полу -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="2">
    <path d="M120 700 L720 560 L1320 700"/>
    <path d="M200 760 L720 620 L1240 760"/>
    <path d="M420 810 L700 610 L1000 810"/>
  </g>

  <!-- прицеп сзади -->
  <g transform="translate(880 300) scale(0.92)">
    <rect x="0" y="60" width="470" height="230" rx="10" fill="url(#trailer)"/>
    <g stroke="#9aa4a6" stroke-opacity="0.65" stroke-width="3">
      <path d="M40 66 V284"/><path d="M88 66 V284"/><path d="M136 66 V284"/><path d="M184 66 V284"/>
      <path d="M232 66 V284"/><path d="M280 66 V284"/><path d="M328 66 V284"/><path d="M376 66 V284"/><path d="M424 66 V284"/>
    </g>
    <rect x="0" y="50" width="470" height="18" rx="8" fill="#e8ecec"/>
    <rect x="0" y="286" width="470" height="14" fill="#394349"/>
    <text x="24" y="150" fill="#3c4a52" font-family="Arial, sans-serif" font-size="34" font-weight="bold" letter-spacing="6">TRAILGO</text>
    <text x="24" y="188" fill="#7d8b93" font-family="Arial, sans-serif" font-size="18" letter-spacing="4">30 ЛЕТ НА ТРАССЕ</text>
    <g fill="#1d2226">
      <circle cx="80" cy="322" r="34"/><circle cx="176" cy="322" r="34"/><circle cx="272" cy="322" r="34"/><circle cx="368" cy="322" r="34"/>
    </g>
    <g fill="#c7ced1">
      <circle cx="80" cy="322" r="15"/><circle cx="176" cy="322" r="15"/><circle cx="272" cy="322" r="15"/><circle cx="368" cy="322" r="15"/>
    </g>
  </g>

  <!-- тягач -->
  <g transform="translate(250 236)">
    <!-- кабина -->
    <path d="M150 96 L352 96 Q380 96 380 124 L380 300 L120 300 L120 150 Q120 96 150 96 Z" fill="url(#cab)"/>
    <!-- надстройка-спальник -->
    <path d="M126 96 L374 96 Q396 96 396 118 L396 150 L112 150 L112 118 Q112 96 126 96 Z" fill="#245a92"/>
    <!-- лобовое и окна -->
    <path d="M150 158 L352 158 L352 210 L150 210 Z" fill="url(#glass)"/>
    <rect x="146" y="156" width="212" height="7" fill="#0d1b2b" opacity="0.6"/>
    <!-- дефлектор -->
    <path d="M112 150 L396 150 L372 178 L128 178 Z" fill="#1a4a7c" opacity="0.9"/>
    <!-- облицовка -->
    <rect x="128" y="230" width="240" height="70" rx="8" fill="#0e1620"/>
    <g fill="#cfd6da" opacity="0.9">
      <rect x="142" y="240" width="212" height="6" rx="3"/>
      <rect x="142" y="254" width="212" height="6" rx="3"/>
      <rect x="142" y="268" width="212" height="6" rx="3"/>
      <rect x="142" y="282" width="212" height="6" rx="3"/>
    </g>
    <rect x="330" y="238" width="48" height="12" rx="6" fill="#e8b45a" opacity="0.85"/>
    <!-- бампер -->
    <rect x="112" y="300" width="286" height="34" rx="12" fill="#e6eaec"/>
    <rect x="112" y="300" width="286" height="10" rx="5" fill="#ffffff" opacity="0.7"/>
    <!-- фары -->
    <g filter="url(#glow)">
      <rect x="132" y="212" width="86" height="16" rx="8" fill="#fff6dc"/>
      <rect x="290" y="212" width="70" height="16" rx="8" fill="#fff6dc"/>
    </g>
    <!-- зеркала -->
    <rect x="372" y="170" width="14" height="56" rx="6" fill="#10171f"/>
    <rect x="106" y="170" width="14" height="56" rx="6" fill="#10171f"/>
    <!-- шасси и баки -->
    <rect x="380" y="330" width="330" height="20" rx="8" fill="#1b2228"/>
    <rect x="392" y="352" width="330" height="26" rx="10" fill="#c9d2d6"/>
    <g fill="#0d1012">
      <circle cx="290" cy="352" r="52"/><circle cx="452" cy="352" r="52"/><circle cx="540" cy="352" r="52"/>
    </g>
    <g fill="#c6cdd1">
      <circle cx="290" cy="352" r="22"/><circle cx="452" cy="352" r="22"/><circle cx="540" cy="352" r="22"/>
    </g>
    <g fill="#161b1f">
      <circle cx="290" cy="352" r="40"/><circle cx="452" cy="352" r="40"/><circle cx="540" cy="352" r="40"/>
    </g>
    <g fill="#e6eaec">
      <circle cx="290" cy="352" r="17"/><circle cx="452" cy="352" r="17"/><circle cx="540" cy="352" r="17"/>
    </g>
    <!-- седло -->
    <rect x="556" y="300" width="120" height="18" rx="9" fill="#2a343a"/>
  </g>

  <!-- отражение/тень -->
  <ellipse cx="700" cy="636" rx="470" ry="52" fill="#000" opacity="0.45"/>

  <!-- название -->
  <g transform="translate(96 96)">
    <text x="0" y="0" fill="#9aa39a" font-family="Arial, sans-serif" font-size="17" letter-spacing="7">3D-ШОУРУМ ТЕХНИКИ</text>
    <text x="0" y="88" fill="url(#gold2)" font-family="Arial, sans-serif" font-size="92" font-weight="bold" letter-spacing="2">ГАРАЖ 3D</text>
    <text x="2" y="130" fill="#d8d3c6" font-family="Arial, sans-serif" font-size="23" letter-spacing="3">10 ТЯГАЧЕЙ · 20 ПРИЦЕПОВ · 10 АВТОМОБИЛЕЙ</text>
    <g transform="translate(2 160)">
      <rect x="0" y="0" width="168" height="46" rx="23" fill="#e8b45a"/>
      <text x="84" y="30" text-anchor="middle" fill="#241a06" font-family="Arial, sans-serif" font-size="19" font-weight="bold">ВНУТРИ САЛОНА</text>
      <rect x="182" y="0" width="150" height="46" rx="23" fill="none" stroke="#6a6f66" stroke-width="2"/>
      <text x="257" y="30" text-anchor="middle" fill="#d8d3c6" font-family="Arial, sans-serif" font-size="19">СНАРУЖИ</text>
    </g>
  </g>

  <!-- подпись снизу -->
  <text x="720" y="778" text-anchor="middle" fill="#7f877f" font-family="Arial, sans-serif" font-size="18" letter-spacing="4">МОДЕЛИ СОБРАНЫ КОДОМ · THREE.JS · РАБОТАЕТ ОФЛАЙН</text>
</svg>
