<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" role="img" aria-label="СЕКТОР ПЕПЕЛ — шутер с 1760 анимациями">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d141b"/>
      <stop offset="0.55" stop-color="#2a1c12"/>
      <stop offset="1" stop-color="#120f0d"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.72" cy="0.30" r="0.42">
      <stop offset="0" stop-color="#ffbf6b" stop-opacity="0.85"/>
      <stop offset="0.45" stop-color="#ff8a3c" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ff6a1e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a332a"/>
      <stop offset="1" stop-color="#1b1814"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffcf6b"/>
      <stop offset="1" stop-color="#ff6a1e"/>
    </linearGradient>
    <linearGradient id="soldier" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a6448"/>
      <stop offset="1" stop-color="#2c3126"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>

  <rect width="1200" height="680" fill="url(#sky)"/>
  <rect width="1200" height="680" fill="url(#sun)"/>

  <!-- дым и пыль -->
  <g opacity="0.5" filter="url(#blur)">
    <ellipse cx="240" cy="300" rx="150" ry="52" fill="#4a3a2a" opacity="0.5"/>
    <ellipse cx="980" cy="250" rx="180" ry="46" fill="#5a4028" opacity="0.45"/>
    <ellipse cx="640" cy="205" rx="230" ry="40" fill="#6a4a2c" opacity="0.32"/>
  </g>

  <!-- дальние краны порта -->
  <g stroke="#0f1317" stroke-width="10" fill="none" opacity="0.9">
    <path d="M120 470 L120 250 L300 250 M120 290 L250 260 M200 250 L200 400"/>
    <path d="M1010 470 L1010 270 L1160 270 M1010 310 L1120 285"/>
  </g>

  <!-- складские стены -->
  <g>
    <rect x="60" y="360" width="380" height="180" fill="#23201a"/>
    <rect x="60" y="360" width="380" height="14" fill="#3a3428"/>
    <g fill="#14120f">
      <rect x="100" y="400" width="46" height="140"/>
      <rect x="170" y="400" width="46" height="140"/>
      <rect x="240" y="400" width="46" height="140"/>
      <rect x="310" y="400" width="46" height="140"/>
    </g>
    <rect x="700" y="330" width="300" height="210" fill="#1e1c18"/>
    <rect x="700" y="330" width="300" height="12" fill="#37322a"/>
    <g fill="#111110">
      <rect x="730" y="380" width="52" height="160"/>
      <rect x="880" y="380" width="52" height="160"/>
    </g>
  </g>

  <!-- земля -->
  <rect y="520" width="1200" height="160" fill="url(#ground)"/>
  <g stroke="#4a4034" stroke-width="2" opacity="0.5">
    <path d="M0 556 H1200 M0 604 H1200"/>
  </g>
  <g stroke="#5c5040" stroke-width="3" opacity="0.4">
    <path d="M300 520 L180 680 M520 520 L470 680 M760 520 L830 680 M1000 520 L1090 680"/>
  </g>

  <!-- ящики -->
  <g>
    <g transform="translate(120 470)">
      <rect width="90" height="70" fill="#5b452a" stroke="#2a2117" stroke-width="4"/>
      <path d="M0 18 H90 M0 52 H90" stroke="#2a2117" stroke-width="4"/>
      <path d="M14 0 V70 M76 0 V70" stroke="#2a2117" stroke-width="3" opacity="0.7"/>
    </g>
    <g transform="translate(180 440)">
      <rect width="72" height="56" fill="#6a5130" stroke="#2a2117" stroke-width="4"/>
      <path d="M0 20 H72" stroke="#2a2117" stroke-width="4"/>
    </g>
    <g transform="translate(940 466)">
      <rect width="96" height="74" fill="#5b452a" stroke="#2a2117" stroke-width="4"/>
      <path d="M0 22 H96 M0 56 H96" stroke="#2a2117" stroke-width="4"/>
    </g>
  </g>

  <!-- дорожка трассера -->
  <g stroke="url(#accent)" stroke-width="4" opacity="0.9">
    <path d="M560 300 L900 372"/>
  </g>
  <circle cx="560" cy="300" r="10" fill="#fff2c4" opacity="0.9"/>
  <circle cx="560" cy="300" r="26" fill="#ffb347" opacity="0.28"/>

  <!-- два бойца: силуэты из тех же примитивов, что и в игре -->
  <g transform="translate(430 300) scale(1.05)">
    <!-- ноги -->
    <rect x="18" y="150" width="20" height="70" rx="6" fill="#2d3327"/>
    <rect x="46" y="150" width="20" height="70" rx="6" fill="#262b21"/>
    <rect x="14" y="212" width="28" height="14" rx="4" fill="#15181a"/>
    <rect x="44" y="212" width="28" height="14" rx="4" fill="#15181a"/>
    <!-- корпус -->
    <rect x="14" y="72" width="58" height="82" rx="8" fill="url(#soldier)"/>
    <rect x="20" y="82" width="46" height="62" rx="6" fill="#1c2022"/>
    <rect x="24" y="86" width="16" height="42" rx="3" fill="#b2483a"/>
    <rect x="46" y="86" width="16" height="42" rx="3" fill="#b2483a"/>
    <rect x="24" y="92" width="38" height="8" rx="3" fill="#e6e6e6" opacity="0.85"/>
    <circle cx="24" cy="80" r="6" fill="#ffb347"/>
    <!-- голова -->
    <circle cx="43" cy="52" r="17" fill="#c9a184"/>
    <path d="M24 50 A19 19 0 0 1 62 50 Z" fill="#333a2c"/>
    <rect x="26" y="50" width="34" height="10" rx="3" fill="#23282c"/>
    <rect x="52" y="52" width="6" height="4" rx="2" fill="#b2483a"/>
    <!-- руки и оружие -->
    <rect x="58" y="86" width="16" height="42" rx="6" fill="#3c4433" transform="rotate(-24 66 86)"/>
    <rect x="2" y="86" width="16" height="40" rx="6" fill="#3c4433" transform="rotate(26 10 86)"/>
    <rect x="52" y="98" width="54" height="12" rx="3" fill="#22262a"/>
    <rect x="96" y="96" width="26" height="6" rx="3" fill="#3a4147"/>
    <rect x="60" y="108" width="14" height="18" rx="2" fill="#4a3320"/>
  </g>

  <g transform="translate(760 320) scale(0.92)">
    <rect x="18" y="150" width="20" height="68" rx="6" fill="#242920"/>
    <rect x="48" y="152" width="20" height="66" rx="6" fill="#2b3126"/>
    <rect x="14" y="210" width="28" height="14" rx="4" fill="#111416"/>
    <rect x="46" y="210" width="28" height="14" rx="4" fill="#111416"/>
    <rect x="14" y="72" width="58" height="80" rx="8" fill="#333b2c"/>
    <rect x="20" y="84" width="46" height="58" rx="6" fill="#191d1f"/>
    <rect x="24" y="88" width="16" height="38" rx="3" fill="#8c3a2f"/>
    <rect x="46" y="88" width="16" height="38" rx="3" fill="#8c3a2f"/>
    <circle cx="43" cy="52" r="17" fill="#c09a7e"/>
    <path d="M25 50 A18 18 0 0 1 61 50 Z" fill="#2a3025"/>
    <rect x="27" y="50" width="32" height="9" rx="3" fill="#1e2226"/>
    <rect x="58" y="88" width="16" height="40" rx="6" fill="#39412f" transform="rotate(-18 66 88)"/>
    <rect x="2" y="88" width="16" height="38" rx="6" fill="#39412f" transform="rotate(18 10 88)"/>
    <rect x="54" y="100" width="48" height="11" rx="3" fill="#1d2124"/>
    <rect x="94" y="98" width="22" height="5" rx="2" fill="#333a40"/>
  </g>

  <!-- вспышка выстрела у правого бойца -->
  <circle cx="880" cy="368" r="16" fill="#fff0c0" opacity="0.95"/>
  <circle cx="880" cy="368" r="34" fill="#ffb347" opacity="0.3"/>

  <!-- облако мыслей: «больно думать» -->
  <g opacity="0.95">
    <circle cx="806" cy="228" r="7" fill="#0e1216" stroke="#ff9a3c" stroke-width="2"/>
    <circle cx="820" cy="210" r="10" fill="#0e1216" stroke="#ff9a3c" stroke-width="2"/>
    <rect x="792" y="150" width="196" height="52" rx="16" fill="#0e1216" stroke="#ff9a3c" stroke-width="2"/>
    <text x="890" y="181" font-family="Segoe UI, Arial, sans-serif" font-size="19" fill="#ffdcb0" text-anchor="middle">«Он у ящиков?»</text>
    <text x="890" y="196" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8b98a7" text-anchor="middle">думает 0.85 с…</text>
  </g>

  <!-- кукла из точек -->
  <g opacity="0.9">
    <g stroke="#ff9a3c" stroke-width="2" opacity="0.75">
      <path d="M300 596 L318 578 L340 586 L360 606 L346 626 L320 628 Z"/>
      <path d="M318 578 L300 560 M318 578 L338 556 M340 586 L372 578 M360 606 L392 612"/>
    </g>
    <g fill="#ffd166">
      <circle cx="300" cy="596" r="4"/><circle cx="318" cy="578" r="4"/><circle cx="340" cy="586" r="4"/>
      <circle cx="360" cy="606" r="4"/><circle cx="346" cy="626" r="4"/><circle cx="320" cy="628" r="4"/>
      <circle cx="300" cy="560" r="4"/><circle cx="338" cy="556" r="4"/><circle cx="372" cy="578" r="4"/>
      <circle cx="392" cy="612" r="4"/>
    </g>
  </g>

  <!-- заголовок -->
  <g>
    <rect x="52" y="42" width="4" height="74" fill="url(#accent)"/>
    <text x="76" y="70" font-family="Segoe UI, Arial, sans-serif" font-size="15" letter-spacing="6" fill="#ff9a3c">ТАКТИЧЕСКИЙ ШУТЕР · 6 МИССИЙ</text>
    <text x="76" y="112" font-family="Segoe UI, Arial, sans-serif" font-size="46" font-weight="800" letter-spacing="1" fill="#f2f6fa">СЕКТОР «ПЕПЕЛ»</text>
  </g>

  <!-- плашки с ключевыми цифрами -->
  <g font-family="Segoe UI, Arial, sans-serif">
    <g transform="translate(52 148)">
      <rect width="196" height="52" rx="12" fill="#0c1116" opacity="0.86" stroke="#2b343e"/>
      <text x="16" y="24" font-size="20" font-weight="800" fill="#ffcf6b">1760</text>
      <text x="16" y="42" font-size="11" fill="#8b98a7">АНИМАЦИЙ · 22×20×4</text>
    </g>
    <g transform="translate(262 148)">
      <rect width="180" height="52" rx="12" fill="#0c1116" opacity="0.86" stroke="#2b343e"/>
      <text x="16" y="24" font-size="20" font-weight="800" fill="#ffcf6b">17</text>
      <text x="42" y="24" font-size="11" fill="#8b98a7">точек в кукле</text>
      <text x="16" y="42" font-size="11" fill="#8b98a7">Verlet + сон + подшаги</text>
    </g>
    <g transform="translate(52 212)">
      <rect width="216" height="34" rx="10" fill="#0c1116" opacity="0.8" stroke="#2b343e"/>
      <text x="14" y="22" font-size="12" fill="#cfe7ff">Собственные модели и оружие</text>
    </g>
  </g>

  <!-- нижняя полоса -->
  <rect y="640" width="1200" height="40" fill="#080b0f" opacity="0.9"/>
  <text x="52" y="666" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#6f7d8b">Без установки · работает офлайн · оптимизация без потери видимой графики</text>
  <text x="1150" y="666" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#ff9a3c" text-anchor="end">shooter-2</text>
</svg>
