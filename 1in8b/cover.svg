<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-label="1 ИЗ 8 МИЛЛИАРДОВ — симулятор одной случайной жизни на Земле">
  <defs>
    <radialGradient id="bg" cx="52%" cy="36%" r="80%">
      <stop offset="0" stop-color="#14211a"/><stop offset="0.52" stop-color="#0c110f"/><stop offset="1" stop-color="#050706"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#e8b45a" stop-opacity=".46"/>
      <stop offset="0.4" stop-color="#e8b45a" stop-opacity=".12"/>
      <stop offset="1" stop-color="#e8b45a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#ffe9b4"/><stop offset="0.5" stop-color="#e8b45a"/><stop offset="1" stop-color="#bd8133"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#cdc4b2"/>
    </linearGradient>

    <pattern id="p1" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="5" r="1.5" fill="#f2ecdf"/><circle cx="17" cy="9" r="1.3" fill="#f2ecdf"/>
      <circle cx="9" cy="19" r="1.5" fill="#f2ecdf"/><circle cx="22" cy="22" r="1.2" fill="#f2ecdf"/>
    </pattern>
    <pattern id="p2" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="7" r="2.3" fill="#f2ecdf"/><circle cx="21" cy="12" r="2" fill="#f2ecdf"/>
      <circle cx="12" cy="23" r="2.4" fill="#f2ecdf"/><circle cx="26" cy="26" r="1.9" fill="#f2ecdf"/>
    </pattern>
    <pattern id="p3" width="38" height="38" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="9" r="3.3" fill="#f2ecdf"/><circle cx="27" cy="15" r="2.9" fill="#f2ecdf"/>
      <circle cx="15" cy="29" r="3.4" fill="#f2ecdf"/><circle cx="33" cy="33" r="2.6" fill="#f2ecdf"/>
    </pattern>

    <linearGradient id="fadeTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity=".30"/>
    </linearGradient>
    <linearGradient id="fadeMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".30"/><stop offset="1" stop-color="#fff" stop-opacity=".46"/>
    </linearGradient>
    <linearGradient id="fadeLow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".46"/><stop offset="0.7" stop-color="#fff" stop-opacity=".38"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="m1"><rect x="0" y="70" width="1440" height="190" fill="url(#fadeTop)"/></mask>
    <mask id="m2"><rect x="0" y="260" width="1440" height="190" fill="url(#fadeMid)"/></mask>
    <mask id="m3"><rect x="0" y="450" width="1440" height="210" fill="url(#fadeLow)"/></mask>

    <mask id="clearLeft">
      <rect x="0" y="0" width="1440" height="810" fill="#fff"/>
      <ellipse cx="340" cy="360" rx="470" ry="270" fill="#000" opacity=".9"/>
      <ellipse cx="760" cy="520" rx="330" ry="150" fill="#000" opacity=".8"/>
      <circle cx="1132" cy="300" r="92" fill="#000"/>
      <rect x="0" y="628" width="1440" height="182" fill="#000" opacity=".92"/>
    </mask>

    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="1440" height="810" fill="url(#bg)"/>

  <!-- толпа: три полосы с разным масштабом точек -->
  <g mask="url(#clearLeft)" opacity=".92">
    <g mask="url(#m1)"><rect x="0" y="70" width="1440" height="190" fill="url(#p1)"/></g>
    <g mask="url(#m2)"><rect x="0" y="260" width="1440" height="190" fill="url(#p2)"/></g>
    <g mask="url(#m3)"><rect x="0" y="450" width="1440" height="210" fill="url(#p3)"/></g>
  </g>

  <!-- отдельные судьбы вокруг -->
  <g fill="#f2ecdf">
    <circle cx="880" cy="150" r="2.4" opacity=".5"/><circle cx="1290" cy="176" r="2.2" opacity=".45"/>
    <circle cx="1010" cy="520" r="3.4" opacity=".45"/><circle cx="1336" cy="470" r="3" opacity=".4"/>
    <circle cx="1210" cy="112" r="2" opacity=".4"/><circle cx="884" cy="432" r="2.8" opacity=".38"/>
  </g>

  <!-- выбранный человек -->
  <g>
    <circle cx="1132" cy="300" r="200" fill="url(#halo)"/>
    <circle cx="1132" cy="300" r="104" fill="none" stroke="#e8b45a" stroke-opacity=".18" stroke-width="1.5"/>
    <circle cx="1132" cy="300" r="70" fill="none" stroke="#e8b45a" stroke-opacity=".32" stroke-width="1.8"/>
    <circle cx="1132" cy="300" r="42" fill="none" stroke="#e8b45a" stroke-opacity=".6" stroke-width="2.2"/>
    <circle cx="1132" cy="300" r="21" fill="#e8b45a" opacity=".5" filter="url(#soft)"/>
    <circle cx="1132" cy="300" r="13" fill="url(#gold)"/>
    <circle cx="1127.5" cy="295.5" r="3.8" fill="#fff6e0" opacity=".9"/>
    <path d="M1132 236 v-28" stroke="#e8b45a" stroke-opacity=".5" stroke-width="1.6"/>
    <text x="1132" y="190" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="26"
          fill="#e8b45a" letter-spacing="6" textLength="128" lengthAdjust="spacingAndGlyphs">ЭТО ВЫ</text>
    <text x="1132" y="438" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="19"
          fill="#f2ecdf" opacity=".6" textLength="300" lengthAdjust="spacingAndGlyphs">один человек из 8 040 000 000</text>
  </g>

  <!-- заголовок -->
  <g font-family="Georgia, 'Times New Roman', serif">
    <text x="96" y="208" font-size="24" fill="#e8b45a" textLength="420" lengthAdjust="spacingAndGlyphs">СИМУЛЯТОР ОДНОЙ ЖИЗНИ</text>
    <text x="92" y="326" font-size="124" font-weight="bold" fill="url(#ink)" textLength="330" lengthAdjust="spacingAndGlyphs">1 ИЗ 8</text>
    <text x="92" y="432" font-size="88" font-weight="bold" fill="url(#gold)" textLength="652" lengthAdjust="spacingAndGlyphs">МИЛЛИАРДОВ</text>
    <path d="M96 468 h556" stroke="#e8b45a" stroke-opacity=".42" stroke-width="2"/>
    <text x="96" y="514" font-size="25" fill="#f2ecdf" opacity=".78" textLength="556" lengthAdjust="spacingAndGlyphs">Вы рождаетесь случайным человеком на Земле.</text>
    <text x="96" y="552" font-size="25" fill="#f2ecdf" opacity=".78" textLength="640" lengthAdjust="spacingAndGlyphs">173 страны, реальная статистика, одна жизнь — год за годом.</text>
  </g>

  <!-- карта жизни -->
  <g transform="translate(96,626)" font-family="Georgia, 'Times New Roman', serif">
    <text x="0" y="0" font-size="15" fill="#f2ecdf" opacity=".42" textLength="300" lengthAdjust="spacingAndGlyphs">КАРТА ЖИЗНИ · 1 КЛЕТКА = 1 ГОД</text>
    <g transform="translate(0,14)">
      <rect x="0" y="0" width="13" height="13" rx="2.6" fill="#6fd08c" opacity=".85"/><rect x="17" y="0" width="13" height="13" rx="2.6" fill="#6fd08c" opacity=".85"/>
      <rect x="34" y="0" width="13" height="13" rx="2.6" fill="#6fd08c" opacity=".8"/><rect x="51" y="0" width="13" height="13" rx="2.6" fill="#8fd4ff" opacity=".8"/>
      <rect x="68" y="0" width="13" height="13" rx="2.6" fill="#8fd4ff" opacity=".8"/><rect x="85" y="0" width="13" height="13" rx="2.6" fill="#8fd4ff" opacity=".8"/>
      <rect x="102" y="0" width="13" height="13" rx="2.6" fill="#8fd4ff" opacity=".8"/><rect x="119" y="0" width="13" height="13" rx="2.6" fill="#e8b45a" opacity=".9"/>
      <rect x="136" y="0" width="13" height="13" rx="2.6" fill="#e8b45a" opacity=".9"/><rect x="153" y="0" width="13" height="13" rx="2.6" fill="#e8b45a" opacity=".85"/>
      <rect x="170" y="0" width="13" height="13" rx="2.6" fill="#f08ea6" opacity=".85"/><rect x="187" y="0" width="13" height="13" rx="2.6" fill="#f08ea6" opacity=".85"/>
      <rect x="204" y="0" width="13" height="13" rx="2.6" fill="#f08ea6" opacity=".8"/><rect x="221" y="0" width="13" height="13" rx="2.6" fill="#6fd08c" opacity=".7"/>
      <rect x="238" y="0" width="13" height="13" rx="2.6" fill="#6fd08c" opacity=".7"/><rect x="255" y="0" width="13" height="13" rx="2.6" fill="#6fd08c" opacity=".65"/>
      <rect x="272" y="0" width="13" height="13" rx="2.6" fill="#8fd4ff" opacity=".6"/><rect x="289" y="0" width="13" height="13" rx="2.6" fill="#8fd4ff" opacity=".55"/>
      <rect x="306" y="0" width="13" height="13" rx="2.6" fill="#e8b45a" opacity=".5"/><rect x="323" y="0" width="13" height="13" rx="2.6" fill="#e8b45a" opacity=".45"/>
      <rect x="340" y="0" width="13" height="13" rx="2.6" fill="#f2ecdf" opacity=".2"/><rect x="357" y="0" width="13" height="13" rx="2.6" fill="#f2ecdf" opacity=".16"/>
      <rect x="374" y="0" width="13" height="13" rx="2.6" fill="#f2ecdf" opacity=".12"/><rect x="391" y="0" width="13" height="13" rx="2.6" fill="#f2ecdf" opacity=".09"/>
    </g>
  </g>

  <!-- показатели -->
  <g transform="translate(96,706)" font-family="Georgia, 'Times New Roman', serif" font-size="15">
    <g>
      <text x="0" y="0" fill="#f2ecdf" opacity=".6" textLength="72" lengthAdjust="spacingAndGlyphs">Здоровье</text>
      <rect x="0" y="12" width="150" height="7" rx="3.5" fill="#f2ecdf" opacity=".12"/>
      <rect x="0" y="12" width="112" height="7" rx="3.5" fill="#6fd08c"/>
    </g>
    <g transform="translate(176,0)">
      <text x="0" y="0" fill="#f2ecdf" opacity=".6" textLength="64" lengthAdjust="spacingAndGlyphs">Счастье</text>
      <rect x="0" y="12" width="150" height="7" rx="3.5" fill="#f2ecdf" opacity=".12"/>
      <rect x="0" y="12" width="92" height="7" rx="3.5" fill="#e8b45a"/>
    </g>
    <g transform="translate(352,0)">
      <text x="0" y="0" fill="#f2ecdf" opacity=".6" textLength="58" lengthAdjust="spacingAndGlyphs">Знания</text>
      <rect x="0" y="12" width="150" height="7" rx="3.5" fill="#f2ecdf" opacity=".12"/>
      <rect x="0" y="12" width="126" height="7" rx="3.5" fill="#8fd4ff"/>
    </g>
    <g transform="translate(528,0)">
      <text x="0" y="0" fill="#f2ecdf" opacity=".6" textLength="84" lengthAdjust="spacingAndGlyphs">Отношения</text>
      <rect x="0" y="12" width="150" height="7" rx="3.5" fill="#f2ecdf" opacity=".12"/>
      <rect x="0" y="12" width="104" height="7" rx="3.5" fill="#f08ea6"/>
    </g>
  </g>

  <!-- плашки -->
  <g font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#f2ecdf">
    <g transform="translate(894,614)">
      <rect x="0" y="0" width="196" height="42" rx="21" fill="#f2ecdf" opacity=".07"/>
      <rect x="0" y="0" width="196" height="42" rx="21" fill="none" stroke="#f2ecdf" stroke-opacity=".18"/>
      <text x="98" y="27" text-anchor="middle" opacity=".8" textLength="110" lengthAdjust="spacingAndGlyphs">173 страны</text>
    </g>
    <g transform="translate(1106,614)">
      <rect x="0" y="0" width="238" height="42" rx="21" fill="#f2ecdf" opacity=".07"/>
      <rect x="0" y="0" width="238" height="42" rx="21" fill="none" stroke="#f2ecdf" stroke-opacity=".18"/>
      <text x="119" y="27" text-anchor="middle" opacity=".8" textLength="190" lengthAdjust="spacingAndGlyphs">4 рождения в секунду</text>
    </g>
    <g transform="translate(894,672)">
      <rect x="0" y="0" width="450" height="42" rx="21" fill="#e8b45a" opacity=".14"/>
      <rect x="0" y="0" width="450" height="42" rx="21" fill="none" stroke="#e8b45a" stroke-opacity=".4"/>
      <text x="225" y="27" text-anchor="middle" fill="#e8b45a" textLength="390" lengthAdjust="spacingAndGlyphs">деньги · выборы · семья · работа · смерть</text>
    </g>
  </g>

  <rect x="1" y="1" width="1438" height="808" fill="none" stroke="#e8b45a" stroke-opacity=".12" stroke-width="2"/>
</svg>
